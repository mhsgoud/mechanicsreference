<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Continuum balance laws explorer</title><link rel="stylesheet" href="balance-lab.css"><script type="importmap">{"imports":{"three":"/3pb-viewer/vendor/three.module.js"}}</script></head><body><main>
<header><span>BALANCE LAWS · INTERACTIVE EXAMPLES</span><a href="hub.html#balance-laws-conservation" target="_top">Theory ↗</a></header>
<nav aria-label="Select balance law"><button data-mode="mass" aria-pressed="true">01 Mass</button><button data-mode="momentum" aria-pressed="false">02 Linear momentum</button><button data-mode="angular" aria-pressed="false">03 Angular momentum</button><button data-mode="energy" aria-pressed="false">04 Energy</button></nav>
<div class="intro"><h1 id="title"></h1><p id="description"></p></div>
<div class="layout"><section class="visual"><div id="scene" tabindex="0" aria-label="Interactive three dimensional balance law demonstration; drag to orbit"><div id="error" hidden>3D unavailable; calculations and plots remain active.</div><span id="scene-note"></span><button id="reset">Reset view</button></div><div class="metrics"><div><span id="label-a"></span><strong id="value-a"></strong></div><div><span id="label-b"></span><strong id="value-b"></strong></div><div><span id="label-c"></span><strong id="value-c"></strong></div></div></section>
<aside><div class="control"><label for="mass">Body mass <output id="mass-out"></output></label><input id="mass" type="range" min="2" max="10" step=".5" value="4"></div>
<div class="controls-slot"><div id="volume-controls"><label for="volume">Volume ratio J <output id="volume-out"></output></label><input id="volume" type="range" min=".5" max="2" step=".01" value="1.3"><p>Expand or compress the same material particles. Reference volume V₀ = 2 m³.</p></div><div id="force-controls" hidden><label for="force">Applied force F <output id="force-out"></output></label><input id="force" type="range" min="0" max="12" step=".5" value="6"><div id="opposing-control"><label for="opposing">Opposing force Q <output id="opposing-out"></output></label><input id="opposing" type="range" min="0" max="12" step=".5" value="2"></div><p id="force-note"></p></div></div>
<div class="motion-slot"><p id="mass-hint">Double the volume → halve the density.<br>The same material particles remain inside the boundary.</p><div class="scrub"><label for="time">Elapsed time <output id="time-out"></output></label><input id="time" type="range" min="0" max="1" step=".01" value=".65"><button id="play" aria-pressed="false">Play</button></div>
</div><div class="balance"><span id="equation"></span><strong id="check"></strong></div><p id="assumptions"></p></aside></div>
<div class="lower"><section><h2 id="plot-title"></h2><svg id="plot" viewBox="0 0 550 230" role="img" aria-label="Linked plot of the selected balance law"></svg></section><section class="interpret"><span>HOW TO READ THIS EXAMPLE</span><h2 id="read-title"></h2><p id="read-text"></p><div id="terms"></div></section></div>
</main><script type="module" src="balance-lab.js"></script></body></html>
