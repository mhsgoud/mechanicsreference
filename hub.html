    "Finite-strain weak forms can be written on the reference placement or on the current one. The total Lagrangian statement uses the first Piola stress and Ḟ, or S and E, and integrates over the undeformed mesh. The updated Lagrangian statement uses Cauchy stress and the spatial velocity gradient, and integrates over the last accepted configuration.",
    "Both are the same continuum theory. The difference is bookkeeping: whether the quadrature points live on the original element or on a pushed-forward one, and which stress–strain pair the constitutive routine returns. A hyperelastic law written as S = ∂W/∂E is naturally total Lagrangian; an incremental plasticity law written in rate form on the current placement is naturally updated.",
    "The consistent tangent must match the chosen form. Mixing a spatial constitutive rate with a total Lagrangian residual is a common source of spurious dissipation and of Newton iteration that will not converge."
  ], tags:["total Lagrangian","updated Lagrangian","Piola","push forward"]},
  {part:"Part III – Advanced FEM Concepts", title:"Column Buckling", bullets:[
    "A compressed member can lose uniqueness of the trivial straight solution. Linearisation about that solution is an eigenvalue problem for the critical load and the buckling mode. Euler’s formula is the uniform-hinged case.",
    "Geometric stiffness from the pre-stress, not a change in the constitutive law, is what makes the tangent singular. Eccentricity and initial imperfection turn the bifurcation into a smooth limit point; the load–shortening curve then has to be followed, not just eigen-solved.",
    "In shells and plates the same structure appears as many closely spaced eigenvalues. A linear buckling load is a warning, not a capacity, once plasticity or large rotation enters.",
    "The figure is an imperfect Euler strut. Deflection grows as P approaches π² EI / L²; past that load the linear eigenproblem no longer describes the path."
  ], tags:["buckling","Euler","eigenvalue","geometric stiffness"], scene:"columnBuckling"},
  {part:"Part III – Advanced FEM Concepts", title:"Newton–Raphson Iteration in FEM", bullets:[
    "Newton–Raphson linearises the residual at the current guess and solves K_T Δa = −R(a) for a correction. The coefficient matrix is the consistent tangent: the derivative of internal force with respect to the unknowns, including the constitutive linearisation at every quadrature point.",
    "Near the root the convergence is quadratic when that tangent is exact. An approximate tangent — elastic, modified Newton, BFGS — still converges, more slowly, and may stall. Line search keeps a step from increasing the residual when the guess is far from the root.",
    "At snap-through and limit points the tangent itself becomes singular under load control. Arc-length methods, not a better constitutive tangent, are what carry the iteration through those points."
  ], tags:["Newton-Raphson","linearization","tangent stiffness"]},
  {part:"Part III – Advanced FEM Concepts", title:"Path Following and Arc-Length", bullets:[
    "Load control fails at a limit point: the tangent stiffness is singular and a prescribed force increment has no nearby solution. Displacement control fails at a snap-back. Arc-length methods, of which Riks–Wempner and Crisfield are the usual names, treat the load factor λ as an unknown and add a constraint that the increment (Δa, Δλ) has a prescribed length.",
    "The iteration then follows the equilibrium path through folds. The sign of the tangent’s determinant, or of the current stiffness parameter, is used to continue past a bifurcation onto a secondary branch when that is wanted.",
    "Arc-length is a continuation method, not a constitutive one. It does not invent stability. An analysis that reports a load after a snap-through has to say which branch it is on."
  ], tags:["arc-length","Riks","Crisfield","limit point","snap-through"]},
  {part:"Part III – Advanced FEM Concepts", title:"Static Condensation & Schur Complement", bullets:[
    "Internal degrees of freedom that do not couple to neighbouring elements can be eliminated at the element level. Partitioning K into retained and condensed blocks, the Schur complement K_rr − K_rc K_cc⁻¹ K_cr is the stiffness seen by the retained unknowns.",
    "The same block elimination appears in domain decomposition, mixed methods, and the condensation of hierarchical bases. It reduces the global system; it does not change the underlying approximation. Static condensation of a bubble or of an internal pressure does not turn an unstable mixed pair into a stable one."
  ], tags:["Schur","condensation","hierarchical","GPU"]},
  {part:"Part III – Advanced FEM Concepts", title:"Time-Dependent Problems", bullets:[
    "When inertia or rate-dependent constitutive response matters, the discrete system is a set of ordinary differential equations, M ä + C ȧ + R(a) = f. Implicit integrators solve a coupled system at each step; explicit integrators update from the previous step and are limited by a CFL condition on the smallest element.",
    "Newmark’s method is the usual implicit family, with average acceleration (β = 1/4, γ = 1/2) unconditionally stable for linear problems. Explicit central difference with a lumped mass is the usual explicit member; it never forms a tangent.",
    "Wave propagation and crash analysis often take the explicit route. Quasi-static evolution, implicit dynamics, and viscoelasticity usually do not. Numerical dissipation in the integrator is a modelling choice, not a free parameter for hiding an unstable constitutive rate."
  ], tags:["dynamics","implicit","explicit","wave","crash","Newmark"]},
  {part:"Part III – Advanced FEM Concepts", title:"Contact and Friction", equations:[
    {name:"Frictionless KKT", expr:"g ≤ 0,   p ≥ 0,   p g = 0", tex:"g \\le 0,\\quad p \\ge 0,\\quad p\\,g = 0", note:"Gap g, contact pressure p, and complementarity: either the surfaces are open (p = 0) or they press with g = 0. Never both open and pressing."},
    {name:"Hertz pressure", expr:"p(x) = p₀ √(1 − (x/a)²)", tex:"p(x) = p_0\\sqrt{1-(x/a)^2}", note:"Smooth elliptic profile on a contact patch of half-width a. Peak at the centre, zero at the edges — no crack-tip singularity."},
    {name:"Effective modulus", expr:"1/E* = (1−ν₁²)/E₁ + (1−ν₂²)/E₂", tex:"\\dfrac{1}{E^*} = \\dfrac{1-\\nu_1^2}{E_1} + \\dfrac{1-\\nu_2^2}{E_2}", note:"Two dissimilar elastic bodies collapse to a single modulus E* and an equivalent radius R*."},
    {name:"Coulomb friction", expr:"|t_τ| ≤ μ p,   slip ∥ −t_τ", tex:"|\\mathbf{t}_\\tau| \\le \\mu p,\\quad \\text{slip}\\parallel -\\mathbf{t}_\\tau", note:"Stick when the tangential traction lies inside the cone; slide when it saturates. The tangent becomes nonsymmetric."}
  ], bullets:[
    "When two bodies, or a body and a rigid obstacle, would otherwise occupy the same point, a contact constraint forbids penetration and a friction law limits the tangential traction. The Karush–Kuhn–Tucker conditions for frictionless contact are g ≤ 0, p ≥ 0, p g = 0: a gap, a pressure, and complementarity.",
    "Classical Hertz theory is the smooth closed-form limit for small patches of linearly elastic bodies. An approach δ closes the gap; the contact half-width a and the peak pressure p₀ then follow from E* and R*. The pressure is elliptic — finite, smooth, and zero at the edge of the patch. That is the opposite of Williams’ 1/√r crack-tip field.",
    "The discrete FEM problem is a variational inequality. Penalty, Lagrange multipliers, and augmented Lagrangian methods are the three standard realisations; mortar and node-to-segment pairings decide which points are checked against which faces. Penalty is simple but stiffens the tangent; multipliers enforce the gap exactly but enlarge the system; augmentation combines both.",
    "Friction, even Coulomb, makes the tangent nonsymmetric and the path dependent. Contact is a geometric nonlinearity even when the material is linear. A consistent linearisation of the gap and of the sliding direction is required if Newton’s method is to be more than a heuristic.",
    "The first figure is Hertz contact of two elastic bodies: increase the approach δ and watch the elliptic pressure grow with the patch. The second is a ContactFEA hex-mesh double-cantilever: both arms bend from a fixed wall, tip loads close a 5 mm gap, and the MATLAB Newton–Raphson path is plotted as tip force versus tip U₂."
  ], tags:["contact","friction","KKT","mortar","penalty","Hertz","ContactFEA"], scenes:["hertzContact","beamContact"]},

  // Part IV – Applications in Engineering
  {part:"Part IV – Applications in Engineering", title:"Fracture Mechanics", bullets:[
    "A crack is a surface across which displacement jumps and traction is either zero or given by a cohesive law. Linear elastic fracture mechanics (LEFM) treats the solid as linear up to an infinitely sharp tip. The near-tip field is then Williams’ expansion: stress of order r^{-1/2} times a stress intensity factor K. Three modes exist. Mode I opens the faces; mode II slides them in plane; mode III tears them out of plane.",
    "Griffith’s argument is energetic. Advance of the crack by an area dA releases potential energy G = −dΠ/dA. In LEFM, Irwin’s relation G = K_I² / E′ identifies G with K (E′ = E in plane stress, E/(1−ν²) in plane strain). Fracture occurs when G reaches a material toughness Gc, or equivalently when K reaches Kc. The J-integral is the same G for a nonlinear elastic solid.",
    "The 1/√r singularity is a consequence of linear elasticity at a sharp notch, not a physical infinite stress. Real materials yield, damage, or open cohesively in a process zone. LEFM remains valid under small-scale yielding: that zone is small compared with the crack length and the remaining ligament. When it is not, the characterizing parameter is J, a cohesive law, or a continuum damage length.",
    "Numerically the crack may be fitted to the mesh (and remeshed as it grows), enriched so that the jump lives inside the approximation (XFEM, GFEM, or an enriched mesh-free method), or smeared as a phase-field or damage band whose width is a material length. Each choice changes what the mesh must resolve.",
    "The next entries are the singular field, Mode I / II / mixed-mode cracking and kink criteria, the cohesive process zone, the contour integral that extracts G, the phase-field regularization that turns a sharp surface into a diffuse band, and—under Numerical Methods—the extended/generalized FEM that embeds the jump and tip asymptotics without remeshing."
  ], tags:["fracture","LEFM","SIF","Griffith","Williams","singularity","cohesive","XFEM","phase-field"], illustrations:"fractureOverview"},
  {part:"Part IV – Applications in Engineering", title:"Linear Elastic Fracture Mechanics", equations:[
    {name:"Williams field", expr:"σ_ij = K / √(2π r) · f_ij(θ)", tex:"\\sigma_{ij} = \\dfrac{K}{\\sqrt{2\\pi r}}\\,f_{ij}(\\theta)", note:"Leading term at a sharp crack in a linear elastic solid. The angular functions f depend on the mode. Stress is unbounded as r → 0; energy release is finite."},
    {name:"Irwin", expr:"G = K_I² / E′", tex:"G = \\dfrac{K_I^2}{E'}", note:"E′ = E in plane stress and E/(1−ν²) in plane strain. Mixed-mode energy release adds K_II² and K_III² / (2μ) terms."},
    {name:"Small-scale yielding", expr:"r_p ∼ (1/2π) (K / σ_y)²", tex:"r_p \\sim \\dfrac{1}{2\\pi}\\Bigl(\\dfrac{K}{\\sigma_y}\\Bigr)^2", note:"Estimate of the plastic-zone size. LEFM holds while r_p is small compared with crack length and ligament."},
    {name:"Max hoop kink", expr:"K_I sin θ_c + K_II (3 cos θ_c − 1) = 0", tex:"K_I\\sin\\theta_c + K_{II}(3\\cos\\theta_c - 1) = 0", note:"Direction of the next increment under mixed-mode I–II. Equivalently θ_c = 2 arctan[(K_I − √(K_I² + 8 K_II²))/(4 K_II)]."}
  ], bullets:[
    "Williams constructed the eigenfields of a traction-free crack in an isotropic linear solid. The strongest admissible term that still gives finite energy is r^{-1/2}. All of the geometry and the remote load collapse into three scalars K_I, K_II, K_III, the stress intensity factors. Two bodies with the same K have the same near-tip field, which is why K is a characterizing parameter.",
    "Mode I is opening: σ_yy on the ligament is K_I / √(2π r). Mode II is in-plane shear; mode III is antiplane tearing. A mixed-mode tip kinks; the direction of maximum hoop stress, written in terms of K_I and K_II, is the usual criterion for the next increment of a brittle crack. Those intensities are extracted from a contour or domain integral — J itself, or an interaction integral that isolates each mode.",
    "Griffith required that the energy released by an increment of crack area pay the surface energy. Irwin identified that release rate with K²/E′. Toughness is then a critical Kc or a critical Gc. The J-integral evaluates the same G from a contour that need not sit in the singular zone.",
    "The unbounded stress is an artefact of the linear model. Cut it off with a yield stress and a plastic zone appears; cut it off with a tensile strength and a cohesive zone appears. If that zone is small, the outer K-field is unchanged and LEFM still sets the load at fracture. If it is not, the next entry is the right model.",
    "The interactive figure is a plate with an edge crack: switch mode I and mode II to see the Williams stress. Mode definitions, mixity, kink angle, and mixed-mode failure envelopes are expanded in the next entry."
  ], tags:["LEFM","Williams","stress intensity","singularity","Griffith","Irwin","small-scale yielding","mode I","mode II","mixed-mode"], scenes:["lefm","lefmCenterCrack"], illustrations:"lefm"},
  {part:"Part IV – Applications in Engineering", title:"Mode I, II & Mixed-Mode Cracking", equations:[
    {name:"Mode I opening", expr:"σ_θθ(θ=0) = K_I / √(2π r)", tex:"\\sigma_{\\theta\\theta}(\\theta=0) = \\dfrac{K_I}{\\sqrt{2\\pi r}}", note:"Symmetric opening of the faces. Remote tension normal to the crack is the archetype. Propagation under pure mode I continues in the crack plane for an isotropic brittle solid."},
    {name:"Mode mixity", expr:"ψ = arctan(K_II / K_I)", tex:"\\psi = \\arctan(K_{II}/K_I)", note:"Phase angle of the in-plane tip field. ψ = 0 is pure mode I; |ψ| → 90° is pure mode II. Interface cracks need a length scale in the definition of ψ because of the oscillatory singularity."},
    {name:"Mixed-mode energy release", expr:"G = (K_I² + K_II²)/E′ + K_III²/(2μ)", tex:"G = \\dfrac{K_I^2 + K_{II}^2}{E'} + \\dfrac{K_{III}^2}{2\\mu}", note:"Irwin’s identity for an isotropic linear solid. Fracture when G reaches Gc, or when a mode-weighted envelope in (K_I, K_II) space is crossed — Gc alone does not fix the kink direction."},
    {name:"Maximum hoop-stress kink", expr:"θ_c = 2 arctan[(K_I − √(K_I² + 8 K_II²))/(4 K_II)]", tex:"\\theta_c = 2\\arctan\\!\\left[\\dfrac{K_I - \\sqrt{K_I^2 + 8 K_{II}^2}}{4 K_{II}}\\right]", note:"Erdogan–Sih: the crack turns toward the direction of maximum σ_θθ. Pure mode I gives θ_c = 0; pure mode II gives θ_c ≈ ±70.5°. Equivalent to K_I sin θ_c + K_II (3 cos θ_c − 1) = 0."}
  ], bullets:[
    "Mode I opens the crack faces symmetrically. Mode II slides them in the plane of the body: one face forward, the other back. Mode III tears them out of plane (antiplane shear). Each mode has its own Williams angular field and its own intensity K_I, K_II, or K_III. Remote tension normal to an edge crack is nearly pure mode I; remote in-plane shear, or a kinked or inclined crack under tension, produces mode II or a mixture.",
    "Most engineering cracks are mixed-mode: K_I and K_II are both nonzero. The energy release rate still collapses to a single G through Irwin’s sum of squares, but the crack path does not stay in plane. The usual brittle criterion is maximum circumferential (hoop) stress: the next increment follows the angle θ_c at which σ_θθ is largest in the Williams field. That is Erdogan–Sih; it recovers coplanar growth in pure mode I and a kink of about 70° in pure mode II.",
    "Initiation is not path alone. A toughness surface in (K_I, K_II) — often an ellipse (K_I/K_Ic)² + (K_II/K_IIc)² = 1, or a critical equivalent intensity built from G — decides whether the tip advances. K_Ic from a mode-I test is not K_IIc; shear toughness is typically higher. Interface fracture adds a mixity-dependent Gc(ψ) because the process zone on a bimaterial interface sees both opening and sliding.",
    "Numerically, interaction (M-)integrals extract K_I and K_II separately from the same mesh that computes J. Propagation then updates the tip with θ_c (or a maximum energy-release-rate competitor) and remeshes, enriches (XFEM), or advances a cohesive segment. Pure mode-II growth is subtle: contact and friction on the faces can shield the tip, so a frictionless LEFM prediction overestimates the driving force.",
    "The figures below are opening versus sliding kinematics, the mixed-mode kink under combined K_I and K_II, and a schematic toughness envelope in the (K_I, K_II) plane."
  ], tags:["mode I","mode II","mode III","mixed-mode","kink","Erdogan-Sih","mixity","stress intensity","LEFM","toughness envelope"], illustrations:"mixedModeCrack", sources:[{label:"Erdogan & Sih, On the crack extension in plates under plane loading and transverse shear, J. Basic Eng. 85 (1963)", href:"https://doi.org/10.1115/1.3656897"},{label:"Anderson, Fracture Mechanics: Fundamentals and Applications, CRC Press (2017)", href:"https://www.routledge.com/Fracture-Mechanics-Fundamentals-and-Applications/Anderson/p/book/9781498728133"}]},
  {part:"Part IV – Applications in Engineering", title:"Cohesive Cracking", equations:[
    {name:"Traction–separation", expr:"t = t(δ),   G_f = ∫_0^{w_c} t dδ", tex:"t = t(\\delta),\\quad G_f = \\displaystyle\\int_0^{w_c} t\\,\\mathrm{d}\\delta", note:"The area under the law is the fracture energy. Linear, bilinear, and exponential shapes are the usual choices. The tensile strength ft is the peak traction."},
    {name:"Hillerborg length", expr:"ℓ_ch = E G_f / f_t²", tex:"\\ell_{\\mathrm{ch}} = \\dfrac{E G_f}{f_t^2}", note:"Characteristic size of the process zone. LEFM is recovered when ℓ_ch is small compared with the crack and the specimen."},
    {name:"Effective face traction", expr:"t_c = t_d − α p n", tex:"\\mathbf{t}_c = \\mathbf{t}_d - \\alpha p\\,\\mathbf{n}", note:"On a cohesive crack in a saturated porous solid. t_d is the dry cohesive traction, α the Biot coefficient, p the pore pressure, n the face normal. Mass exchange q_wd is an additional flux on the same surface."}
  ], bullets:[
    "Quasi-brittle materials — concrete, rock, saturated soil — do not fail at a mathematical tip. Dugdale and Barenblatt, and later Hillerborg, replace the singular field with a process zone on which a traction–separation law still transmits load. The faces are not traction-free until the opening exceeds a critical value w_c. The peak traction is the tensile strength f_t; the area under the law is the fracture energy G_f. Linear, bilinear, and exponential shapes are the usual choices.",
    "While the opening is less than w_c the crack still carries load, so the stress at the mathematical tip is finite. Along the crack line the traction rises to f_t, then falls according to the law, then vanishes on the open faces. Lower G_f shortens the zone. Under load or displacement control a small G_f produces snap-back: the load–deflection curve turns back on itself, and a continuation method is required.",
    "The same surface can be fitted with interface elements, enriched so that a Heaviside jump lives in the displacement (XFEM, or an enriched mesh-free approximation such as element-free Galerkin), or smeared as a band. Enrichment avoids remeshing as the crack grows. Propagation is a tensile-strength check at the tip; the next segment follows the maximum hoop-stress direction written in K_I and K_II.",
    "In a saturated porous solid the mechanical jump is not the whole story. Biot’s split still holds: total stress is effective stress minus α p. Water pressure is continuous across a cohesive crack; its normal gradient is not, because fluid is exchanged between the fracture and the intact medium — a distance enrichment of the pressure field represents that jump in flux. The effective traction on the faces is the cohesive traction minus the pore pressure. Mass exchange along the crack raises the load-bearing capacity relative to a dry analysis of the same geometry. That two-scale hydro-mechanical coupling is the setting of Goudarzi and Mohammadi (2015).",
    "The figure is a process zone on a crack line. Change the law, the tensile strength, and G_f. Navy is the cohesive traction; orange is the LEFM 1/√r field with the same far-field K. The LEFM curve is unbounded at the tip; the cohesive curve is not."
  ], tags:["cohesive zone","Barenblatt","Dugdale","Hillerborg","traction-separation","process zone","porous media","XFEM"], scenes:["cohesiveCrack","dcbCohesive"], illustrations:"cohesive", sources:[{label:"Goudarzi & Mohammadi, Analysis of cohesive cracking in saturated porous media using an extrinsically enriched EFG method, Comput. Geotech. 63 (2015)", href:"https://doi.org/10.1016/j.compgeo.2014.09.007"}]},
  {part:"Part IV – Applications in Engineering", title:"The J-Integral", equations:[
    {name:"Contour form", expr:"J = ∮_Γ (w n_1 − t · ∂u/∂x_1) dΓ", tex:"J = \\oint_{\\Gamma}\\bigl(w n_1 - \\mathbf{t}\\cdot\\partial_{x_1}\\mathbf{u}\\bigr)\\,\\mathrm{d}\\Gamma", note:"Any path from the lower face to the upper that encloses the tip and no other singularity. w is the strain-energy density, t = σ n the traction on Γ."},
    {name:"Potential energy", expr:"J = −dΠ / dA", tex:"J = -\\dfrac{\\mathrm{d}\\Pi}{\\mathrm{d}A}", note:"Energy released per unit area of crack advance. For a nonlinear elastic solid this is Griffith’s G. Unloading, inertia, and thermal strain take the identity away."},
    {name:"Irwin", expr:"J = K_I² / E′", tex:"J = \\dfrac{K_I^2}{E'}", note:"Linear elasticity recovers the stress-intensity factor. E′ = E in plane stress and E/(1−ν²) in plane strain."},
    {name:"Rigid line inclusion", expr:"J_tip ∝ (cos²θ − ν sin²θ)²", tex:"J_{\\mathrm{tip}} \\propto \\bigl(\\cos^2\\theta - \\nu\\sin^2\\theta\\bigr)^2", note:"The same contour around an inclusion tip measures the configurational force on that tip. It vanishes at the mechanically neutral orientation θn(ν)."}
  ], bullets:[
    "Rice’s J is the energy released per unit area of crack advance. For a hyperelastic solid it equals −dΠ/dA. In linear elastic fracture mechanics it recovers Griffith’s G and Irwin’s K_I²/E′. The contour form is a line integral of strain-energy density and traction-work around the tip: any path from the lower crack face to the upper that encloses the tip, and no other singularity, gives the same number.",
    "Path independence is the divergence theorem plus equilibrium. Two contours differ by an annular region in which the integrand is a divergence that integrates to zero, provided the material is hyperelastic (or deformation-theory plastic), the crack faces are traction-free, and there are no body forces. Unloading, heat, and inertia all break that identity. Then J is defined on a small contour about the process zone, or converted to a domain integral with a weighting function q that is 1 near the tip and 0 outside — the form finite-element codes actually compute.",
    "A rigid line inclusion has crack-like 1/√r fields at its tips, but the roles of traction and displacement are exchanged: the line does not open, it constrains the displacement. An analogous path integral around an inclusion tip is the configurational force on that tip, the energy released if the line were to lengthen. At the mechanically neutral orientation of a rigid line in a uniform remote stress, the far field is unperturbed, the tip intensities vanish, and that integral is identically zero. The inclusion is then neither a crack driver nor a reinforcement.",
    "Fibre neutrality uses the same vanishing as a diagnostic. A thin elastic fibre, perfect or imperfect interface, sitting at θn(ν) returns J = 0 around either tip in a reduced model. Away from θn the fibre is strained, the tips are loaded, and J is finite. Neutrality is elastic: once the matrix yields, the same inclusion nucleates shear bands from the tips even at θn.",
    "The figure is a plate under remote tension. Switch between an edge crack and a rigid line. On the crack, change the contour radius: the discrete line integral, evaluated on the Williams field, stays at K_I²/E. On the line, turn the orientation: J vanishes at θn."
  ], tags:["J-integral","Rice","path independence","Griffith","stress intensity","rigid line inclusion","configurational force"], scene:"jIntegral", illustrations:"jIntegral", sources:[{label:"Rice, A path independent integral and the approximate analysis of strain concentration by notches and cracks, J. Appl. Mech. 35 (1968)", href:"https://doi.org/10.1115/1.3601206"},{label:"Goudarzi & Simone, Fiber neutrality in fiber-reinforced composites, Int. J. Solids Struct. 156–157 (2019)", href:"https://doi.org/10.1016/j.ijsolstr.2018.07.023"}]},
  {part:"Part IV – Applications in Engineering", title:"Phase-Field Modelling of Fracture", equations:[
    {name:"Crack density (AT2)", expr:"γ(d,∇d) = d²/(2ℓ) + (ℓ/2)|∇d|²", tex:"\\gamma(d,\\nabla d) = \\dfrac{d^2}{2\\ell} + \\dfrac{\\ell}{2}\\lvert\\nabla d\\rvert^2", note:"Ambrosio–Tortorelli regularization of a surface measure. The 1-D profile across a fully developed band is d = exp(−|n|/ℓ). Softening starts at infinitesimal tensile strain."},
    {name:"Degradation", expr:"g(d) = (1−d)² + κ", tex:"g(d) = (1-d)^2 + \\kappa", note:"Multiplies the tensile (or positive) elastic energy. Residual stiffness κ ≪ 1 keeps the discrete system nonsingular when d = 1."},
    {name:"Regularized Griffith", expr:"E[u,d] = ∫ g(d) ψ₀⁺(ε) dV + G_c ∫ γ(d,∇d) dV", tex:"E[\\mathbf{u},d] = \\displaystyle\\int_{\\Omega} g(d)\\,\\psi_0^+(\\boldsymbol{\\varepsilon})\\,\\mathrm{d}V + G_c\\displaystyle\\int_{\\Omega}\\gamma(d,\\nabla d)\\,\\mathrm{d}V", note:"As ℓ → 0 the second integral Γ-converges to G_c times the crack area. ψ₀⁺ is a tensile split of the elastic energy so that compression does not drive cracking."},
    {name:"Irreversibility", expr:"ḋ ≥ 0  (or  d ≥ d_hist)", tex:"\\dot d \\ge 0 \\quad(\\text{or } d \\ge d_{\\mathrm{hist}})", note:"Damage does not heal. Miehe’s history field H = max_τ ψ₀⁺ stores the peak tensile energy and enforces irreversibility without an inequality constraint on every step."}
  ], bullets:[
    "A phase-field model of fracture smears the crack into a continuous field d ∈ [0, 1]. Intact material is d = 0; a fully broken band is d ≈ 1. The geometric measure of the crack surface is replaced by a crack-density functional γ(d,∇d) whose integral approximates the crack area. A single material length ℓ sets the width of the diffuse band; the mesh must resolve a few elements across that band.",
    "The total energy is a regularized Griffith functional: elastic energy degraded by g(d), plus G_c times the crack density. In the sharp-crack limit ℓ → 0 the formulation Γ-converges to classical brittle fracture. AT2 (quadratic) is the most common density; AT1 (linear in d) has compact support and an elastic threshold before damage nucleates. Hybrid and anisotropic splits decide which part of the strain energy drives d.",
    "The displacement problem and the phase-field problem are usually staggered: fix d and solve for u, then fix u and solve for d, iterating within the load step. A monolithic Newton solve couples both unknowns and needs a careful tangent. Irreversibility — cracks do not heal — is enforced by a history field or by bound constraints on d.",
    "Compared with XFEM or remeshing, the topology of the crack never appears explicitly: branching, coalescence, and nucleation emerge from minimizing the same energy. The price is resolution of ℓ and a well-chosen split so that compression and shear are not spuriously degraded. Cohesive length scales and phase-field lengths are related but not identical: ℓ here is a regularization parameter tied to G_c and the peak stress of the effective traction–separation response.",
    "The figure is an edge crack represented as a diffuse band. Change ℓ and the crack length a. AT2 gives an exponential profile; AT1 a compact quadratic one; the sharp limit collapses the band onto a surface."
  ], tags:["phase-field","damage","fracture","regularization","Griffith","Ambrosio-Tortorelli","AT1","AT2","length scale"], scene:"phaseFieldFracture", illustrations:"phaseField", sources:[{label:"Bourdin, Francfort & Marigo, The variational approach to fracture, J. Elasticity 91 (2008)", href:"https://doi.org/10.1007/s10659-007-9107-3"},{label:"Miehe, Hofacker & Welschinger, A phase field model for rate-independent crack propagation, Comput. Methods Appl. Mech. Eng. 199 (2010)", href:"https://doi.org/10.1016/j.cma.2010.04.011"}]},
  {part:"Part IV – Applications in Engineering", title:"Fiber-Reinforced Composites", bullets:[
    "A unidirectional ply is a transversely isotropic solid. The fibre direction is the 1-axis; the plane of isotropy is 2–3. Five independent constants remain: E₁, E₂, ν₁₂, G₁₂, G₂₃. The reduced stiffness Q relating in-plane stress to in-plane strain is the 3×3 matrix used in classical lamination theory.",
    "Off-axis, the same ply is anisotropic in the plate axes. The transformed stiffness Q̄(θ) is Q rotated with the fibre angle. Longitudinal stiffness falls rapidly as θ leaves 0°; at 45° shear coupling is large. A single off-axis ply under uniaxial load therefore shears.",
    "A laminate is a stack of such plies. Classical lamination theory assumes Kirchhoff kinematics through the thickness and integrates Q̄ of each ply into the ABD matrix: N = A ε₀ + B κ, M = B ε₀ + D κ. Membrane–bending coupling B vanishes for a symmetric stack. An unsymmetric stack bends when pulled.",
    "CLT does not see interlaminar stress. Free-edge peel and shear, and the traction between plies that drives delamination, live outside that plane-stress model. Shell elements with a section integration of the stack are the usual structural discretisation; a three-dimensional ply-by-ply mesh is used when an edge or a hole has to be resolved.",
    "A smeared ply is the wrong model when the fibres are discrete, high-aspect-ratio inclusions in a matrix: chopped fibres, nanotubes, platelets, or a structural-battery electrode. Those geometries do not fit a laminate ABD matrix. They need a discrete fibre model whose mesh is not required to follow every fibre.",
    "The figure turns the fibres of one ply. The stack on the right is a laminate of four orientations."
  ], tags:["composites","lamina","laminate","CLT","ABD","fibre angle","transversely isotropic"], scene:"fiberComposites", illustrations:"laminateCLT"},
  {part:"Part IV – Applications in Engineering", title:"Embedded Fiber Models", bullets:[
    "A body-fitted mesh of a high-aspect-ratio fibre must resolve the fibre diameter. For nanotubes, nanofibres, or a dense chopped-fibre RVE that cost is prohibitive. Mean-field and smeared-ply models avoid the mesh, and they also avoid the local fields: slip along the interface, strain jumps across a thin inclusion, and interaction between neighbouring fibres.",
    "Embedded reinforcement keeps a background matrix mesh and inserts each fibre as an independent line object. The fibre interpolation is not required to share nodes with the matrix. Load transfer is a traction–separation law on the interface; the relative tangential displacement is the slip. Classical ERS (embedded reinforcement with slip) places those slip degrees of freedom on the fibre axis.",
    "Two kinematic assumptions are the price of that independence. The fibre is reduced to a one-dimensional object, so variation of displacement across its diameter is lost. The matrix strain is usually taken continuous across the fibre, so the jump that a conformal mesh would produce is not represented inside an element. Homogenized stiffness is cheaper to get right than the local slip: classical ERS slip profiles oscillate, and the oscillations worsen with bond stiffness and with element size relative to the fibre.",
    "A weak-discontinuity enrichment of the matrix (sdERS) restores the strain jump and reduces those oscillations, at the cost of a background integration mesh that dense RVEs cannot afford. Raising the polynomial order or the regularity of the slip approximation is the cheaper cousin. Condensing the fibre degrees of freedom during assembly leaves a global system the size of the intact matrix, independent of how many fibres are added — the route to RVEs with millions of discrete fibres.",
    "The range of reliability is a set of dimensionless groups: fibre diameter over domain size, modulus contrast, and interface stiffness. Outside that range the reduced model should be checked against a fully resolved mesh on both effective moduli and slip, not on stiffness alone.",
    "The figure is an RVE of discrete fibres in a matrix cube. Orbit it, redistribute the packing, pull the orientation from random toward aligned, and click a fibre. None of them share nodes with the background grid.",
    "A single-fibre pull-out test isolates the bond law. Nonlinear cohesive FEM on an embedded fibre is compared to a 1D uniform-slip upper bound, a linear bond on the same mesh, and a shear-lag ODE with a rigid matrix — the MatFib FiberPullout_CompareReference workflow."
  ], tags:["embedded reinforcement","ERS","slip","high aspect ratio","sdERS","condensation","discrete fibre","pull-out","cohesive bond"], illustrations:"embeddedFibers", scenes:["randomFibers","fiberInterface","fiberPullout"], sources:[{label:"Goudarzi, Discrete fiber models beyond classical applications, TU Delft (2020)", href:"https://doi.org/10.4233/uuid:4741efe6-9a5e-4782-8cef-6d7ed83a3b30"}]},
  {part:"Part IV – Applications in Engineering", title:"Fiber Neutrality and Rigid Line Inclusions", bullets:[
    "A stiff fibre does not always stiffen the composite. Wang et al. showed that a zero-thickness rigid line inclusion in plane stress or plane strain is mechanically neutral at an orientation that depends only on the Poisson ratio of the matrix: the remote uniform stress is unperturbed. Goudarzi and Simone (2019) showed that the same neutrality holds for linear elastic thin fibres in three dimensions, with a perfect or an imperfect interface, once the fibre diameter is small compared with the domain (df/L ≲ 0.01).",
    "In a reduced (one-dimensional) fibre model the fibre is unstrained at θn = arctan(1/√ν) under uniaxial tension. That is the plane-stress angle of Wang et al.; a three-dimensional reduced fibre matches it. The effective Young’s modulus then equals that of the matrix. Fibres aligned with the load stiffen; fibres at 90° can still stiffen slightly through Poisson contraction; fibres at θn contribute nothing. The common claim that adding fibres always improves the elastic moduli is therefore false. Mean-field and rule-of-mixtures estimates cannot see that orientation.",
    "Shear modulus Gxy is neutral at 0° and 90°. Slip and axial strain along the fibre change sign at θn: past the neutral angle a fibre is compressed under remote tension, which can trigger micro-buckling. A solid (fully resolved) fibre is neutral at θn only when it is thin; a reduced fibre is neutral at every diameter because diameter never enters the geometry. Perfect and imperfect interfaces both go to Em when the fibre is thin.",
    "A two-dimensional inclusion with a double interface (a jump on each side) is different. Then Ex can fall below Em over a range of angles, and the angle of the minimum depends on bond stiffness. A single-interface reduced model does not degrade, and its θn is independent of the interface. In a random packing the effective isotropic Poisson ratio is itself neutral at νm ≈ 0.25: it does not change with fibre volume fraction, and other matrices are pulled toward 0.25 as fibres are added.",
    "The figure is an RVE under remote tension along x. Turn orientation, Poisson ratio, volume fraction, contrast, diameter, interface, and packing. The plots follow the 2019 paper: Ex(θ), θn(ν) against Wang, Ex and G versus diameter, slip and strain with the sign change, single versus double interface, and Poisson neutrality at 0.25."
  ], tags:["fiber neutrality","rigid line inclusion","orientation","Poisson","Wang","imperfect interface"], scene:"fiberNeutrality3d", illustrations:"fiberNeutrality", sources:[{label:"Goudarzi & Simone, Fiber neutrality in fiber-reinforced composites, Int. J. Solids Struct. 156–157 (2019)", href:"https://doi.org/10.1016/j.ijsolstr.2018.07.023"},{label:"Wang, Zhang & Chou, Characteristics of the elastic field of a rigid line inhomogeneity, J. Appl. Mech. 52 (1985)", href:"https://doi.org/10.1115/1.3169158"},{label:"Goudarzi, Discrete fiber models beyond classical applications, TU Delft (2020)", href:"https://doi.org/10.4233/uuid:4741efe6-9a5e-4782-8cef-6d7ed83a3b30"}]},
  {part:"Part IV – Applications in Engineering", title:"Composite Materials – Effective Properties",
  lead:"This framework outlines the computational homogenization workflow used to extract macroscopic engineering properties (e.g., Young’s modulus, shear modulus, Poisson’s ratio) of a composite from a Representative Volume Element (RVE).",
  bullets:[], flow:[
    {
      section:"1. Periodic Boundary Conditions (PBCs)",
      lead:"To ensure the RVE models a continuous bulk material without artificial edge distortions, periodic boundary conditions are applied to opposite faces, edges, and vertices of the RVE.",
      items:[
        {
          name:"Displacement Constraints",
          tex:"\\Delta u_i = \\bar{\\varepsilon}_{ij}\\,\\Delta x_j",
          body:"The displacement difference between corresponding points on opposite boundaries is constrained by the macroscopic strain tensor ε̄."
        },
        {
          name:"Application",
          body:"These constraints are defined across faces (1–6), edges (1–12), and vertices (1–8) in 3D (and 2D equivalents) to enforce periodicity under deformation."
        }
      ]
    },
    {
      section:"2. Homogenization & Stiffness Tensor Calculation",
      items:[
        {
          name:"1. Strain Application",
          body:"Six unit macrostrain vectors (ε̄) are sequentially applied to the RVE using six independent loading conditions (e.g., pure axial stretch [0.1, 0, 0, 0, 0, 0]ᵀ or shear)."
        },
        {
          name:"2. Stress Averaging",
          tex:"\\bar{\\boldsymbol{\\sigma}} = \\dfrac{1}{V}\\int_V \\boldsymbol{\\sigma}\\,\\mathrm{d}V",
          body:"For each applied macrostrain, the resulting local stress field σ is calculated and volume-averaged over the RVE volume V."
        },
        {
          name:"3. Stiffness Matrix (Cᶜ)",
          tex:"\\bar{\\boldsymbol{\\sigma}} = \\mathbb{C}^{c}\\bar{\\boldsymbol{\\varepsilon}}",
          body:"Using Hooke’s Law, each loading condition isolates and extracts specific columns (Cᶜᵢ₁ through Cᶜᵢ₆) of the effective constitutive matrix Cᶜ."
        }
      ]
    },
    {
      section:"3. Conversion to Macro Engineering Constants",
      lead:"Once Cᶜ is derived, mechanical properties are extracted depending on fiber alignment.",
      items:[
        {
          name:"Aligned Fibers (Transversely Isotropic)",
          body:"The effective stiffness is reduced to five independent constants: Cᶜₓₓ, Cᶜᵧᵧ, Cᶜₓᵧ, Cᶜᵧ𝓏, and Gᶜᵧ𝓏."
        },
        {
          name:"Axial Young’s Modulus",
          tex:"E_{xx}^{c}=C_{xx}^{c}-\\dfrac{2(C_{xy}^{c})^2}{C_{yy}^{c}+C_{yz}^{c}}",
          body:""
        },
        {
          name:"Transverse Young’s Modulus",
          tex:"E_{yy}^{c}=\\dfrac{(C_{yy}^{c}-C_{yz}^{c})\\left[C_{xx}^{c}C_{yy}^{c}+C_{xx}^{c}C_{yz}^{c}-2(C_{xy}^{c})^2\\right]}{C_{xx}^{c}C_{yy}^{c}-(C_{xy}^{c})^2}",
          body:""
        },
        {
          name:"Poisson’s Ratio",
          tex:"\\nu_{xy}^{c}=\\dfrac{C_{xy}^{c}}{C_{yy}^{c}+C_{yz}^{c}}",
          body:""
        },
        {
          name:"Randomly Oriented Fibers (Isotropic)",
          body:"The effective response is formulated through the Lamé parameters λᶜ and μᶜ."
        },
        {
          name:"Shear Modulus",
          tex:"G^{c}=\\mu^{c}",
          body:""
        },
        {
          name:"Young’s Modulus",
          tex:"E^{c}=\\dfrac{\\mu^{c}(3\\lambda^{c}+2\\mu^{c})}{\\lambda^{c}+\\mu^{c}}",
          body:""
        }
      ]
    }
  ], tags:["composites","homogenization","PBC","RVE","periodic boundary","effective stiffness","Young modulus","Poisson ratio","shear modulus","MPC","constraints"], scene:"effectiveProperties", sceneFirst:true},
  {part:"Part IV – Applications in Engineering", title:"Composite Materials – Failure Modes", bullets:[
    "Failure is rarely a single event. Fibres break, the matrix cracks, and plies separate. Hashin, Puck, and LaRC-type criteria distinguish those modes on a ply; the sequence depends on stacking sequence, notches, and the loading path.",
    "Continuum damage and cohesive interfaces are the usual numerical representations. A single equivalent-stress criterion on a homogenised ply is often too coarse to see delamination coming, because the interlaminar traction never appears as a degree of freedom."
  ], tags:["failure","delamination","matrix","fiber"]},
  {part:"Part IV – Applications in Engineering", title:"Multiphase Porous Materials", equations:[
    {name:"Effective stress", expr:"σ′ = σ − α p I", tex:"\\boldsymbol{\\sigma}' = \\boldsymbol{\\sigma} - \\alpha p\\,\\mathbf{I}", note:"Biot’s split. α = 1 − K/Ks is 1 for a soil whose grains are incompressible compared with the skeleton. Terzaghi’s principle is the same statement with α = 1."},
    {name:"Darcy", expr:"v = −(k/μ) (∇p − ρ g)", tex:"\\mathbf{v} = -\\dfrac{k}{\\mu}\\bigl(\\nabla p - \\rho\\mathbf{g}\\bigr)", note:"Relative discharge of the wetting fluid through the pores. Unsaturated flow replaces k by k(S_w)."},
    {name:"Storage", expr:"α ∇·u̇ + (1/M) ṗ + ∇·v = 0", tex:"\\alpha\\,\\nabla\\cdot\\dot{\\mathbf{u}} + \\dfrac{1}{M}\\dot{p} + \\nabla\\cdot\\mathbf{v} = 0", note:"Mass balance of the fluid. M is Biot’s modulus. Instantaneous undrained response is the limit M → ∞ with ∇·v = 0."}
  ], bullets:[
    "A porous solid is a mixture: a deformable skeleton and one or more pore fluids. The volume fractions are the porosity n of the void space and, when more than one fluid is present, the saturations S_w, S_g with S_w + S_g = 1. The partial densities are n S_α ρ_α. Mixture theory writes a mass balance and a momentum balance for each constituent; Biot’s poroelasticity is the linear two-phase case that geomechanics actually computes.",
    "The stress that compresses the skeleton is not the total Cauchy stress. Biot’s effective stress σ′ = σ − α p I is what enters the constitutive law of the solid. In a saturated soil with stiff grains, α = 1 and this is Terzaghi’s principle. An unsaturated soil needs two pressures: Bishop’s form σ′ = σ − χ p_w − (1−χ) p_g interpolates with a factor χ that is often taken as S_w, and the difference p_g − p_w is the capillary pressure, a function of saturation.",
    "Darcy’s law closes the fluid momentum: the discharge is proportional to the excess pressure gradient, with permeability k and viscosity μ. The skeleton’s mass balance is then a storage equation: volumetric strain rate of the solid, compressibility of the fluid and grains (the Biot modulus M), and the divergence of Darcy flow. Gravity appears as a body force on both constituents.",
    "Three regimes matter for computation. Drained: pressure is prescribed or has had time to equalise, and the solid sees only σ′. Undrained: the fluid cannot leave, volumetric strain is tied to p, and the mixture is nearly incompressible — equal-order u–p elements lock for the same reason rubber locks. Partially drained: the coupling is transient, and the next three entries are the classical tests of that coupling.",
    "A crack in a saturated porous solid is still this mixture, with a jump in displacement and a continuous pressure whose gradient is not. That is the cohesive entry. The figures below are the phases and the effective-stress split."
  ], tags:["porous media","Biot","Terzaghi","Darcy","effective stress","unsaturated","mixture theory"], illustrations:"porousOverview", sources:[{label:"Biot, General theory of three-dimensional consolidation, J. Appl. Phys. 12 (1941)", href:"https://doi.org/10.1063/1.1712886"}]},
  {part:"Part IV – Applications in Engineering", title:"One-Dimensional Consolidation", equations:[
    {name:"Terzaghi", expr:"∂u/∂t = c_v ∂²u/∂z²", tex:"\\partial_t u = c_v \\partial_z^2 u", note:"Excess pore pressure u in a column whose total vertical stress is known from equilibrium. c_v = k / (μ m_v) with m_v the oedometric compressibility."},
    {name:"Time factor", expr:"T_v = c_v t / H²", tex:"T_v = \\dfrac{c_v t}{H^2}", note:"H is the length of the longest drainage path. Isochrones and the average degree of consolidation U depend only on T_v."},
    {name:"Degree of consolidation", expr:"U = 1 − Σ 2/M² exp(−M² T_v)", tex:"U = 1 - \\sum \\dfrac{2}{M^2}\\exp(-M^2 T_v)", note:"M = π/2, 3π/2, … for a single drain. Settlement is U times the final oedometer compression."}
  ], bullets:[
    "A packed column, or an oedometer, is the one-dimensional problem. A sudden vertical load is carried at once by the pore water: the excess pressure equals the applied stress and the effective stress has not yet risen. The top of the column can drain; the base cannot. The excess pressure then obeys a heat equation. Because equilibrium in one dimension fixes the total vertical stress, there is no back-coupling from strain onto the load, and the pressure at every depth falls monotonically.",
    "The solution is a Fourier series in the drainage eigenfunctions. On a plot of u against depth the isochrones start as a rectangle, collapse first near the drain, and end at zero. The average of those isochrones is the degree of consolidation U(T_v). Settlement of the top is U times the final compression m_v σ H. Casagrande and Taylor constructions on a laboratory curve are ways of reading c_v from U(t), not different theories.",
    "The same PDE is the verification problem for a coupled u–p finite element column: one element across, drainage at one end, a step load, and a comparison of nodal pressure against the series. If the pair locks undrained, the early-time pressure is wrong even when the late-time settlement is acceptable.",
    "The figure is that column. Advance T_v. Colour is excess pressure; the log plot is U."
  ], tags:["consolidation","Terzaghi","oedometer","isochrone","degree of consolidation","cv"], scene:"consolidation", illustrations:"terzaghi"},
  {part:"Part IV – Applications in Engineering", title:"Gibson Consolidation", equations:[
    {name:"Self-weight", expr:"u(z,0) = γ′ (H − z)", tex:"u(z,0) = \\gamma'(H - z)", note:"Triangular excess pressure in a freshly placed layer. The top is a free drain; the base is impermeable. Dissipation is still Terzaghi’s series, with different Fourier coefficients."},
    {name:"Accretion", expr:"h = m t", tex:"h = m t", note:"Gibson (1958): a clay layer that thickens at a constant rate. The boundary moves. Excess pressure is the weight of the fill itself, not a surcharge applied to a finished layer."}
  ], bullets:[
    "A fill, a sediment, or a tailings deposit is not an oedometer. The load is the self-weight of the material, so the initial excess pressure is a triangle: zero at the drained surface, γ′H at the impermeable base. The eigenfunctions are the same as Terzaghi’s; the coefficients are not. Isochrones start as that triangle and flatten from the top down.",
    "Gibson (1958) let the layer grow. Thickness h = m t, with m the deposition rate. New material arrives already charged with its own weight, and the top boundary moves. The dimensionless group is m h / c_v: fast filling or a thick deposit leaves more excess pressure at the end of construction than a slow fill of the same height. Hydraulic fill and sedimentation are this problem.",
    "Gibson, England and Hussey (1967) dropped the small-strain assumption. Void ratio becomes the unknown; permeability and compressibility are functions of e. Terzaghi’s constant-c_v theory is the limit of small strain and constant coefficients. Large-strain self-weight consolidation of a slurry is not that limit.",
    "A different Gibson object is the Gibson soil, E = E_0 + λ z, used for the settlement of a footing on a deposit whose stiffness grows with depth. That is linear elasticity with depth-dependent moduli, not a consolidation PDE.",
    "The figure is the self-weight column. The isochrones are the triangle decaying in time. An accreting layer is the same plot with a rising top."
  ], tags:["Gibson","self-weight","accretion","finite strain","void ratio","tailings"], scene:"consolidationGibson", illustrations:"gibson", sources:[{label:"Gibson, The progress of consolidation in a clay layer increasing in thickness with time, Géotechnique 8 (1958)", href:"https://doi.org/10.1680/geot.1958.8.4.171"}]},
  {part:"Part IV – Applications in Engineering", title:"Mandel–Cryer Effect", equations:[
    {name:"Skempton", expr:"Δp = B Δσ_m", tex:"\\Delta p = B\\,\\Delta\\sigma_m", note:"Undrained pore-pressure increment. B = 1 for a saturated soil with incompressible grains. The subsequent coupled evolution is not a statement about B."},
    {name:"Cryer", expr:"p_centre(t)  rises, then falls", tex:"p_{\\mathrm{centre}}(t)\\ \\text{rises, then falls}", note:"A saturated sphere, sudden surface pressure, drained surface. Uncoupled Terzaghi is monotonic. Biot coupling produces the overshoot. The rise is largest at small drained Poisson ratio and vanishes as ν → 1/2."}
  ], bullets:[
    "In one dimension the total vertical stress is known, so excess pressure can only fall. In two or three dimensions it is not. As the drained boundary consolidates it becomes stiffer in effective stress and takes more of the load. The still-undrained interior is then compressed further, and its pore pressure rises above the undrained value before drainage finally catches up. That non-monotonic centre pressure is the Mandel–Cryer effect: the signature that the solid and the fluid are coupled both ways.",
    "Mandel (1953) posed it on a laterally confined strip that drains from the sides. Cryer (1963) posed it on a sphere with a sudden hydrostatic surface pressure. Both compared Biot’s theory with Terzaghi’s uncoupled diffusion. Only Biot produces the rise. Uncoupled codes, and one-dimensional columns, cannot.",
    "The size of the overshoot is a drained Poisson-ratio effect. Small ν means more volumetric strain for a given effective-stress change, so more pumping of the core. As ν → 1/2 the drained solid is itself incompressible, the coupling weakens, and the curve collapses onto monotonic diffusion.",
    "A coupled u–p finite element on Cryer’s sphere, or on Mandel’s strip, is the standard check that the formulation has the coupling. Getting the late-time settlement right is not enough; the early-time pressure must overshoot.",
    "The figure is Cryer’s sphere. Switch from the column to Cryer. Navy is the coupled centre pressure; orange is Terzaghi. Lower ν raises the peak."
  ], tags:["Mandel","Cryer","poroelasticity","Biot","overshoot","undrained"], scene:"mandelCryer", illustrations:"cryer", sources:[{label:"Mandel, Consolidation des sols (étude mathématique), Géotechnique 3 (1953)", href:"https://doi.org/10.1680/geot.1953.3.7.287"},{label:"Cryer, A comparison of the three-dimensional consolidation theories of Biot and Terzaghi, Q. J. Mech. Appl. Math. 16 (1963)", href:"https://doi.org/10.1093/qjmam/16.4.401"}]},
  {part:"Part IV – Applications in Engineering", title:"Heat Transfer & Multiphysics FEM", bullets:[
    "Temperature changes strain through thermal expansion, and deformation can generate heat. A thermo-mechanical analysis therefore solves a heat equation together with momentum balance, with constitutive laws that may themselves depend on temperature.",
    "The coupling may be staggered or monolithic. Strong coupling and disparate time scales are what make multiphysics harder than the sum of its parts: an operator split that is stable for thermo-elasticity can be unstable once plasticity heats the body."
  ], tags:["heat","multiphysics","thermo-mechanical"]},
  {part:"Part IV – Applications in Engineering", title:"Battery Mechanics – Structural Aspects", bullets:[
    "A cell is a mechanical object: electrodes swell, the separator is thin, and the casing carries constraint. Stresses from intercalation, thermal expansion, and abuse loading affect both performance and safety.",
    "Structural models of modules and packs sit on top of those local mechanisms. The casing that looks like a boundary condition to the cell is a deformable body to the pack."
  ], tags:["battery","mechanics","safety"]},
  {part:"Part IV – Applications in Engineering", title:"Battery FEM – Coupled Electro-Chemo-Mechanics", bullets:[
    "Inside a lithium-ion cell, electrochemistry, diffusion, heat, and stress interact. A coupled electro-chemo-mechanical model tracks lithium concentration, electric potential, temperature, and deformation together.",
    "The numerical difficulty is the disparity of time scales and the sensitivity of the chemistry to mechanical constraint. A purely thermal or purely structural model will miss the mechanisms that actually limit the cell. When the active material is itself a fibre, the same coupling has to be written on a discrete inclusion, not on a smeared cathode."
  ], tags:["battery","FEM","electro-chemo-mechanics"]},
  {part:"Part IV – Applications in Engineering", title:"Fiber-Based Electrodes", bullets:[
    "A structural battery replaces particulate active material with high-aspect-ratio fibres. The surface-to-volume ratio of a fibre is larger than that of a particle of the same volume, so lithium exchange with the electrolyte is faster. Carbon fibres can carry load and host intercalation at once; a polymer binder and a separator complete the laminate.",
    "Porous-electrode theory averages the microstructure into effective transport. That is enough for a homogenized discharge curve. It cannot impose a local interface condition between a particular fibre and the electrolyte, and it cannot see neighbouring fibres interact. A discrete fibre carries concentration and potential along its axis, assumed uniform on the cross-section — an assumption that holds for the thin fibres of a structural electrode, not for a thick particle.",
    "The same embedded insertion used for mechanical fibres places the electro-chemical fibre on a background electrolyte mesh. Butler–Volmer-type exchange lives on the fibre–electrolyte interface. A half-cell with a composite cathode is the usual test: the reduced fibre reproduces a fully resolved single-fibre solution at small diameter, and it recovers porous-electrode theory when the microstructure is represented only by volume fractions.",
    "Fibre–fibre interaction is not a mean-field correction. Interface current along a fibre is non-uniform; near a neighbour the current can reverse locally even while the average still inserts lithium. That local reversal is invisible to a smeared cathode."
  ], tags:["structural battery","fiber electrode","Butler-Volmer","embedded","porous electrode"], illustrations:"fiberElectrode", sources:[{label:"Goudarzi, Discrete fiber models beyond classical applications, TU Delft (2020)", href:"https://doi.org/10.4233/uuid:4741efe6-9a5e-4782-8cef-6d7ed83a3b30"}]},

  // Part V – High-Performance Computing
  {part:"Part V – High-Performance Computing", title:"GPUs in the FEM Pipeline", equations:[
    {name:"Amdahl", expr:"S = 1 / (1 − p + p/s)", tex:"S = \\dfrac{1}{1 - p + p/s}", note:"Overall speedup when a fraction p of the wall time runs s times faster. A stage that is 5% of the analysis cannot save the job, however well it maps to CUDA."},
    {name:"Element independence", expr:"Kᵉ = ∫ Bᵀ ℂ B dV   (no neighbour data)", tex:"\\mathbf{K}^{e} = \\displaystyle\\int \\mathbf{B}^{\\mathsf{T}}\\mathbb{C}\\,\\mathbf{B}\\,\\mathrm{d}V \\quad (\\text{no neighbour data})", note:"Constitutive evaluation and the element residual communicate only through assembly. That is why the Gauss-point loop is the first kernel worth moving."}
  ], bullets:[
    "A finite element analysis is not one kernel. It is a pipeline, and a GPU is useful only in the stages that expose thousands of identical arithmetic operations on data that already live in device memory. The first question is not how to write CUDA. It is which stage actually dominates, and whether that stage is data-parallel.",
    "Geometry and mesh generation, file I/O, and most CAD clean-up are irregular and latency-bound. They stay on the host. Local kinematics — shape functions, the Jacobian of the isoparametric map, the strain–displacement matrix B at Gauss points — are independent per element and move easily, but they are cheap. The constitutive law at those same points is not: in plasticity, damage, or a coupled material it is often the majority of a nonlinear residual. No element needs its neighbour’s history variables to compute σ and ℂ. That loop is the usual first win.",
    "Formation of the element matrix or residual is the same independence. Assembly then scatters those contributions into a global sparse pattern. The scatter is parallel, but it is a memory-bound race: two elements that share a node write the same entry. Graph colouring, atomic adds, or an assembled-on-the-fly matrix-free product are the three standard answers. Essential boundary conditions and multi-point constraints are sparse and serial; they rarely justify a device kernel of their own.",
    "The linear solve is where the analysis type splits the story. A linear static implicit job is often a single sparse factorisation. Large supernodal fronts can use a GPU; a moderate three-dimensional mesh with a well-ordered CPU factorisation often should not. Nonlinear implicit analysis repeats residual and tangent formation, then an iterative Krylov solve. The sparse matrix–vector product y = Ax is what GPUs do well — provided A is assembled once and left on the device. Copying the tangent every Newton iteration through the host bus can erase the kernel gain. Preconditioners are mixed: a Jacobi scaling or the matvecs inside an AMG smoother move; ILU and the AMG setup tend not to.",
    "Explicit dynamics drop the global tangent. A lumped mass, an internal force at Gauss points, and a gather to nodes: that is the strongest finite-element case for a GPU, which is why crash and wave codes moved first. Contact search is intermediate — a broad phase parallelises, a narrow phase may not. Postprocessing and rendering already have a device; the cost is sending the solution back.",
    "Two rules decide whether the pipeline as a whole improves. Amdahl’s: only stages that own wall time can matter. Locality’s: the matrix and the history variables must stay on the device. A small model whose factorisation is faster than the PCIe copy will look worse on a GPU than on a CPU, and that is not a failure of the hardware.",
    "The figure is the pipeline. Click a stage for why it does or does not move. Switch linear implicit, nonlinear implicit, and explicit: the time stack changes, and so does the case for the device. Raise the degrees of freedom until the copy is no longer the analysis."
  ], tags:["GPU","FEM pipeline","assembly","SpMV","explicit","Amdahl","CUDA","matrix-free"], scene:"gpuFem", illustrations:"gpuPipeline"},
  {part:"Part V – High-Performance Computing", title:"GPU Programming for Engineers", bullets:[
    "The previous entry is which stages move. This one is how they are written. Graphics processors execute many identical arithmetic operations at once, in warps, on a memory system that rewards coalesced access and punishes scattered writes.",
    "CUDA is the usual programming model. Threads are grouped into blocks that share on-chip memory; occupancy and occupancy-limiting resources (registers, shared memory) decide whether the arithmetic units stay busy. An element kernel that diverges on constitutive branches, or that gathers from an unstructured mesh without a colouring, will spend its time waiting rather than computing.",
    "The engineering question that remains, after the pipeline has been split, is the data layout: structure-of-arrays for history variables, a sparse format that matches the matvec, and a single host–device transfer per step rather than per element."
  ], tags:["GPU","CUDA","parallelism","warp","occupancy"]},
  {part:"Part V – High-Performance Computing", title:"Sparse Linear Algebra on GPUs", bullets:[
    "Sparse kernels, not dense matrix multiplication, dominate implicit finite element analysis on a GPU. Libraries such as cuSPARSE implement sparse matrix–vector products and sparse triangular solves.",
    "Performance depends on the storage format and on how regular the mesh connectivity is. A well-tuned CPU factorisation can still win on problems of moderate size."
  ], tags:["cuBLAS","cuSPARSE","SpMM","sparse"]},
  {part:"Part V – High-Performance Computing", title:"Performance Comparison: CPU vs GPU in FEM", bullets:[
    "Whether a GPU is faster depends on the operation, the matrix size, and the cost of moving data. Explicit dynamics and large iterative solves tend to favour the device; small, poorly parallel factorisations do not.",
    "A useful benchmark reports the whole analysis, including assembly and input, not only the kernel that looks best on a slide."
  ], tags:["benchmark","scalability","CPU vs GPU"]},
  {part:"Part V – High-Performance Computing", title:"Future of FEM: Multiscale & Multiphysics", bullets:[
    "Multiscale methods pass information between a macroscopic mesh and a representative volume. Multiphysics methods couple several fields on the same, or overlapping, meshes.",
    "Learned surrogates are being used to replace expensive constitutive evaluations. They remain useful only while they respect conservation and dissipation, which a generic interpolant will not do on its own."
  ], tags:["multiscale","RVE","ML","accelerators"]},

  // Part VI – Linear Algebra & Tools
  {part:"Part VI – Linear Algebra & Tools", title:"Matrix Fundamentals (Dense & Sparse)", bullets:[
    "Finite element systems are linear algebra. Dense factorisations—LU, Cholesky, QR, SVD—explain the structure of the solve; sparse storage explains why a three-dimensional mesh of any size is even tractable.",
    "Layout in memory, row-major or column-major, blocked or not, decides whether the arithmetic meets the cache. The algorithm that looks shortest on paper is not always the one that runs."
  ], tags:["dense","sparse","factorization","layout"]},
  {part:"Part VI – Linear Algebra & Tools", title:"Sparse Formats & Performance", bullets:[
    "Coordinate lists are convenient for assembly. Compressed sparse row is the usual format for a matrix–vector product; compressed sparse column favours column-oriented factorisation.",
    "Block formats pay when degrees of freedom cluster, as they do in vector problems. The right choice is the one that matches the kernel that is called most often."
  ], tags:["CSR","CSC","COO","BSR","HYB"]},
  {part:"Part VI – Linear Algebra & Tools", title:"CPU Linear Algebra Libraries", bullets:[
    "BLAS and LAPACK are the substrate. Eigen, Intel MKL, and OpenBLAS are the practical interfaces, with threading through OpenMP or TBB and vectorisation through AVX.",
    "A finite element code that calls these well will outperform one that writes its own inner loops. Most of the arithmetic in an implicit analysis never touches an element routine."
  ], tags:["BLAS","LAPACK","MKL","Eigen","OpenBLAS"]},
  {part:"Part VI – Linear Algebra & Tools", title:"GPU Linear Algebra Libraries", bullets:[
    "cuBLAS, cuSPARSE, cuSOLVER, and MAGMA provide dense and sparse kernels on the device, including batched operations for many small systems.",
    "Preconditioners are the weaker part of the stack. An algebraic multigrid cycle that is excellent on a CPU may be memory-bound, or awkward to implement, on a GPU."
  ], tags:["cuBLAS","cuSPARSE","cuSOLVER","MAGMA","SpMM"]},
  {part:"Part VI – Linear Algebra & Tools", title:"Solvers & Preconditioning", bullets:[
    "Direct solvers factor the matrix once and are insensitive to conditioning within the limits of roundoff. Krylov methods—conjugate gradients, GMRES, BiCGStab—iterate, and they need a preconditioner whose quality decides the iteration count.",
    "Jacobi, incomplete factorisations, and algebraic multigrid are the usual choices. Indefinite and constrained systems need methods that respect the block structure; a black-box positive-definite solver will not."
  ], tags:["CG","GMRES","ILU","AMG","preconditioner"]},
  {part:"Part VI – Linear Algebra & Tools", title:"Matrix Assembly & Graph Reordering", bullets:[
    "Assembly builds a sparse matrix from element contributions, typically through a triplet list that is then converted to compressed sparse row. Duplicate entries must be summed, not overwritten.",
    "Fill-reducing orderings—reverse Cuthill–McKee, approximate minimum degree, nested dissection—are applied before factorisation so that the factor remains sparse. The ordering that is cheap to compute is not always the one that minimises fill."
  ], tags:["assembly","CSR","RCM","AMD","METIS"]},
  {part:"Part VI – Linear Algebra & Tools", title:"MATLAB-like Basics for FEM", bullets:[
    "Most finite element prototypes are written in array notation: index, slice, and vectorise rather than loop over degrees of freedom by hand. Sparse diagonal constructors and Kronecker products build discrete operators compactly.",
    "The same habits transfer to NumPy, with different indexing conventions. Clarity in the residual is worth more than a clever one-liner when the tangent has to be derived from it."
  ], tags:["MATLAB","vectorization","sparse","spdiags","kron"]},
  {part:"Part VI – Linear Algebra & Tools", title:"Plotting & Postprocessing (MATLAB/Python)", bullets:[
    "Postprocessing is part of the analysis: deformed shapes, contours of stress, and residual histories on a logarithmic axis. Matplotlib and PGFPlots are enough for publication figures.",
    "Specialised viewers take over when the mesh is large. A contour that is not tied to the quadrature points at which the stress was computed is a picture, not a result."
  ], tags:["plot","matplotlib","pgfplots","contour"]},
  {part:"Part VI – Linear Algebra & Tools", title:"NumPy/SciPy Equivalents", bullets:[
    "SciPy’s sparse matrices and sparse solvers are the Python equivalent of MATLAB’s sparse suite. Direct sparse solves, conjugate gradients, and GMRES cover the usual cases.",
    "Automatic differentiation through PyTorch or JAX is useful when a residual is easier to write than a tangent. The resulting Jacobian is only as correct as the residual it differentiates."
  ], tags:["NumPy","SciPy","csr_matrix","autograd"]},
  {part:"Part VI – Linear Algebra & Tools", title:"Benchmarking & Profiling", bullets:[
    "Wall-clock time, not a flop count, is what decides whether an analysis is usable. Roofline analysis says whether a kernel is limited by arithmetic or by memory bandwidth.",
    "Profilers show where the time actually goes. An unreproducible timing is not a measurement, and a kernel benchmark is not a model of the whole code."
  ], tags:["profiling","nsys","nvprof","roofline","benchmark"]},
  {part:"Part VI – Linear Algebra & Tools", title:"I/O & Interchange Formats", bullets:[
    "Meshes, matrices, and results move between codes through formats such as Matrix Market, HDF5, and VTK. Text is portable and slow; binary is the reverse.",
    "A pipeline that cannot write a mesh the visualiser can read is not finished. The same is true of a solver that cannot reread its own checkpoint."
  ], tags:["MatrixMarket","HDF5","VTK","I/O"]}
];

// ---- Helpers --------------------------------------------------------------
const groupBy = (arr, key) => arr.reduce((acc, x) => ((acc[x[key]] ??= []).push(x), acc), {});
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');

function escHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

// ---- Sidebar state --------------------------------------------------------
let activeTitle = "";
let expandedParts = new Set();
let lastFilter = "";

function partShortLabel(part){
  const m = String(part).match(/^Part\s+([IVX]+)/i);
  return m ? m[1] : part.slice(0, 8);
}

// ---- Render sidebar -------------------------------------------------------
const sidebar = document.getElementById('sidebar');
function renderSidebar(filter=""){
  lastFilter = filter;
  sidebar.innerHTML = '';
  let totalMatches = 0;
  const grouped = groupBy(topics, 'part');
  const parts = Object.keys(grouped);
  const isSearching = filter.trim().length > 0;

  if(isSearching){
    parts.forEach(p => {
      const has = grouped[p].some(t =>
        (t.title+" "+(t.bullets||[]).join(" ")+" "+(t.tags||[]).join(" "))
          .toLowerCase().includes(filter.toLowerCase())
      );
      if(has) expandedParts.add(p);
    });
  } else if(expandedParts.size === 0){
    const cur = topics.find(t => t.title === activeTitle);
    expandedParts.add(cur ? cur.part : parts[0]);
  }

  const jump = document.createElement('div');
  jump.className = 'part-jump';
  jump.setAttribute('role', 'navigation');
  jump.setAttribute('aria-label', 'Jump to part');
  parts.forEach(part => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Part ' + partShortLabel(part);
    btn.title = part;
    const cur = topics.find(t => t.title === activeTitle);
    if(cur && cur.part === part) btn.classList.add('on');
    btn.addEventListener('click', () => {
      expandedParts = new Set([part]);
      const cur = topics.find(t => t.title === activeTitle);
      if(!cur || cur.part !== part){
        const first = grouped[part][0];
        if(first) selectTopic(first.title, {fromSidebar:true});
        else renderSidebar(lastFilter);
      } else {
        renderSidebar(lastFilter);
      }
      requestAnimationFrame(() => {
        const target = Array.from(sidebar.querySelectorAll('.part-group')).find(el => el.dataset.part === part);
        if(target) target.scrollIntoView({block:'nearest'});
      });
    });
    jump.appendChild(btn);
  });
  sidebar.appendChild(jump);

  parts.forEach(part => {
    const items = grouped[part];
    const visible = items.filter(t =>
      (t.title+" "+(t.bullets||[]).join(" ")+" "+(t.tags||[]).join(" "))
        .toLowerCase().includes(filter.toLowerCase())
    );
    if(visible.length === 0) return;
    totalMatches += visible.length;

    const open = isSearching || expandedParts.has(part);
    const group = document.createElement('div');
    group.className = 'part-group' + (open ? '' : ' collapsed') +
      ((topics.find(t => t.title === activeTitle)?.part === part) ? ' current' : '');
    group.dataset.part = part;

    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = 'part-toggle';
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    toggle.innerHTML =
      `<span class="chev" aria-hidden="true"></span>` +
      `<span class="part-label">${escHtml(part)}</span>` +
      `<span class="part-meta">${visible.length}</span>`;
    toggle.addEventListener('click', () => {
      if(expandedParts.has(part)){
        expandedParts.delete(part);
      } else {
        expandedParts.add(part);
      }
      renderSidebar(lastFilter);
      const active = document.querySelector('.tab.active');
      if(active) active.scrollIntoView({block:'nearest'});
    });
    group.appendChild(toggle);

    const list = document.createElement('div');
    list.className = 'tabs';
    list.setAttribute('role', 'list');
    visible.forEach(t => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab' + (t.title === activeTitle ? ' active' : '');
      b.id = 'tab-' + slug(t.title);
      b.setAttribute('data-slug', slug(t.title));
      b.setAttribute('role', 'listitem');
      b.textContent = t.title;
      b.addEventListener('click', () => selectTopic(t.title, {fromSidebar:true}));
      list.appendChild(b);
    });
    group.appendChild(list);
    sidebar.appendChild(group);
  });

  if(totalMatches === 0){
    const empty = document.createElement('div');
    empty.style.color = 'var(--muted)';
    empty.style.padding = '8px 10px';
    empty.textContent = 'No results. Try different keywords.';
    sidebar.appendChild(empty);
  }
}

function renderElementChooserWidget(){
  const defaultId = "solids";
  const toolId = "element-tool";
  const pickId = "element-pick";

  const chips = elementChooser.problems.map(p =>
    `<button class="chip ${p.id===defaultId?'active':''}" data-problem="${p.id}" type="button">${escHtml(p.label)}</button>`
  ).join("");

  return `
    <div class="tool" id="${toolId}">
      <div class="tool-head">
        <div>
          <div class="tool-title">Element families</div>
          <div class="tool-sub">Recommended interpolations depend on the problem. Choose a setting.</div>
        </div>
        <div class="tool-sub muted">Near incompressibility, waves, and unfitted geometry are the cases that most often punish a default solid element.</div>
      </div>

      <div class="seg" role="tablist" aria-label="Problem type">
        ${chips}
      </div>

      <div class="grid2" id="${pickId}">
        <!-- filled by JS -->
      </div>
    </div>
  `;
}

function mountElementChooser(){
  const host = document.getElementById('element-pick');
  const tool = document.getElementById('element-tool');
  if(!host || !tool) return;

  function render(problemId){
    const rule = elementChooser.rules[problemId] || elementChooser.rules.solids;
    const rec = rule.recommend.map(x=>`<li>${escHtml(x)}</li>`).join("");
    const avoid = rule.avoid.map(x=>`<li>${escHtml(x)}</li>`).join("");
    const modes = (rule.modes||[]).map(m=>{
      const key = String(m);
      const help = elementChooser.failureModeHelp[key] || "";
      const cls = /locking|hourglass|instability|dispersion|spurious/i.test(key) ? "warn" : "";
      const title = help ? ` title="${escHtml(help)}"` : "";
      return `<span class="pill ${cls}"${title}>${escHtml(key)}</span>`;
    }).join("");

    const note = rule.notes ? `<p class="muted" style="margin:.4em 0 0 0">${escHtml(rule.notes)}</p>` : "";

    host.innerHTML = `
      <div class="panel">
        <h3>Recommended</h3>
        <ul>${rec}</ul>
        ${note}
      </div>
      <div class="panel">
        <h3>Failure modes</h3>
        <ul>${avoid}</ul>
        <div class="kv" style="margin-top:10px">
          ${modes}
        </div>
      </div>
    `;
  }

  render("solids");

  tool.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      tool.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      btn.classList.add('active');
      render(btn.getAttribute('data-problem'));
    });
  });
}

        <ol>
          <li><strong>Cauchy momentum (index form):</strong>
            <div class="eq">\\[\\sigma_{ij,j} + b_i = \\rho\\ddot{u}_i\\]</div>
          </li>
          <li><strong>Isotropic Hooke:</strong>
            <div class="eq">\\[\\sigma_{ij} = \\lambda\\varepsilon_{kk}\\delta_{ij} + 2\\mu\\varepsilon_{ij}\\]</div>
          </li>

            <div class="eq">\\[\\varepsilon_{ij} = \\tfrac{1}{2}(u_{i,j}+u_{j,i})\\]</div>

        </div>
