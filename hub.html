let beamSimRaf = 0;
function mountBeamSimulator(){
  if (beamSimRaf) { cancelAnimationFrame(beamSimRaf); beamSimRaf = 0; }
  const container = document.getElementById('theory-canvas');
  if (!container || typeof THREE === 'undefined') return;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050b14);
  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / Math.max(container.clientHeight, 1), 0.1, 1000);
  camera.position.set(8, 6, 14);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  container.innerHTML = '';
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  dirLight.position.set(10, 15, 10);
  scene.add(dirLight);
  const gridHelper = new THREE.GridHelper(20, 20, 0x334155, 0x1e293b);
  gridHelper.position.y = -3;
  scene.add(gridHelper);
  const wall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 4, 3), new THREE.MeshStandardMaterial({ color: 0x334155 }));
  wall.position.set(-4.25, 0, 0);
  scene.add(wall);

  const segments = 30, beamLength = 8;
  const beamGeo = new THREE.BoxGeometry(beamLength, 0.8, 1.2, segments, 1, 1);
  beamGeo.translate(beamLength / 2 - 4, 0, 0);
  const count = beamGeo.attributes.position.count;
  beamGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
  const beam = new THREE.Mesh(beamGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.3, metalness: 0.2 }));
  scene.add(beam);
  const posAttr = beamGeo.attributes.position;
  const initialPositions = posAttr.array.slice();

  const modeSelect = document.getElementById('mode-select');
  const forceSlider = document.getElementById('force-slider');
  const dampingSlider = document.getElementById('damping-slider');
  const resetBtn = document.getElementById('reset-btn');
  let simTime = 0, dynamicTipVelocity = 0, dynamicTipDisplacement = 0;
  if (resetBtn) resetBtn.onclick = function () {
    simTime = 0; dynamicTipVelocity = 0; dynamicTipDisplacement = 0;
  };

  function applyStressColor(ratio, colorArray, index) {
    colorArray[index] = Math.min(1, ratio * 2);
    colorArray[index + 1] = 0.2;
    colorArray[index + 2] = Math.max(0, 1 - ratio * 2);
  }

  const clock = new THREE.Clock();
  let alive = true;
  function animate() {
    if (!alive || !document.getElementById('theory-canvas')) return;
    beamSimRaf = requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    simTime += dt;
    controls.update();
    const mode = modeSelect ? modeSelect.value : 'static';
    const force = forceSlider ? parseFloat(forceSlider.value) : 5;
    const damping = dampingSlider ? parseFloat(dampingSlider.value) : 0.15;
    const positions = posAttr.array;
    const colorAttr = beamGeo.attributes.color.array;

    if (mode === 'static') {
      const maxTipDeflection = force * 0.15;
      for (let i = 0; i < count; i++) {
        const x = initialPositions[i * 3] + 4;
        const normX = x / beamLength;
        const deflectionFactor = (3 * normX * normX - normX * normX * normX) / 2;
        positions[i * 3 + 1] = initialPositions[i * 3 + 1] - maxTipDeflection * deflectionFactor;
        applyStressColor(Math.min(1, (1 - normX) * (force / 10)), colorAttr, i * 3);
      }
    } else {
      const stiffness = 20, mass = 1.5;
      const omega = Math.sqrt(stiffness / mass);
      const dynamicForce = Math.sin(simTime * 8) > 0.8 ? force * 0.8 : 0;
      const accel = (dynamicForce - 2 * damping * omega * dynamicTipVelocity - stiffness * dynamicTipDisplacement) / mass;
      dynamicTipVelocity += accel * dt;
      dynamicTipDisplacement += dynamicTipVelocity * dt;
      for (let i = 0; i < count; i++) {
        const x = initialPositions[i * 3] + 4;
        const normX = x / beamLength;
        const wavePhase = simTime * 12 - normX * 4;
        const waveComponent = Math.sin(wavePhase) * 0.08 * (force / 5);
        const deflectionFactor = Math.pow(normX, 2);
        positions[i * 3 + 1] = initialPositions[i * 3 + 1] - (dynamicTipDisplacement * deflectionFactor + waveComponent * normX);
        applyStressColor(Math.min(1, Math.abs(dynamicTipDisplacement * (1 - normX) * 0.5 + waveComponent)), colorAttr, i * 3);
      }
    }
    posAttr.needsUpdate = true;
    beamGeo.attributes.color.needsUpdate = true;
    renderer.render(scene, camera);
  }
  const onResize = function () {
    if (!container.clientWidth) return;
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  };
  window.addEventListener('resize', onResize);
  animate();
}

function partPathHtml(topic){
  if(topic.part !== PART_I) return "";
  const siblings = partTopics(topic.part);
  const idx = siblings.findIndex(t => t.title === topic.title);
  if(idx < 0) return "";
  const arc = topicArc(topic);
  return `<div class="part-path" aria-label="Position in Part I">
    <span class="arc">${escHtml(arc || "Part I")}</span>
    <span class="sep">·</span>
    <span class="pos">${idx + 1} of ${siblings.length}</span>
  </div>`;
}

function partArcsHtml(topic){
  if(topic.part !== PART_I) return "";
  const current = topicArc(topic);
  const siblings = partTopics(topic.part);
  return `<nav class="part-arcs" aria-label="Part I arcs">${PART_I_ARC_ORDER.map(arc => {
    const first = siblings.find(t => topicArc(t) === arc);
    if(!first) return "";
    const isCurrent = arc === current;
    return `<button type="button" class="${isCurrent ? "current" : ""}" data-title="${escHtml(first.title)}" ${isCurrent ? "aria-current=\"true\"" : ""}>${escHtml(arc)}</button>`;
  }).join("")}</nav>`;
}

function topicBridgeHtml(topic){
  const text = topicBridge(topic);
  if(!text) return "";
  const {next} = topicNeighbors(topic);
  const nextBit = next && next.part === topic.part
    ? ` Next: <strong>${escHtml(next.title)}</strong>.`
    : (next ? ` Continues in <strong>${escHtml(next.part)}</strong>.` : "");
  return `<p class="topic-bridge">${escHtml(text)}${nextBit}</p>`;
}

function renderSubsections(sections){
  if(!sections || !sections.length) return "";
  return `<div class="topic-subsections">${sections.map(section => `
    <section class="topic-subsection">
      <h2>${escHtml(section.heading)}</h2>
      <ul>${(section.items || []).map(item => `
        <li><strong>${escHtml(item.name)}:</strong> ${escHtml(item.text)}${item.tex ? ` <span class="inline-eq">\\(${item.tex}\\).</span>` : ""}</li>
      `).join("")}</ul>
    </section>
  `).join("")}</div>`;
}

function renderContent(topic){
  const prose = (topic.bullets||[]).map(x => `<p>${escHtml(x)}</p>`).join('');
  const lead = topicLead(topic);

  const interactiveBlock =
    topic.interactive === "elementChooser" ? renderElementChooserWidget()
    : topic.interactive === "beamSim" ? renderBeamSimWidget()
    : "";

  const illustrationsBlock = renderTopicIllustrations(topic);
  const sceneBlock = renderTopicScene(topic);
  const sourceBlock = (topic.sources && topic.sources.length)
    ? `<p class="muted" style="margin-top:1.6em">${topic.sources.map(s => `<a href="${escHtml(s.href)}">${escHtml(s.label)}</a>`).join('<br>')}</p>`
    : "";

  const flowBlock = topic.flow ? renderEquationFlow(topic.flow) : "";
  const subsectionBlock = renderSubsections(topic.subsections);
  const eqBlock = (!topic.flow && topic.equations && topic.equations.length)
    ? `<p class="section-label">Field equations</p>
      <div class="eq-list">${topic.equations.map(eq => `
        <article class="eq-card">
          <h3>${escHtml(eq.name)}</h3>
          <div class="eq">\\[${eq.tex || escHtml(eq.expr)}\\]</div>
          <p>${escHtml(eq.note)}</p>
        </article>`).join('')}</div>`
    : "";

  content.innerHTML = `
    <article class="card">
      <div class="breadcrumbs"><span>${escHtml(topic.part)}</span><span>${escHtml(topic.title)}</span></div>
      ${partPathHtml(topic)}
      ${partArcsHtml(topic)}
      <h1>${escHtml(topic.title)}</h1>
      ${lead ? `<p class="topic-lead">${escHtml(lead)}</p>` : ""}
      <div class="prose">${prose}</div>
      ${topic.sceneFirst ? sceneBlock : ""}
      ${flowBlock}
      ${eqBlock}
      ${subsectionBlock}
      ${topic.sceneFirst ? "" : sceneBlock}
      ${illustrationsBlock}
      ${interactiveBlock}
      ${sourceBlock}
      ${topicBridgeHtml(topic)}
      ${topicNavHtml(topic)}
    </article>
  `;

  // Update active state
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  const active = document.querySelector(`#tab-${slug(topic.title)}`);
  if(active){
    active.classList.add('active');
    active.scrollIntoView({block:'nearest'});
  }

  content.querySelectorAll('.part-arcs button[data-title]').forEach(btn => {
    btn.addEventListener('click', () => selectTopic(btn.getAttribute('data-title')));
  });

  const nav = content.querySelector('.topic-nav');
  if(nav){
    nav.querySelectorAll('button[data-title]').forEach(btn => {
      btn.addEventListener('click', () => selectTopic(btn.getAttribute('data-title')));
    });
  }

  // Mount interactive widgets AFTER DOM update
  if(topic.interactive === "elementChooser"){
    mountElementChooser();
  }
  if(topic.interactive === "beamSim"){
    mountBeamSimulator();
  }
  typesetMath(content);
}

function topicNeighbors(topic){
  const i = topics.findIndex(t => t.title === topic.title);
  return {
    prev: i > 0 ? topics[i - 1] : null,
    next: i >= 0 && i < topics.length - 1 ? topics[i + 1] : null
  };
}

function topicNavHtml(topic){
  const {prev, next} = topicNeighbors(topic);
  const prevBtn = prev
    ? `<button type="button" data-title="${escHtml(prev.title)}"><span class="dir">Previous</span><span class="name">${escHtml(prev.title)}</span></button>`
    : `<button type="button" disabled><span class="dir">Previous</span><span class="name">—</span></button>`;
  const nextBtn = next
    ? `<button type="button" class="next" data-title="${escHtml(next.title)}"><span class="dir">Next</span><span class="name">${escHtml(next.title)}</span></button>`
    : `<button type="button" class="next" disabled><span class="dir">Next</span><span class="name">—</span></button>`;
  return `<nav class="topic-nav" aria-label="Adjacent topics">${prevBtn}${nextBtn}</nav>`;
}

function typesetMath(root){
  if (!root) return;
  if (window.renderMathInElement) {
    renderMathInElement(root, {
      delimiters: [
        {left: '\\[', right: '\\]', display: true},
        {left: '\\(', right: '\\)', display: false}
      ],
      throwOnError: false
    });
  } else {
    setTimeout(function(){ typesetMath(root); }, 40);
  }
}

// ---- Selection + deep-linking --------------------------------------------
function selectTopic(title, opts={}){
  const t = topics.find(x => x.title === title);
  if(!t) return;
  activeTitle = t.title;
  expandedParts = new Set([t.part]);
  renderSidebar(lastFilter);
  renderContent(t);
  const h = '#'+slug(t.title);
  if(location.hash !== h){ history.replaceState(null,'',h); }
  document.title = t.title + ' | Mechanics Reference';
  const desc = document.querySelector('meta[name="description"]');
  if(desc && t.bullets && t.bullets[0]){
    const summary = String(t.bullets[0]).replace(/\s+/g,' ').slice(0, 155);
    desc.setAttribute('content', summary + (t.bullets[0].length > 155 ? '…' : ''));
  }
  content.focus({preventScroll:false});
  if(opts.fromSidebar) closeMobileSidebar();
}

function initFromHash(){
  const h = location.hash.replace('#','');
  const byHash = topics.find(t => slug(t.title) === h);
  return byHash || topics.find(t => t.title === "Basic Equations") || topics[0];
}

// ---- Search ---------------------------------------------------------------
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', (e)=>{
  const q = e.target.value || '';
  if(!q.trim() && activeTitle){
    const cur = topics.find(t => t.title === activeTitle);
    if(cur) expandedParts = new Set([cur.part]);
  }
  renderSidebar(q);
});

// ---- Mobile sidebar -------------------------------------------------------
const topicsSidebar = document.getElementById('topicsSidebar');
const menuToggle = document.getElementById('menuToggle');
const sidebarBackdrop = document.getElementById('sidebarBackdrop');

function openMobileSidebar(){
  topicsSidebar.classList.add('open');
  sidebarBackdrop.classList.add('open');
  sidebarBackdrop.hidden = false;
  menuToggle.setAttribute('aria-expanded', 'true');
}
function closeMobileSidebar(){
  topicsSidebar.classList.remove('open');
  sidebarBackdrop.classList.remove('open');
  sidebarBackdrop.hidden = true;
  menuToggle.setAttribute('aria-expanded', 'false');
}
function toggleMobileSidebar(){
  if(topicsSidebar.classList.contains('open')) closeMobileSidebar();
  else openMobileSidebar();
}
menuToggle.addEventListener('click', toggleMobileSidebar);
sidebarBackdrop.addEventListener('click', closeMobileSidebar);
window.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeMobileSidebar();
});

// ---- Keyboard navigation --------------------------------------------------
window.addEventListener('keydown', (e)=>{
  if(e.ctrlKey && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    openMobileSidebar();
    searchInput.focus();
  }
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    const tabs = Array.from(document.querySelectorAll('.tab'));
    if(tabs.length === 0) return;
    e.preventDefault();
    const activeIndex = tabs.findIndex(t=>t.classList.contains('active'));
    const target = (activeIndex === -1)
      ? 0
      : (e.key==='ArrowDown' ? Math.min(tabs.length-1, activeIndex+1) : Math.max(0, activeIndex-1));
    tabs[target].click();
    tabs[target].scrollIntoView({block:'nearest'});
  }
});

// ---- Tiny test harness ----------------------------------------------------
(function runSelfTests(){
  const badge = document.getElementById('test-badge');
  const results = [];
  function ok(name, cond){
    const pass = !!cond; results.push({name, pass});
    console[pass? 'log' : 'error'](`${pass? 'PASS':'FAIL'}: ${name}`);
    return pass;
  }
  try{
    ok('topics is an array with items', Array.isArray(topics) && topics.length > 0);
    ok('each topic has part/title/bullets', topics.every(t => t && t.part && t.title && Array.isArray(t.bullets)));
    ok('element chooser topic exists', topics.some(t => t.interactive === 'elementChooser'));
    ok('mesh generation topic exists', topics.some(t => /mesh generation/i.test(t.title)));
    const parts = [...new Set(topics.map(t=>t.part))];
    ok('contains Part VI – Linear Algebra & Tools', parts.includes('Part VI – Linear Algebra & Tools'));
    const gpuHits = topics.filter(t => (t.title+" "+(t.tags||[]).join(' ')).toLowerCase().includes('gpu'));
    ok('searchable GPU topics present', gpuHits.length >= 1);
    ok('element chooser slug', slug('Element Types & Families (Chooser)') === 'element-types-families-chooser');
    ok('variational principles topic', topics.some(t => t.title === 'Variational Principles'));
    ok('mixed methods topic', topics.some(t => t.title === 'Mixed Methods and Locking'));
    ok('constrained fem topic', topics.some(t => t.title === 'Constrained FEM' && t.illustrations === 'constrainedFem' && (t.equations||[]).length >= 3));
    ok('xfem gfem topic', topics.some(t => t.title === 'Extended & Generalized Finite Element Methods (XFEM/GFEM)' && t.illustrations === 'xfemGfem' && (t.equations||[]).length >= 3));
    ok('discontinuous galerkin topic', topics.some(t => t.title === 'Discontinuous Galerkin Method' && t.illustrations === 'discontinuousGalerkin' && (t.equations||[]).length >= 3));
    ok('shell elements topic', topics.some(t => t.title === 'Shell Elements' && t.illustrations === 'shellElements' && (t.equations||[]).length >= 3));
    ok('truss elements topic', topics.some(t => t.title === 'Truss Elements' && t.illustrations === 'trussElements' && (t.equations||[]).length >= 3));
    ok('contact topic', topics.some(t => t.title === 'Contact and Friction' && Array.isArray(t.scenes) && t.scenes.includes('hertzContact') && t.scenes.includes('beamContact')));
    ok('basic equations has momentum', topics.some(t => t.title === 'Basic Equations' && t.scene === 'linearMomentum' && ((t.equations||[]).some(e => /momentum/i.test(e.name)) || (t.flow||[]).some(s => (s.items||[]).some(e => /momentum/i.test(e.name))))));
    ok('basic equations has narrative flow', topics.some(t => t.title === 'Basic Equations' && Array.isArray(t.flow) && t.flow.length >= 4));
    ok('balance laws expanded', topics.some(t => t.title === 'Balance Laws & Conservation' && (t.equations||[]).length >= 5));
    ok('arc-length topic', topics.some(t => t.title === 'Path Following and Arc-Length'));
    ok('buckling scene wired', topics.some(t => t.scene === 'columnBuckling'));
    ok('fracture mechanics overview', topics.some(t => t.title === 'Fracture Mechanics' && t.illustrations === 'fractureOverview'));
    ok('lefm topic', topics.some(t => t.title === 'Linear Elastic Fracture Mechanics' && Array.isArray(t.scenes) && t.scenes.includes('lefm') && t.scenes.includes('lefmCenterCrack')));
    ok('mixed-mode cracking topic', topics.some(t => t.title === 'Mode I, II & Mixed-Mode Cracking' && t.illustrations === 'mixedModeCrack' && (t.equations||[]).length >= 3));
    ok('cohesive cracking topic', topics.some(t => t.title === 'Cohesive Cracking' && Array.isArray(t.scenes) && t.scenes.includes('cohesiveCrack') && t.scenes.includes('dcbCohesive')));
    ok('j-integral topic', topics.some(t => t.title === 'The J-Integral' && t.scene === 'jIntegral'));
    ok('phase-field fracture topic', topics.some(t => t.title === 'Phase-Field Modelling of Fracture' && t.scene === 'phaseFieldFracture' && (t.equations||[]).length >= 3));
    ok('fiber composites topic', topics.some(t => t.title === 'Fiber-Reinforced Composites'));
    ok('embedded fiber models topic', topics.some(t => t.title === 'Embedded Fiber Models' && Array.isArray(t.scenes) && t.scenes.includes('fiberInterface') && t.scenes.includes('fiberPullout')));
    ok('fiber neutrality topic', topics.some(t => t.title === 'Fiber Neutrality and Rigid Line Inclusions'));
    ok('fiber neutrality scene wired', topics.some(t => t.scene === 'fiberNeutrality3d'));
    ok('multiphase porous topic', topics.some(t => t.title === 'Multiphase Porous Materials' && t.illustrations === 'porousOverview'));
    ok('one-d consolidation topic', topics.some(t => t.title === 'One-Dimensional Consolidation' && t.scene === 'consolidation'));
    ok('gibson consolidation topic', topics.some(t => t.title === 'Gibson Consolidation' && t.scene === 'consolidationGibson'));
    ok('gpu fem pipeline topic', topics.some(t => t.title === 'GPUs in the FEM Pipeline' && t.scene === 'gpuFem'));

    badge.textContent = `All ${results.filter(r=>r.pass).length}/${results.length} tests passed ✓`;
  }catch(e){
    badge.textContent = 'Tests encountered an error: ' + e.message;
    console.error(e);
  }
})();
