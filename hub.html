  <style>
    :root{
      --paper:#f7f6f2;--ink:#1c2430;--ink-soft:#3d4756;--rule:#d8d4cb;
      --navy:#1e3a5f;--blue:#3a5f8a;--accent:#c45c26;--card:#fff;
      --muted:#5c6574;--danger:#9b2c2c;--danger-bg:#f8e8e4;--danger-border:#e2b8ae;
      --success:#2f6b4f;--success-bg:#e7f2ea;--success-border:#b7d4c3;
      --radius:0;--ease:ease;--transition:0.15s ease;
      --text:var(--ink);--text-body:var(--ink-soft);
      --border:var(--rule);--border-hover:#c9c4b8;--border-strong:#b7b1a4;
      --surface-1:#fff;--surface-2:#f1efe9;--surface-3:#fff;
      --accent-2:var(--navy);--accent-faint:#f3ece6;--accent-soft:#f7efe8;
      --accent-2-dim:#eef2f7;--accent-glow:transparent;--accent-line:var(--rule);
      --accent-mid:var(--blue);--accent-deep:var(--navy);
      --shadow:none;--shadow-soft:none;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    html{color-scheme:light;scrollbar-gutter:stable}
    body{
      margin:0;
      font-family:"Source Sans 3", ui-sans-serif, system-ui, sans-serif;
      color:var(--ink);
      background:var(--paper);
    }
    a{color:var(--blue)}
    a:hover{color:var(--accent)}
    .app{
      display:grid;
      grid-template-columns:minmax(260px,300px) 1fr;
      grid-template-rows:auto 1fr;
      grid-template-areas:"header header" "sidebar content";
      height:100vh;
    }
    header{
      grid-area:header;
      position:sticky;top:0;z-index:20;
      background:#fff;
      border-bottom:1px solid var(--rule);
      display:flex;align-items:center;gap:20px;
      padding:12px 28px;
    }
    header .brand{display:flex;align-items:center;text-decoration:none}
    .visually-hidden{
      position:absolute;width:1px;height:1px;padding:0;margin:-1px;
      overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
    }
    .brand-logo{display:block;height:52px;width:auto}
    .top-nav{margin-left:auto;display:flex;align-items:center;gap:4px}
    .top-nav a{
      color:var(--navy);text-decoration:none;font-size:0.92rem;font-weight:600;
      padding:8px 12px;
    }
    .top-nav a.active{box-shadow:inset 0 -2px 0 var(--accent)}
    .menu-toggle{
      display:none;appearance:none;border:1px solid var(--rule);background:#fff;
      color:var(--navy);font:inherit;font-size:0.88rem;font-weight:600;
      padding:8px 12px;cursor:pointer;margin-left:8px;
    }
    .menu-toggle:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
    .sidebar-backdrop{
      display:none;position:fixed;inset:0;background:rgba(28,36,48,0.35);z-index:25;
    }
    .sidebar-backdrop.open{display:block}
    .search{
      display:flex;align-items:center;gap:10px;
      background:#fff;border:1px solid var(--rule);padding:8px 12px;
      margin:0 8px 12px;
    }
    .search svg{color:#6b7382;flex-shrink:0}
    .search svg path{fill:currentColor}
    .search:focus-within{border-color:var(--navy)}
    .search input{
      background:transparent;border:none;outline:none;color:var(--ink);
      flex:1;min-width:0;font-family:inherit;font-size:0.95rem;
    }
    .search input::placeholder{color:#8a93ab}

    .sidebar{
      grid-area:sidebar;overflow:auto;scrollbar-gutter:stable;
      border-right:1px solid var(--rule);
      background:#f1efe9;
      padding:14px 10px 28px;
    }
    .part-jump{
      display:flex;flex-wrap:wrap;gap:4px;
      margin:0 8px 12px;padding-bottom:12px;
      border-bottom:1px solid var(--rule);
    }
    .part-jump button{
      appearance:none;border:1px solid var(--rule);background:#fff;
      color:var(--navy);font:inherit;font-size:0.72rem;font-weight:600;
      letter-spacing:0.04em;padding:5px 8px;cursor:pointer;
    }
    .part-jump button:hover{border-color:var(--navy)}
    .part-jump button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
    .part-jump button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
    .part-group{margin:0 0 2px}
    .part-toggle{
      display:flex;align-items:center;gap:8px;width:100%;
      margin:0;padding:10px 8px 8px;
      border:none;background:transparent;cursor:pointer;
      font:inherit;text-align:left;
      color:var(--accent);font-size:0.72rem;font-weight:600;
      text-transform:uppercase;letter-spacing:.1em;
    }
    .part-toggle:hover{color:var(--navy)}
    .part-toggle:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}
    .part-toggle .part-label{flex:1;min-width:0;line-height:1.35}
    .part-toggle .part-meta{
      flex-shrink:0;font-size:0.7rem;font-weight:600;letter-spacing:0;
      text-transform:none;color:var(--muted);
    }
    .part-toggle .chev{
      flex-shrink:0;width:0;height:0;
      border-left:4px solid transparent;border-right:4px solid transparent;
      border-top:5px solid currentColor;
      transition:transform 0.15s ease;
    }
    .part-group.collapsed .chev{transform:rotate(-90deg)}
    .part-group.collapsed .tabs{display:none}
    .part-group.current .part-toggle{color:var(--navy)}
    .tabs{display:flex;flex-direction:column;padding:0 0 6px}
    .tab{
      display:block;width:100%;
      padding:8px 10px 8px 12px;
      border:none;border-left:2px solid transparent;
      cursor:pointer;text-align:left;background:transparent;
      font-family:inherit;font-size:0.9rem;line-height:1.35;color:var(--navy);
    }
    .tab:hover{background:#e8e4db}
    .tab:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}
    .tab.active{
      background:#fff;
      border-left-color:var(--accent);
      font-weight:600;
    }
    .topic-nav{
      display:grid;grid-template-columns:1fr 1fr;gap:12px;
      margin-top:2.4rem;padding-top:1.4rem;border-top:1px solid var(--rule);
    }
    .topic-nav button{
      appearance:none;border:1px solid var(--rule);background:#fff;
      color:var(--navy);font:inherit;text-align:left;
      padding:14px 16px;cursor:pointer;min-width:0;
    }
    .topic-nav button:hover{border-color:var(--navy)}
    .topic-nav button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
    .topic-nav button:disabled{opacity:0.4;cursor:default;border-color:var(--rule)}
    .topic-nav button:disabled:hover{border-color:var(--rule)}
    .topic-nav .dir{
      display:block;font-size:0.72rem;font-weight:600;letter-spacing:0.08em;
      text-transform:uppercase;color:var(--accent);margin-bottom:4px;
    }
    .topic-nav .name{
      display:block;font-family:"Source Serif 4",Georgia,serif;
      font-size:1rem;font-weight:600;line-height:1.3;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .topic-nav .next{text-align:right}

    .content{grid-area:content;overflow:auto;padding:36px 40px 64px}
    .card{
      background:transparent;border:none;padding:0;
      max-width:42rem;margin:0 auto;
    }
    .breadcrumbs{
      display:flex;flex-wrap:wrap;gap:6px;
      font-size:0.88rem;color:var(--muted);margin-bottom:14px;
    }
    .breadcrumbs span::after{content:" · ";color:var(--rule)}
    .breadcrumbs span:last-child{color:var(--ink-soft);font-weight:600}
    .breadcrumbs span:last-child::after{content:none}
    h1{
      margin:0 0 22px;
      font-family:"Source Serif 4", Georgia, serif;
      font-size:clamp(1.7rem, 2.6vw, 2.25rem);
      font-weight:600;letter-spacing:-0.02em;line-height:1.2;color:var(--navy);
    }
    h2{
      margin:1.8em 0 .55em;
      font-family:"Source Serif 4", Georgia, serif;
      font-size:1.2rem;letter-spacing:0;text-transform:none;
      color:var(--navy);font-weight:600;
    }
    .prose p, .card > p, .content p{line-height:1.7;color:var(--ink-soft);margin:0 0 1em}
    .card > p, .content > p{margin:0 0 1em}
    ul{margin:.35em 0 1em;padding-left:1.2em;color:var(--ink-soft)}
    li{margin:.35em 0}

    .badges,.cta-row,.footer,#test-badge{display:none !important}
    .badge{display:none}

    .card:has(.scene-frame){max-width:52rem}
    .scene-frame{
      display:block;width:100%;height:min(52vh,420px);
      border:1px solid var(--rule);background:#1a2740;margin-top:8px;
    }
    .scene-frame-tall{height:min(84vh,720px)}
    .figure-caption{margin:0 0 4px;font-size:0.9rem;color:var(--muted)}
    .figure-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(min(100%, 240px), 1fr));
      gap:16px;margin-top:12px;
    }
    .figure-card{
      margin:0;border:1px solid var(--rule);padding:14px;background:#fff;
    }
    .figure-card figcaption{
      font-size:0.85rem;color:var(--ink-soft);margin-top:10px;line-height:1.5;
    }
    .figure-card .illustration-svg{
      width:100%;height:auto;max-height:200px;display:block;color:var(--navy);
    }
    .figure-card .illustration-svg .ink{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .figure-card .illustration-svg .ink-thick{stroke-width:3.5}
    .figure-card .illustration-svg .muted-line{stroke:var(--muted);stroke-dasharray:5 4;opacity:0.85}
    .figure-card .illustration-svg .fill-soft{fill:#e8e0d4;stroke:none}
    .figure-card .illustration-svg text{
      fill:var(--muted);font-family:"Source Sans 3",system-ui,sans-serif;font-size:11px;font-weight:500;
    }
    .figure-card .illustration-svg .label-strong{fill:var(--navy);font-weight:600}

    .tool{
      margin-top:28px;border:1px solid var(--rule);background:#fff;padding:20px 22px;
    }
    .tool-head{display:flex;align-items:flex-start;gap:14px;justify-content:space-between;flex-wrap:wrap}
    .tool-title{
      font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:1.15rem;color:var(--navy);
    }
    .tool-sub{color:var(--muted);font-size:0.92rem;margin-top:4px;line-height:1.5}
    .seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .chip{
      border:1px solid var(--rule);background:#f7f6f2;color:var(--navy);
      padding:7px 12px;cursor:pointer;font-size:0.85rem;font-family:inherit;font-weight:500;
    }
    .chip:hover{border-color:var(--navy)}
    .chip:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
    .chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
    .panel{border:1px solid var(--rule);background:#f7f6f2;padding:14px 16px}
    .panel h3{
      margin:0 0 10px;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;
      color:var(--accent);font-weight:600;
    }
    .kv{display:flex;flex-wrap:wrap;gap:8px}
    .pill{
      font-size:0.78rem;padding:5px 10px;border:1px solid var(--rule);
      background:#fff;color:var(--ink-soft);
    }
    .warn{border-color:var(--danger-border);background:var(--danger-bg);color:var(--danger)}
    .ok{border-color:var(--success-border);background:var(--success-bg);color:var(--success)}
    .muted{color:var(--muted)}
    .mono{font-family:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;font-size:0.92em}
    .part-path{
      display:flex;flex-wrap:wrap;align-items:center;gap:6px 0;
      margin:0 0 18px;padding:0 0 14px;
      border-bottom:1px solid var(--rule);
      font-size:0.78rem;font-weight:600;letter-spacing:0.04em;
      text-transform:uppercase;color:var(--muted);
    }
    .part-path .arc{
      color:var(--navy);letter-spacing:0.08em;
    }
    .part-path .sep{margin:0 8px;color:var(--rule);font-weight:400;letter-spacing:0}
    .part-path .pos{font-variant-numeric:tabular-nums;letter-spacing:0.02em}
    .part-arcs{
      display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px;
    }
    .part-arcs button{
      appearance:none;border:1px solid var(--rule);background:#fff;
      color:var(--muted);font:inherit;font-size:0.78rem;font-weight:600;
      letter-spacing:0.04em;text-transform:uppercase;
      padding:6px 10px;cursor:pointer;
    }
    .part-arcs button:hover{border-color:var(--navy);color:var(--navy)}
    .part-arcs button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
    .part-arcs button.current{
      background:var(--navy);border-color:var(--navy);color:#fff;cursor:default;
    }

    .topic-lead{
      margin:-6px 0 1.4rem;
      font-family:"Source Serif 4",Georgia,serif;
      font-size:1.12rem;line-height:1.55;color:var(--ink-soft);
      max-width:38rem;
    }
    .topic-bridge{
      margin:2rem 0 0;padding:16px 0 0;
      border-top:1px solid var(--rule);
      color:var(--muted);font-size:0.98rem;line-height:1.6;
      font-style:italic;max-width:40rem;
    }
    .topic-bridge strong{
      font-style:normal;font-weight:600;color:var(--navy);
    }

    .prose{display:flex;flex-direction:column;gap:0}
    .prose p{
      margin:0 0 1.05em;padding:0 0 0 1rem;
      border-left:2px solid transparent;
      line-height:1.72;color:var(--ink-soft);
    }
    .prose p:first-child{
      border-left-color:var(--accent);
      color:var(--ink);
    }
    .prose p:last-child{margin-bottom:0}

    .eq-list{display:flex;flex-direction:column;gap:0;margin:8px 0 28px}
    .eq-card{
      background:transparent;border:none;border-left:2px solid var(--rule);
      padding:0 0 1.5rem 1rem;margin:0;
    }
    .eq-card:last-child{padding-bottom:0}
    .eq-card h3{
      margin:0 0 8px;
      font-family:"Source Serif 4",Georgia,serif;
      font-size:1.08rem;font-weight:600;color:var(--navy);
    }
    .eq-card .eq{

        {

          tex:"\\boldsymbol{\\sigma} = \\lambda\\,\\mathrm{tr}(\\boldsymbol{\\varepsilon})\\,\\mathbf{I} + 2\\mu\\,\\boldsymbol{\\varepsilon}",

          body:"Thermal expansion enters the stress as an isotropic eigenstress. The heat equation gains a coupling term −(3λ+2μ)α T₀ ∂_t(∇ · u): deformation does work on the thermal field. Two-way thermoelasticity exchanges energy between displacement and temperature; one-way coupling keeps only the thermal stress in momentum.",

  {part:"Part I – Continuum Mechanics", title:"Introduction to Continuum Mechanics", bullets:[
    "Continuum mechanics models material as a continuous body occupying a region Ω ⊂ ℝ³. Fields such as density ρ, velocity v, stress σ, and temperature are assigned at every point as averages over a small representative volume. The approximation requires scale separation: the averaging volume must be large compared with the microstructure and small compared with the macroscopic length over which those fields vary.",
    "This common framework covers solids, fluids, and coupled media. Universal balance laws remain the same; kinematic assumptions, constitutive equations, internal variables, and additional fields select elasticity, plasticity, viscoelasticity, fluid flow, poromechanics, thermo-mechanics, or fluid–structure interaction.",
    "Two main sources of nonlinearity in solids: material nonlinearity (nonlinear stress–strain laws; contact and friction are often grouped here) and geometric nonlinearity (equilibrium and stiffness depend on the deformed shape, including deformation-dependent boundaries and loads).",
    "Linear continuum models assume deformations are small enough that changes in geometry can be ignored when writing equilibrium and strain; nonlinear models place no such restriction—kinematics, stress, equilibrium, and constitutive laws are the same subjects, but without the small-deformation shortcut.",
    "Nonlinear computational mechanics means formulating those continuous governing equations and then solving them numerically—today almost always with the finite element method: approximate the continuum with nodes and elements, introduce shape functions for geometry and unknown fields, and replace the strong form with a weak integral statement (e.g. principle of virtual work or stationary potential energy).",
    "Discretization yields a finite set of nonlinear algebraic equations in the nodal degrees of freedom (e.g. displacements). These are typically solved with Newton–Raphson iteration, which requires a consistent tangent (Jacobian) of the residual—exactly the matrix structure you build in nonlinear FE codes.",
    "Simple geometrically nonlinear structures: a rigid bar on a torsional spring (cantilever model) gives FL cos θ = Kθ; for small θ, cos θ → 1 and the linear relation F ≈ (K/L)θ is recovered. The full nonlinear path stays physical (e.g. θ remains below π/2 in that idealization).",
    "The same idea vertically (column model) gives PL sin θ = Kθ. Besides the trivial θ = 0 solution, a second branch appears—bifurcation. For small θ, linearization yields (K − PL)θ = 0, giving the elastic critical load P = K/L (Euler-type buckling in a structural analog). In FE, plate and shell buckling often appears as an eigenvalue problem for critical loads and modes.",
    "When bodies deform finitely, strain must be defined carefully. In 1D, common measures include engineering strain (l − L)/L, logarithmic (natural) strain ln(l/L), Green strain (l² − L²)/(2L²), and Almansi strain (l² − L²)/(2l²). Taylor expansion shows that as l → L, all of these reduce to the small-strain increment ∆l/l over the reference length.",
    "A single truss bar under large displacement illustrates the full pipeline: equilibrium at a joint leads to a residual R(x) = 0 that is highly nonlinear in the position x (because bar length and angle depend on x). Constitutive laws written in terms of different strain measures change the force–stretch relation; work-conjugate stress–strain pairs matter for 3D (preview only in Ch. 1, detailed later).",
    "Directional derivatives and linearization of nonlinear equations are the bridge between continuum theory and Newton–Raphson: each iteration solves a linearized problem until the residual vanishes—prototype for every nonlinear FE increment.",
    "The figures below collect the elementary models used to introduce those ideas: a rigid bar on a spring, a column that buckles, one-dimensional strain measures, a truss joint, qualitative equilibrium paths, and a single Newton step.",
    "The account follows Bonet and Wood, Nonlinear Continuum Mechanics for Finite Element Analysis, Chapter 1."
  ], tags:["continuum","continuum hypothesis","RVE","scale separation","solid mechanics","fluid mechanics","coupled problems","material nonlinearity","geometric nonlinearity","FEM","virtual work","Newton-Raphson","tangent","buckling","bifurcation","Green strain","Almansi strain","logarithmic strain","engineering strain","linearization","Bonet-Wood"], illustrations:"introContinuum"},
  {part:"Part I – Continuum Mechanics", title:"Kinematics of Deformation", bullets:[
    "A motion x = χ(X,t) maps a material point X in the reference configuration Ω₀ to its position x in the current configuration Ωₜ; displacement is u(X,t) = x − X. When displacement gradients are small, the symmetric gradient of u is enough to measure strain.",
    "When they are not, strain is defined from the deformation gradient F = ∂x/∂X, the linear map that sends a material line element dX to dx. Its positive Jacobian J = det F gives the local volume ratio dv = J dV. Rigid translation never appears in F; rotation, stretch, shear, and volume change do.",
    "The right Cauchy–Green tensor C = Fᵀ F and the left Cauchy–Green tensor b = F Fᵀ are stretch without rotation. Their eigenvalues are the squared principal stretches.",
    "The figure runs through those cases on a homogeneous motion. The blue grid is the reference placement; the orange grid is its image. The two arrows are the columns of F: the images of the material unit vectors e₁ and e₂."
  ], tags:["kinematics","deformation","deformation gradient","small strain","large strain","Cauchy-Green"], scene:"deformationGradient"},
  {part:"Part I – Continuum Mechanics", title:"Tensors and the Divergence Theorem", bullets:[
    "Vectors and second-order tensors are the language of the field equations. Components transform when the basis changes; the objects themselves do not. Index notation makes that bookkeeping compact: repeated indices are summed, and a comma denotes a derivative.",
    "The divergence theorem turns a volume integral of a derivative into a surface integral. For the Cauchy stress it reads ∫ ∇·σ dV = ∫ σ n dA, which is why the local momentum equation and the statement of traction on the boundary are the same balance.",
    "Coordinate transformations of a vector use a single rotation matrix; those of a stress or strain use the matrix on both sides. Principal directions are the eigenvectors of that tensor, independent of the basis in which it was first written."
  ], tags:["tensor","index notation","divergence theorem","transformation"]},
  {part:"Part I – Continuum Mechanics", title:"Polar Decomposition", bullets:[
    "Any invertible F factors uniquely as F = R U = V R, with R a rotation and U, V symmetric positive-definite stretches. U stretches in the reference placement, then R rotates; V stretches in the current placement after the same rotation.",
    "Neither order is more physical than the other. Both describe the same final map. Strain measures that are built from U or from C = U² are blind to R, which is the point: a rigid rotation must not look like stretch.",
    "In computation U is the unique positive square root of C. Iterative polar algorithms average a matrix with its inverse-transpose until the result is orthogonal; that limit is R.",
    "The figure runs the two factorisations side by side. They coincide on the same parallelogram: that common map is F."
  ], tags:["polar decomposition","stretch","rotation","right stretch","left stretch"], scene:"polarDecomposition"},
  {part:"Part I – Continuum Mechanics", title:"Finite Strain Measures", bullets:[
    "Change of squared length is the invariant that strain must capture. Green–Lagrange strain E = ½(C − I) = ½(FᵀF − I) lives on the reference placement. Almansi strain e = ½(I − b⁻¹) lives on the current placement. Both vanish in a rigid motion.",
    "In one dimension the same stretch λ = l/L gives engineering strain λ − 1, Green strain ½(λ² − 1), Almansi ½(1 − 1/λ²), and logarithmic (true) strain ln λ. They agree to first order as λ → 1 and disagree as soon as the stretch is finite.",
    "In terms of displacement, Green strain keeps the quadratic terms in ∇u written with respect to X; Almansi keeps them with respect to x. Dropping those products recovers the infinitesimal strain ε.",
    "The figure applies a pure rotation to both squares. Green strain stays zero. Drawing I + ε for the same motion shrinks the left square: infinitesimal strain has mistaken a rotation for stretch."
  ], tags:["Green-Lagrange","Almansi","logarithmic strain","engineering strain","stretch"], scene:"rotationStrain"},
  {part:"Part I – Continuum Mechanics", title:"Principal Stretches and Invariants", bullets:[
    "The eigenvalues of U are the principal stretches λᵢ. The invariants of C (or of b) are I₁ = tr C, I₂ = ½[(tr C)² − tr(C²)], I₃ = det C = J². Isotropic hyperelastic laws are functions of those three numbers.",
    "Hydrostatic, or volumetric, strain is the part that changes volume; the deviator is the rest, which changes shape at constant volume. In the small-strain limit the split is ε = (tr ε/3) I + ε′. The same split on stress is the path to von Mises.",
    "A pure rotation leaves every invariant of C equal to that of I. A computation that reports strain after a large rotation but a small stretch has usually used a measure that still contains R.",
    "The two blocks split that idea: the left changes volume and keeps its shape; the right changes shape and keeps its volume."
  ], tags:["invariants","principal stretch","hydrostatic","deviatoric","J"], scene:"hydroDeviator"},
  {part:"Part I – Continuum Mechanics", title:"Velocity Gradient and Material Derivative", bullets:[
    "The spatial velocity gradient is L = ∇v = Ḟ F⁻¹. Its symmetric part D = ½(L + Lᵀ) is the rate of deformation; its skew part W = ½(L − Lᵀ) is the spin. Stretching lives in D; rigid spin lives in W.",
    "From the polar factor, L = R (Ũ U⁻¹) Rᵀ + Ṙ Rᵀ. The second term is pure spin. The first is the stretching, rotated into the current placement.",
    "The material derivative of a spatial field is D(·)/Dt = ∂(·)/∂t + v · ∇(·). It is the rate seen by a particle, not the rate at a fixed point in space. Mass balance and the chain rule for F both use it.",
    "The three crosses are D, W, and L = D + W. Stretching, spin, and simple shear."
  ], tags:["velocity gradient","rate of deformation","spin","material derivative"], scene:"velocityGradient"},
  {part:"Part I – Continuum Mechanics", title:"Cauchy Stress and Traction", bullets:[
    "The traction t on a surface with outward unit normal n is force per current area. Cauchy’s theorem says it is linear in n: t = σ n. The tensor σ is the Cauchy stress.",
    "The normal component is n · σ n; the shear component is the remainder, t − (n · σ n) n. Both are scalars or vectors on that cut, not a replacement for the full tensor.",
    "Because t is defined on the current surface, the arrows move when the body deforms. Stresses pulled back to the reference placement are different tensors, used when the weak form is written on the undeformed mesh.",
    "Turn the cut in the figure. The stress tensor is fixed; the traction, and its split into normal and shear, are not."
  ], tags:["traction","Cauchy stress","normal stress","shear"], scene:"tractionCut"},
  {part:"Part I – Continuum Mechanics", title:"Balance Laws & Conservation", equations:[
    {name:"Mass (spatial)", expr:"∂ρ/∂t + ∇ · (ρ v) = 0", tex:"\\dfrac{\\partial\\rho}{\\partial t} + \\nabla\\cdot(\\rho\\mathbf{v}) = 0", note:"Continuity. Referential: ρ₀ = ρ J."},
    {name:"Linear momentum (spatial)", expr:"∇ · σ + ρ b = ρ a", tex:"\\nabla\\cdot\\boldsymbol{\\sigma} + \\rho\\mathbf{b} = \\rho\\mathbf{a}", note:"Cauchy’s first law. Quasi-static: ∇ · σ + ρ b = 0."},
    {name:"Linear momentum (integral)", expr:"∫_∂Ω t dA + ∫_Ω ρ b dV = d/dt ∫_Ω ρ v dV", tex:"\\displaystyle\\int_{\\partial\\Omega}\\mathbf{t}\\,\\mathrm{d}A + \\int_{\\Omega}\\rho\\mathbf{b}\\,\\mathrm{d}V = \\dfrac{\\mathrm{d}}{\\mathrm{d}t}\\int_{\\Omega}\\rho\\mathbf{v}\\,\\mathrm{d}V", note:"Global statement on any part Ω. Localization plus the divergence theorem recovers the PDE."},
    {name:"Linear momentum (referential)", expr:"Div P + ρ₀ B = ρ₀ A", tex:"\\mathrm{Div}\\,\\mathbf{P} + \\rho_0\\mathbf{B} = \\rho_0\\mathbf{A}", note:"Same physics on the reference placement; used by Total Lagrangian FEM."},
    {name:"Angular momentum", expr:"σ = σᵀ", tex:"\\boldsymbol{\\sigma} = \\boldsymbol{\\sigma}^{\\mathsf{T}}", note:"No couple stresses. Equivalently P Fᵀ = F Pᵀ."},
    {name:"Energy", expr:"ρ ė = σ : D − ∇ · q + ρ r", tex:"\\rho\\,\\dot{e} = \\boldsymbol{\\sigma} : \\mathbf{D} - \\nabla\\cdot\\mathbf{q} + \\rho r", note:"Internal energy, stress power, heat flux, and supply."}
  ], bullets:[
    "Mass, linear momentum, angular momentum, and energy are conserved in every continuum theory — or balanced, once heat flux and external power are admitted. Once a stress (and a heat flux) are introduced, the local forms of those statements become partial differential equations.",
    "Linear momentum on a deforming body is Cauchy’s first law: ∇ · σ + ρ b = ρ a. Globally, the resultant of tractions and body forces equals the rate of change of linear momentum of that part. The divergence theorem turns the surface term into ∇·σ and yields the PDE.",
    "Part of the boundary is supported, with prescribed displacement and an unknown reaction. Applied tractions act on the free surface and move with it. The acceleration a is that of the material points. Those boundary partitions are data; they do not replace the balance laws.",
    "The same statement written on the reference placement uses the first Piola–Kirchhoff stress: Div P + ρ₀ B = ρ₀ A. Choosing spatial or referential form is a bookkeeping choice that matches Updated versus Total Lagrangian discretizations.",
    "Angular momentum, in the absence of couple stresses, requires the Cauchy stress to be symmetric. Energy balance introduces temperature and heat flux; mechanical theories often close it later, after momentum and a constitutive law are already on the table.",
    "The figure is a body on a small support. Reactions and free-surface tractions close the global momentum balance while the local equation holds in the interior."
  ], tags:["balance","momentum","energy","mass","Cauchy","traction","Piola"], scene:"linearMomentum"},
  {part:"Part I – Continuum Mechanics", title:"Constitutive Models", bullets:[
    "Balance laws do not determine the stress. A constitutive model relates stress to the history of deformation: Hooke’s law for small elastic strain, hyperelasticity for finite elastic strain, viscoelasticity when rate matters, and plasticity when unloading leaves a permanent set.",
    "Every model is constrained by the same list of requirements. It must be independent of the observer (objectivity), it must not produce energy in a closed cycle unless that energy is accounted for as heat or as stored energy, and it must have a well-posed initial-boundary-value problem. The Clausius–Duhem inequality is the usual filter for the last two.",
    "The same momentum equation describes a fluid once Newton’s law of viscosity replaces Hooke’s law. The choice of model is the choice of what the material is allowed to forget: an elastic solid remembers only the current stretch; a plastic solid remembers a yield surface and a plastic strain; a fluid remembers nothing of the reference placement."
  ], tags:["elasticity","plasticity","viscoelasticity","hyperelasticity"]},
  {part:"Part I – Continuum Mechanics", title:"Work-Conjugate Stresses", bullets:[
    "Power per reference volume can be written in several equivalent ways. Cauchy stress is conjugate to the rate of deformation D, up to the factor J: τ : D with Kirchhoff stress τ = J σ. The first Piola–Kirchhoff stress P = J σ F⁻ᵀ is conjugate to Ḟ. The second Piola–Kirchhoff stress S = F⁻¹ P is conjugate to Ė.",
    "Those pairings are not a matter of taste. A stored-energy function differentiated with respect to E returns S, not σ. Using Cauchy stress with Green strain, or an unrotated rate of σ with D, produces spurious dissipation in a rigid rotation.",
    "When stretches and rotations are both small, P, S, and σ coincide to first order. The distinction matters as soon as either is finite.",
    "The figure keeps the force on a face fixed. The Piola arrow is drawn on the reference square; the Cauchy arrow on the stretched square."
  ], tags:["Piola-Kirchhoff","Kirchhoff stress","work conjugate","energy"], scene:"workConjugates"},
  {part:"Part I – Continuum Mechanics", title:"Principal Stresses and von Mises", bullets:[
    "The principal stresses are the eigenvalues of σ. The hydrostatic part is the mean (tr σ)/3; the deviator is σ′ = σ − (tr σ/3) I. Plasticity in metals is, to a first approximation, independent of the hydrostatic part.",
    "The von Mises equivalent stress is √(3/2 σ′ : σ′), the magnitude of the deviator scaled so that it equals |σ| in uniaxial tension. In principal-stress space the yield condition σ_vm = σ_y is a cylinder along the hydrostatic axis.",
    "The same split on strain separates change of volume from change of shape. In isotropic linear elasticity the deviators are related by ε′ = σ′ / (2G) and the spherical parts by the bulk modulus.",
    "The cylinder in the figure is that yield surface. A path along the diagonal never hits it; a path with enough shear does."
  ], tags:["principal stress","von Mises","deviatoric","hydrostatic","yield"], scene:"vonMises"},
  {part:"Part I – Continuum Mechanics", title:"Objective Rates", bullets:[
    "A constitutive law written in rate form must not invent stress when the body only rotates. The material derivative of Cauchy stress does invent such a stress, because the components change with the spinning basis.",
    "An objective rate subtracts that spin. The Jaumann rate uses W from the velocity gradient; Green–Naghdi uses Ṙ Rᵀ from the polar rotation. They agree at small stretch and differ in large shear.",
    "Alternatively one works with S and E, which live on the reference placement and need no spatial rate. That is why many finite-strain elasticities are written there and pushed forward only for output.",
    "The figure spins a block that carries a constant uniaxial Cauchy stress along its own axis. Laboratory components change; the Jaumann rate does not."
  ], tags:["Jaumann","Green-Naghdi","objectivity","corotational"], scene:"objectiveRates"},
  {part:"Part I – Continuum Mechanics", title:"Hooke’s Law",
  lead:"Generalized Hooke’s Law establishes the foundational constitutive relation in continuum mechanics for linear elastic materials under small deformations.",
  bullets:[], flow:[
    {
      section:"Constitutive Equations",
      lead:"For isotropic linear elastic solids, the relationship between the Cauchy stress tensor σ and the small strain tensor ε is parameterized by two independent elastic moduli (typically Lamé’s constants λ and μ):",
      items:[
        {
          name:"Lamé form",
          tex:"\\boldsymbol{\\sigma} = \\lambda\\,\\mathrm{tr}(\\boldsymbol{\\varepsilon})\\,\\mathbf{I} + 2\\mu\\,\\boldsymbol{\\varepsilon}",
          body:"",
          bridge:"In terms of Young’s modulus E and Poisson’s ratio ν, the inverted strain–stress formulation is:"
        },
        {
          name:"Compliance form (E, ν)",
          tex:"\\boldsymbol{\\varepsilon} = \\dfrac{1+\\nu}{E}\\boldsymbol{\\sigma} - \\dfrac{\\nu}{E}\\mathrm{tr}(\\boldsymbol{\\sigma})\\,\\mathbf{I}",
          body:"",
          bridge:"The fundamental elastic moduli interrelations are given by:"
        },
        {
          name:"Shear modulus",
          tex:"\\mu = \\dfrac{E}{2(1+\\nu)}",
          body:""
        },
        {
          name:"Bulk modulus",
          tex:"K = \\lambda + \\tfrac{2}{3}\\mu = \\dfrac{E}{3(1-2\\nu)}",
          body:""
        }
      ]
    }
  ], subsections:[
    {
      heading:"Physical Phenomena & Numerical Implications",
      items:[
        {name:"Poisson Contraction", text:"Application of a uniaxial tensile load causes a transverse strain", tex:"\\varepsilon_{\\mathrm{transverse}}=-\\nu\\varepsilon_{\\mathrm{axial}}"},
        {name:"Incompressibility Limit (ν → ½)", text:"As Poisson’s ratio approaches 0.5, the bulk modulus K approaches infinity (K → ∞), modeling an incompressible material where volumetric strain tr(ε) → 0."},
        {name:"Volumetric Locking in FEM", text:"Standard displacement-based Finite Element formulations experience artificial stiffening (volumetric locking) near ν = 0.5 because displacement interpolations cannot satisfy the pointwise zero-volume-change constraint."}
      ]
    },
    {
      heading:"Anisotropy & Range of Validity",
      items:[
        {name:"Anisotropic Materials", text:"The two-parameter model expands to a fourth-order stiffness tensor ℂ such that σ = ℂ : ε, reduced from 81 components to at most 21 independent constants via major and minor symmetries."},
        {name:"Small Strain Assumption", text:"Linear elasticity acts as a first-order Taylor series expansion of hyperelastic strain energy functions (W). It is accurate for metals below the yield point and polymers/rubbers only at near-zero stretches (λ ≈ 1)."},
        {name:"Geometric Non-linearity", text:"Under finite rotations—even with small strains—a frame-invariant (objective) stress–strain rate formulation or conjugate stress–strain measure pair (e.g., Second Piola–Kirchhoff stress and Green–Lagrange strain) must be used."}
      ]
    }
  ], tags:["Hooke","Lamé","Young","Poisson","isotropic","bulk modulus","volumetric locking"], scene:"hookePoisson", sceneFirst:true},
  {part:"Part I – Continuum Mechanics", title:"Hyperelasticity", bullets:[
    "A hyperelastic solid stores energy in the stretch. The second Piola–Kirchhoff stress is the derivative of the strain-energy density W with respect to Green strain, S = ∂W/∂E. In principal stretches, the Cauchy stresses satisfy σᵢ = λᵢ ∂W/∂λᵢ when W is written per reference volume and the axes are principal.",
    "Isotropic W depends on the invariants of C, or on λ₁, λ₂, λ₃. Neo-Hooke uses only I₁; Mooney–Rivlin adds I₂. Incompressibility enforces J = 1 with a pressure that is a Lagrange multiplier, not a constitutive output.",
    "The tangent needed by Newton’s method is the second derivative of W, pushed forward to the current placement. An energy that is not polyconvex can lose ellipticity; the discrete problem then has no unique minimiser.",
    "The block is pulled in one direction and contracts in the other two so that J stays one — the kinematics every incompressible hyperelastic law has to live with."
  ], tags:["hyperelasticity","neo-Hooke","Mooney-Rivlin","strain energy","incompressibility"], scene:"principalStretches"},
  {part:"Part I – Continuum Mechanics", title:"Metal Plasticity", bullets:[
    "Below a yield stress the response is elastic. Beyond it, metals flow at nearly constant volume. The elastic strain is recoverable; the plastic strain is a history, not a state derived from the current stretch alone.",
    "J₂ plasticity yields when the von Mises stress reaches σ_y. The flow direction is the normal to that surface—associated flow. Isotropic hardening expands the cylinder; kinematic hardening translates it (the Bauschinger effect) by a backstress α.",
    "In three dimensions the additive split ε = εᵉ + εᵖ is the small-strain statement; finite strain uses a multiplicative split F = Fᵉ Fᵖ. The return map at each quadrature point is itself a small Newton problem."
  ], tags:["plasticity","J2","yield","hardening","Bauschinger","return map"]},
  {part:"Part I – Continuum Mechanics", title:"Fluids: Continuity and Navier–Stokes", bullets:[
    "Mass balance is the continuity equation ∂ρ/∂t + ∇·(ρ v) = 0. For a constant density it is ∇·v = 0, which is a constraint on the velocity, not an evolution for ρ.",
    "A compressible isotropic Newtonian fluid obeys σ = −p I + 2μ_f D + λ_f tr(D) I, where D = ½(∇v + ∇vᵀ) is the rate of deformation. Unlike an elastic solid, its deviatoric stress depends on deformation rate rather than accumulated strain. Incompressibility sets tr(D) = ∇·v = 0 and removes the bulk-viscous term.",
    "For constant viscosity, substituting the incompressible law σ = −p I + 2μ D into Cauchy’s first law gives Navier–Stokes: ρ(∂v/∂t + v·∇v) = −∇p + μ ∇²v + ρ b, together with ∇·v = 0.",
    "The pressure is the Lagrange multiplier for incompressibility, analogous to the pressure in an incompressible solid. Mixed velocity–pressure elements, or a slightly compressible regularisation, are the discrete counterpart of the mixed u–p pairs used in rubber."
  ], tags:["Navier-Stokes","continuity","Newtonian fluid","viscosity","rate of deformation","compressible","incompressible"]},
  {part:"Part I – Continuum Mechanics", title:"Thermodynamics of Continua", bullets:[
    "The first law balances internal energy with mechanical power and heat. In local form it introduces the heat flux q and a temperature θ. Fourier’s law q = −k ∇θ is the usual constitutive closure for conduction.",
    "The second law, in the Clausius–Duhem form, restricts what a constitutive model may do. A hyperelastic W that depends only on C automatically satisfies it in an isothermal setting; a viscous or plastic model must dissipate.",
    "Thermal expansion couples the heat equation to momentum: strain contains a term α (θ − θ₀) I, and plastic work may heat the body. A staggered split is often enough; a monolithic coupling is needed when the time scales meet."
  ], tags:["thermodynamics","Clausius-Duhem","Fourier","dissipation"]},

  // Part II – Numerical Methods
  {part:"Part II – Numerical Methods", title:"Variational Principles",
  lead:"To make nonlinear finite elements clear, intuitive, and mathematically rigorous, continuum physics must be connected directly to computational execution.",
  bullets:[
    "In linear mechanics, solving a structural problem reduces to K u = F, where the stiffness matrix K is constant. In nonlinear continuum mechanics the residual and tangent stiffness depend on the current deformed state. The solution therefore cannot be obtained in a single step: the continuum equations must be repeatedly linearized and updated.",
    "The sequence below connects the concepts introduced in Chapter 1 of Bonet and Wood: strong form, virtual work, finite-element discretization, consistent linearization, and Newton–Raphson iteration."
  ], flow:[
    {
      section:"1. The Core Pipeline: From Continuum to Code",
      lead:"The core workflow of nonlinear finite-element analysis proceeds through five key stages.",
      items:[
        {
          name:"Pipeline",
          tex:"\\begin{aligned}\\text{Strong Form (PDEs)}&\\xrightarrow{\\text{weak form}}\\text{Virtual Work}\\xrightarrow{\\text{FE discretization}}\\mathbf{R}(\\mathbf{a})\\\\\\mathbf{R}(\\mathbf{a})&\\xrightarrow{\\text{linearization}}\\mathbf{K}_t\\xrightarrow{\\text{Newton update}}\\Delta\\mathbf{a}\\end{aligned}",
          body:"Each arrow is a mathematical operation that must also be implemented consistently in code."
        },
        {
          name:"1. Continuum Governing Equations (Strong Form)",
          tex:"\\boldsymbol{\\nabla}\\cdot\\boldsymbol{\\sigma}+\\mathbf{b}=\\mathbf{0}",
          body:"Local quasi-static momentum balance. Boundary conditions complete the strong boundary-value problem."
        },
        {
          name:"2. Weak Integral Statement",
          tex:"G(\\mathbf{u},\\delta\\mathbf{u})=W_{\\mathrm{int}}-W_{\\mathrm{ext}}=0",
          body:"Multiply momentum balance by an admissible virtual displacement δu and integrate over the domain. Integration by parts lowers the differentiability requirement and introduces the natural traction boundary term."
        },
        {
          name:"3. Finite Element Discretization",
          tex:"\\mathbf{u}(\\mathbf{x})\\approx\\sum_i N_i(\\mathbf{x})\\,\\mathbf{a}_i,\\qquad \\mathbf{R}(\\mathbf{a})=\\mathbf{F}_{\\mathrm{int}}(\\mathbf{a})-\\mathbf{F}_{\\mathrm{ext}}(\\mathbf{a})=\\mathbf{0}",
          body:"Shape functions interpolate the continuous displacement field using nodal unknowns a. Substitution converts the weak continuum statement into a finite system of nonlinear algebraic residual equations."
        },
        {
          name:"4. Directional Derivative (Linearization)",
          tex:"\\mathbf{R}(\\mathbf{a}+\\Delta\\mathbf{a})\\approx\\mathbf{R}(\\mathbf{a})+D\\mathbf{R}(\\mathbf{a})[\\Delta\\mathbf{a}]=\\mathbf{R}(\\mathbf{a})+\\mathbf{K}_t(\\mathbf{a})\\Delta\\mathbf{a},\\qquad \\mathbf{K}_t=\\dfrac{\\partial\\mathbf{R}}{\\partial\\mathbf{a}}",
          body:"The Gâteaux derivative of the nonlinear residual in the increment direction produces the consistent tangent stiffness matrix Kₜ."
        },
        {
          name:"5. Newton–Raphson Iteration",
          tex:"\\mathbf{K}_t(\\mathbf{a}_k)\\Delta\\mathbf{a}_k=-\\mathbf{R}(\\mathbf{a}_k),\\qquad \\mathbf{a}_{k+1}=\\mathbf{a}_k+\\Delta\\mathbf{a}_k,\\qquad \\lVert\\mathbf{R}_{k+1}\\rVert\\rightarrow0",
          body:"Solve the linearized increment, update the nodal state, recompute the residual and tangent, and repeat until the convergence tolerances are satisfied."
        }
      ]
    },
    {
      section:"Variational principles and stored energy",
      items:[
        {
          name:"Stationary total potential",
          tex:"\\Pi(\\mathbf{u})=\\int_{\\Omega}W(\\boldsymbol{\\varepsilon}(\\mathbf{u}))\\,\\mathrm{d}V-\\int_{\\Gamma_t}\\mathbf{t}\\cdot\\mathbf{u}\\,\\mathrm{d}A-\\int_{\\Omega}\\rho\\mathbf{b}\\cdot\\mathbf{u}\\,\\mathrm{d}V,\\qquad \\delta\\Pi=0",
          body:"If the constitutive response derives from a stored energy, the first variation of total potential is the principle of virtual work and the second variation supplies the tangent stiffness."
        },
        {
          name:"Weighted residual and Galerkin form",
          body:"Models that do not derive from a potential still begin with a weighted residual. Multiplication by test functions and integration by parts produce the weak form and its natural boundary terms."
        },
        {
          name:"Stationarity is not uniqueness",
          body:"A nonconvex energy, buckling bifurcation, or limit point may create multiple stationary fields or a saddle point. The discrete nonlinear equations inherit these features, so Newton’s method is local and path-dependent."
        }
      ]
    }
  ], tags:["potential energy","Galerkin","virtual work","variation","strong form","weak form","residual","linearization","tangent stiffness","Newton-Raphson","Bonet Wood"]},
  {part:"Part II – Numerical Methods", title:"Finite Element Method (Introduction)", bullets:[
    "The finite element method is a Galerkin discretisation of a weak form. On each element the unknown field is interpolated by shape functions, uʰ = Σ N_a a_a. Substituting into virtual work, and requiring the residual to vanish for every test function in the same space, produces a finite algebraic system.",
    "Element contributions are integrals of products of shape-function derivatives and constitutive moduli. Those integrals are evaluated at Gauss points and assembled into a global sparse matrix using the map from local to global degrees of freedom. Essential boundary conditions are then imposed on that system.",
    "Accuracy is controlled by the mesh size h, the polynomial degree p, and the regularity of the solution. A crack tip, a sharp corner, or an incompressible constraint can destroy the textbook rates unless the interpolation is chosen for that pathology. The continuum theory does not by itself pick an element."
  ], tags:["FEM","weak form","discretization","elements","Galerkin"]},

  // Interactive element chooser topic
  {part:"Part II – Numerical Methods", title:"Element Types & Families (Chooser)", interactive:"elementChooser", bullets:[
    "Not every element is safe for every problem. Low-order displacement elements lock in thin bending and near incompressibility; reduced integration can introduce hourglass modes; wave problems are limited by numerical dispersion.",
    "The families in common use—C0 Lagrangian elements, high-order and spectral bases, mixed displacement–pressure pairs, discontinuous Galerkin, and virtual elements—exist because each of those failure modes has a standard remedy. Choose a setting below to see which families are appropriate."
  ], tags:["element types","Lagrangian","h-version","p-version","hp-FEM","spectral","mixed","DG","VEM","locking","hourglassing","dispersion"]},

  {part:"Part II – Numerical Methods", title:"Virtual Element Method", bullets:[
    "The virtual element method (VEM) is a Galerkin discretisation on meshes of arbitrary polygons (2-D) or polyhedra (3-D). Degrees of freedom live on the vertices—and, at higher order, on edges, faces, and moments inside the element—but the basis functions inside an element are never constructed explicitly. That is the “virtual” part: the space exists mathematically; the code never evaluates N_a(x) in the interior.",
    "What replaces the classical shape-function integrals is a computable projection. On each element the local virtual space is built so that every polynomial of degree ≤ k belongs to it. From the degrees of freedom alone one recovers a projector Π onto that polynomial space. The consistency term of the local bilinear form is written entirely in terms of Π and is therefore exact for polynomials; a stabilisation term, also assembled from the DOFs, restores coercivity on the kernel of Π.",
    "On a triangle or tetrahedron with the right DOFs the lowest-order VEM recovers a classical linear finite element. On a general n-gon it does not need an isoparametric map, a triangulation of the cell, or quadrature inside a distorted parent. Hanging nodes, non-convex cells, and abrupt local refinement are admissible as long as the mesh remains shape-regular in the polygonal sense.",
    "The payoff is mesh flexibility: complex CAD, fractured domains, and adaptive remeshing can stay on a single polyhedral mesh instead of being forced into triangles and hexahedra. The cost is paid in formulation detail—choosing the projector, scaling the stabilisation, and treating nonlinear constitutive laws through projected strains—rather than in mesh generation. For complex geometry the element chooser lists VEM alongside CutFEM and the finite cell method as a fitted polygonal alternative to unfitted background grids."
  ], tags:["VEM","virtual elements","polygonal","polyhedral","projection","stabilisation","Galerkin","mesh flexibility"], sources:[{label:"Beirão da Veiga, Brezzi, Cangiani, Manzini, Marini & Russo, Basic principles of Virtual Element Methods, Math. Models Methods Appl. Sci. 23 (2013)", href:"https://doi.org/10.1142/S0218202512500492"}]},

  {part:"Part II – Numerical Methods", title:"Extended & Generalized Finite Element Methods (XFEM/GFEM)", equations:[
    {name:"Partition-of-unity enrichment", expr:"uʰ = Σ_I N_I a_I + Σ_J N_J ψ b_J", tex:"\\mathbf{u}^h = \\sum_I N_I\\,\\mathbf{a}_I + \\sum_J N_J\\,\\psi\\,\\mathbf{b}_J", note:"Standard FEM plus enrichment. The nodal partition of unity N_J multiplies a known function ψ that already carries the jump or the singularity; b_J are extra degrees of freedom on selected nodes."},
    {name:"Heaviside (strong discontinuity)", expr:"ψ = H(φ) = {1 if φ ≥ 0;  0 if φ < 0}", tex:"\\psi = H(\\phi) = \\begin{cases} 1 & \\phi \\ge 0 \\\\ 0 & \\phi < 0 \\end{cases}", note:"φ is a level-set (usually signed distance to the crack or interface). Enriching with H lets the displacement jump inside an element without aligning the mesh to the surface."},
    {name:"Crack-tip asymptotics", expr:"ψ_α ∈ {√r sin(θ/2), √r cos(θ/2), …}", tex:"\\psi_\\alpha \\in \\bigl\\{\\sqrt{r}\\sin(\\theta/2),\\;\\sqrt{r}\\cos(\\theta/2),\\;\\ldots\\bigr\\}", note:"Williams leading terms in polar coordinates at the tip. Four (plane) asymptotic functions are the classical LEFM tip enrichment; they restore the 1/√r stress field on a coarse mesh."},
    {name:"Shifted enrichment", expr:"ψ̃(x) = ψ(x) − ψ(x_J)", tex:"\\tilde{\\psi}(\\mathbf{x}) = \\psi(\\mathbf{x}) - \\psi(\\mathbf{x}_J)", note:"Subtracting the nodal value of ψ restores the Kronecker-δ property of the standard DOFs: a_I remains the nodal displacement. Without the shift, Dirichlet data mix a and b."}
  ], bullets:[
    "Extended and generalized FEM are the same partition-of-unity idea under two names. Start from a standard C⁰ mesh. Wherever the solution has a known feature—a jump across a crack or material interface, or a tip singularity—multiply selected shape functions by an enrichment ψ and add the corresponding enriched degrees of freedom. The mesh need not fit the feature; the approximation does.",
    "GFEM (Melenk–Babuška) emphasises the abstract construction: any local function space can be glued by a partition of unity. XFEM (Belytschko and co-workers) is the fracture and interface specialisation: a Heaviside enrichment for the open crack faces, asymptotic tip enrichments for the Williams field, and a level-set (or explicit front) to track geometry as the crack grows. Material interfaces use a ridge or absolute-value enrichment of the signed distance instead of H.",
    "Only nodes whose support meets the discontinuity or the tip are enriched. Elements cut by the crack need special quadrature—sub-triangulation or equivalent—so that the jump is integrated accurately on each side. Blending elements, which see some but not all enriched neighbours, can degrade convergence unless the enrichment is corrected (shifted, corrected XFEM, or topological enrichment rules).",
    "Compared with remeshing, the topology of the crack never appears in the connectivity: propagation updates φ and the enrichment set. Compared with phase-field, the discontinuity stays sharp and the tip field can be built in. The price is bookkeeping—level sets, cut-cell integration, enrichment transitions—and conditioning when tip functions are poorly scaled. Cohesive XFEM replaces the traction-free faces by a traction–separation law on the enriched jump.",
    "The figures below are a crack cutting a fixed mesh with enriched nodes marked, the Heaviside jump across an interface, and the tip enrichment cloud that carries the asymptotic LEFM modes."
  ], tags:["XFEM","GFEM","enrichment","partition of unity","Heaviside","level set","crack tip","blending","CutFEM"], illustrations:"xfemGfem", sources:[{label:"Melenk & Babuška, The partition of unity finite element method, Comput. Methods Appl. Mech. Eng. 139 (1996)", href:"https://doi.org/10.1016/S0045-7825(96)01087-0"},{label:"Moës, Dolbow & Belytschko, A finite element method for crack growth without remeshing, Int. J. Numer. Methods Eng. 46 (1999)", href:"https://doi.org/10.1002/(SICI)1097-0207(19990910)46:1%3C131::AID-NME726%3E3.0.CO;2-J"},{label:"Fries & Belytschko, The extended/generalized finite element method: An overview of the method and its applications, Int. J. Numer. Methods Eng. 84 (2010)", href:"https://doi.org/10.1002/nme.2914"}]},

  {part:"Part II – Numerical Methods", title:"Discontinuous Galerkin Method", equations:[
    {name:"Jump and average", expr:"[[u]] = u⁺ − u⁻,   {σ} = (σ⁺ + σ⁻)/2", tex:"[\\![u]\\!] = u^+ - u^-,\\quad \\{\\boldsymbol{\\sigma}\\} = \\tfrac{1}{2}(\\boldsymbol{\\sigma}^+ + \\boldsymbol{\\sigma}^-)", note:"On an interior face with opposite traces (+) and (−). The jump measures discontinuity; the average is the centred numerical flux for the continuous traction."},
    {name:"Interior residual (elementwise)", expr:"∫_K ∇v · σ(u) dV − ∫_∂K v (σ n) dA", tex:"\\int_K \\nabla v\\cdot\\boldsymbol{\\sigma}(u)\\,\\mathrm{d}V - \\int_{\\partial K} v\\,(\\boldsymbol{\\sigma}\\mathbf{n})\\,\\mathrm{d}A", note:"Integrate the strong form by parts on each element separately. Face terms do not cancel with the neighbour because the spaces are discontinuous — that is where the numerical flux enters."},
    {name:"SIPG interface terms", expr:"∫_Γ (−[[v]]·{σ(u)} − {σ(v)}·[[u]] + (η/h) [[v]]·[[u]]) dA", tex:"\\int_\\Gamma \\Bigl(-[\\![v]\\!]\\cdot\\{\\boldsymbol{\\sigma}(u)\\} - \\{\\boldsymbol{\\sigma}(v)\\}\\cdot[\\![u]\\!] + \\dfrac{\\eta}{h}[\\![v]\\!]\\cdot[\\![u]\\!]\\Bigr)\\,\\mathrm{d}A", note:"Symmetric interior-penalty Galerkin. Consistency uses the average traction; symmetry restores adjoint consistency; the penalty η/h stabilises the jump. NIPG drops the second term; IIPG incomplete variants sit between."},
    {name:"Hyperbolic upwind flux", expr:"û = u⁻ if β·n > 0, else u⁺", tex:"\\hat{u} = \\begin{cases} u^- & \\boldsymbol{\\beta}\\cdot\\mathbf{n} > 0 \\\\ u^+ & \\text{otherwise} \\end{cases}", note:"For advection (or any first-order hyperbolic system) the numerical flux is taken from the upwind side. That single choice supplies both consistency and the dissipation that damps unresolved modes."}
  ], bullets:[
    "Discontinuous Galerkin (DG) keeps a polynomial space on each element and does not enforce continuity across faces. Neighbouring elements communicate only through numerical fluxes on the shared skeleton Γ. The global space is therefore broken: degrees of freedom live element-wise, and hanging nodes or nonconforming interfaces are admissible without multipoint constraints.",
    "For elliptic and solid-mechanics problems the classical family is interior-penalty DG. After integration by parts on every element, consistency requires replacing the missing inter-element traction by an average {σ}, while a penalty (η/h) [[u]] controls the jump. SIPG is symmetric and adjoint-consistent; NIPG and IIPG trade symmetry for a simpler stencil. Hybridisable DG (HDG) introduces face unknowns and statically condenses the element interiors, recovering a globally coupled system only on the skeleton.",
    "For hyperbolic conservation laws and advection-dominated transport, DG uses upwind (or Riemann) fluxes. Local conservation holds element by element: the residual of each cell equals the net numerical flux through its boundary. That property, together with easy p-enrichment and mesh adaptation, is why DG is standard in compressible flow, wave propagation, and neutron transport — historically Reed–Hill — before it entered solids.",
    "Compared with continuous Galerkin, DG pays in degrees of freedom: a linear triangle has three nodal unknowns in CG and typically six (two per vertex, duplicated) in DG, and the gap grows with p. The return is local conservation, natural treatment of discontinuities and nonconforming meshes, and block-diagonal mass matrices that suit explicit dynamics. Compared with XFEM, a crack or interface is usually fitted to element faces (or cut with a specialised numerical flux), not embedded by enrichment inside the cell.",
    "The figures below are two neighbouring elements with independent traces and a jump, the SIPG interface terms on the shared face, and the contrast between a continuous node and duplicated DG unknowns."
  ], tags:["DG","discontinuous Galerkin","SIPG","NIPG","HDG","numerical flux","interior penalty","upwind","local conservation","nonconforming"], illustrations:"discontinuousGalerkin", sources:[{label:"Reed & Hill, Triangular mesh methods for the neutron transport equation, Los Alamos Report LA-UR-73-479 (1973)", href:"https://www.osti.gov/biblio/4491151"},{label:"Arnold, Brezzi, Cockburn & Marini, Unified analysis of discontinuous Galerkin methods for elliptic problems, SIAM J. Numer. Anal. 39 (2002)", href:"https://doi.org/10.1137/S0036142901384162"},{label:"Di Pietro & Ern, Mathematical Aspects of Discontinuous Galerkin Methods, Springer (2012)", href:"https://doi.org/10.1007/978-3-642-22980-0"}]},

  {part:"Part II – Numerical Methods", title:"Shell Elements", equations:[
    {name:"Reissner–Mindlin shear", expr:"γ = ∇w − θ", tex:"\\boldsymbol{\\gamma} = \\nabla w - \\boldsymbol{\\theta}", note:"Independent rotation θ of the director. Transverse shear is first-order; the thin limit γ → 0 is a constraint on the discrete space, not automatic."},
    {name:"Kirchhoff–Love", expr:"θ = ∇w,   γ = 0", tex:"\\boldsymbol{\\theta} = \\nabla w,\\quad \\boldsymbol{\\gamma} = \\mathbf{0}", note:"Normals remain normal. Curvature involves second derivatives of w, so C¹ continuity (or a discrete Kirchhoff construction) is required. Classical thin-plate theory is the flat special case."},
    {name:"Resultant constitutive law", expr:"{N; M} = [A, B; B, D] {ε₀; κ}", tex:"\\begin{Bmatrix} \\mathbf{N} \\\\ \\mathbf{M} \\end{Bmatrix} = \\begin{bmatrix} \\mathbf{A} & \\mathbf{B} \\\\ \\mathbf{B} & \\mathbf{D} \\end{bmatrix}\\begin{Bmatrix} \\boldsymbol{\\varepsilon}_0 \\\\ \\boldsymbol{\\kappa} \\end{Bmatrix}", note:"Membrane forces N and moments M from mid-surface strain and curvature. For a laminate, A, B, D come from classical lamination theory; B = 0 for a symmetric stack."},
    {name:"Shear energy (thin limit)", expr:"(1/2) ∫ G t γ · γ dA → 0 as t/L → 0", tex:"\\tfrac{1}{2}\\int G t\\,\\boldsymbol{\\gamma}\\cdot\\boldsymbol{\\gamma}\\,\\mathrm{d}A \\to 0 \\quad\\text{as}\\quad t/L \\to 0", note:"If the discrete γ cannot vanish in pure bending, this term dominates and the element locks. Assumed-strain / MITC interpolations of γ are the standard cure."}
  ], bullets:[
    "A shell element discretises a thin three-dimensional body on its mid-surface. Through-thickness kinematics are reduced to a director: the displacement of a material point is the mid-surface motion plus a rotation (and stretch, in some continuum shells) of that director. Five or six nodal degrees of freedom are typical — three translations and two or three rotations — instead of a stack of solid elements through the thickness.",
    "Two continuum theories dominate the element catalogue. Kirchhoff–Love (thin) shells enforce zero transverse shear and need C¹ continuity or a discrete Kirchhoff constraint. Reissner–Mindlin (thick / shear-deformable) shells keep independent rotations and C⁰ continuity, which is far easier to implement — and far more prone to shear locking as the thickness-to-span ratio falls. Membrane locking is the curved-shell cousin: parasitic membrane strain in pure bending stiffens the response the same way.",
    "Practical C⁰ shells therefore never leave γ to the raw displacement derivatives alone. MITC (mixed interpolation of tensorial components), assumed natural strain (ANS), and enhanced assumed strain (EAS) replace or enrich the shear (and sometimes membrane) strains so that the thin limit is attainable. Flat facet shells assemble plate bending with a membrane triangle or quad; curved continuum shells carry geometry in the isoparametric map and must resolve both locking modes.",
    "Solid-shell and continuum-shell formulations keep a 3-D constitutive law with one or a few elements through the thickness and special kinematics to avoid locking — useful for composites, contact, and large strain. For laminated plates the mid-surface resultants are exactly the ABD relation of classical lamination theory; interlaminar stress still needs a 3-D or layerwise model.",
    "The element chooser flags bending-dominated shells for Mindlin/Reissner families with a proper shear treatment. The figures below are the mid-surface director, Kirchhoff versus Mindlin kinematics, and the shear-energy trap that produces locking."
  ], tags:["shells","plates","Kirchhoff","Mindlin","Reissner","MITC","ANS","EAS","shear locking","membrane locking","ABD","composites"], illustrations:"shellElements", sources:[{label:"Chapelle & Bathe, The Finite Element Analysis of Shells — Fundamentals, Springer (2011)", href:"https://doi.org/10.1007/978-3-642-16408-8"},{label:"Bathe & Dvorkin, A four-node plate bending element based on Mindlin/Reissner plate theory and a mixed interpolation, Int. J. Numer. Methods Eng. 21 (1985)", href:"https://doi.org/10.1002/nme.1620210310"},{label:"Belytschko, Liu, Moran & Elkhodary, Nonlinear Finite Elements for Continua and Structures, Wiley (2014)", href:"https://www.wiley.com/en-us/Nonlinear+Finite+Elements+for+Continua+and+Structures%2C+2nd+Edition-p-9781118632703"}]},

  {part:"Part II – Numerical Methods", title:"Truss Elements", equations:[
    {name:"Engineering axial strain", expr:"ε = (ℓ − ℓ₀) / ℓ₀", tex:"\\varepsilon = \\dfrac{\\ell - \\ell_0}{\\ell_0}", note:"Change of length over the reference length. Small-strain linear trusses linearise ℓ about ℓ₀; finite-strain trusses keep the stretch λ = ℓ/ℓ₀ and a work-conjugate stress."},
    {name:"Axial force", expr:"N = EA ε", tex:"N = EA\\,\\varepsilon", note:"Linear elastic bar. Only the axial resultant exists: no shear, no bending moment. Plasticity and cables replace EA ε by a uniaxial constitutive map N(ε) or N(λ)."},
    {name:"Local stiffness (2-node)", expr:"k_loc = (EA/ℓ₀) [1, −1; −1, 1]", tex:"\\mathbf{k}_{\\mathrm{loc}} = \\dfrac{EA}{\\ell_0}\\begin{bmatrix} 1 & -1 \\\\ -1 & 1 \\end{bmatrix}", note:"In the bar axis. Transform by the direction cosines (c, s) to global components: the classic 4×4 (2-D) or 6×6 (3-D) truss matrix is Tᵀ k_loc T."},
    {name:"Geometric stiffness", expr:"k_G ∼ (N/ℓ) [s², −cs; −cs, c²]", tex:"\\mathbf{k}_G \\sim \\dfrac{N}{\\ell}\\begin{bmatrix} s^2 & -cs \\\\ -cs & c^2 \\end{bmatrix}", note:"From the change of direction of the axial force under a lateral perturbation. Tension stiffens transverse motion; compression softens it and supplies the truss-bar route to Euler buckling of a pin-jointed frame."}
  ], bullets:[
    "A truss (or bar) element is the simplest continuum reduction in FEM: a straight member that carries only axial force between two pin joints. Nodal unknowns are translations; there are no rotational degrees of freedom and no bending stiffness. Assemblies of such bars model pin-jointed frames, bracing, space structures, and — with a unilateral constitutive law — cables.",
    "In the linear small-displacement setting the element matrix is EA/ℓ₀ in the local axis, rotated into global coordinates by the direction cosines of the bar. Constant strain along the member is exact for a prismatic linear-elastic bar under end loads; higher-order truss shape functions are rarely needed unless the section or the material varies along the length.",
    "Geometrically nonlinear trusses update the current length and orientation each iteration. The material stiffness from EA (or from a uniaxial hyperelastic/plastic law) is joined by a geometric stiffness that accounts for the rotation of the axial force — the same term that appears in the introductory large-displacement truss example under Continuum Mechanics. A cable is the tension-only special case: N = 0 whenever the bar would go slack.",
    "Trusses are not beams. A beam (Euler–Bernoulli or Timoshenko) adds bending and, usually, shear; connecting beams with moment continuity is a different joint model from a pin. Embedded fibre models in a solid mesh are kin to trusses kinematically (axial strain along a line) but couple to the continuum through slip or perfect bond rather than through shared pin nodes alone.",
    "The figures below are a two-node bar with axial force only, the local-to-global transformation by direction cosines, and tension versus compression geometric stiffness."
  ], tags:["truss","bar","cable","axial","pin-jointed","geometric stiffness","EA/L","large displacement"], illustrations:"trussElements", sources:[{label:"Bathe, Finite Element Procedures, Prentice-Hall (1996)", href:"https://www.worldcat.org/title/finite-element-procedures/oclc/32893840"},{label:"Crisfield, Non-linear Finite Element Analysis of Solids and Structures, Vol. 1, Wiley (1991)", href:"https://www.wiley.com/en-us/Non+linear+Finite+Element+Analysis+of+Solids+and+Structures%2C+Volume+1%3A+Essentials-p-9780471929420"},{label:"Belytschko, Liu, Moran & Elkhodary, Nonlinear Finite Elements for Continua and Structures, Wiley (2014)", href:"https://www.wiley.com/en-us/Nonlinear+Finite+Elements+for+Continua+and+Structures%2C+2nd+Edition-p-9781118632703"}]},

  // NEW: Mesh generation + fitted/embedded + finite cell
  {part:"Part II – Numerical Methods", title:"Mesh Generation & Embedded/Unfitted Methods (FEM/FCM)", bullets:[
    "A body-fitted mesh is still the ordinary route: clean the CAD, set a sizing field, mesh the surface, fill the volume, then improve quality. Delaunay, advancing-front, octree, and hex-dominant algorithms trade robustness against element quality.",
    "Quality is not cosmetic. Aspect ratio, Jacobian, and minimum angle control both the interpolation error and the condition number of the discrete system. Smoothing, edge swaps, and sliver removal are part of the analysis, not a prelude to it.",
    "When the geometry moves, or the CAD is too tangled to mesh, unfitted methods keep a background grid and cut the physical domain out of it. The finite cell method combines a fictitious domain with a high-order basis and adaptive integration on cut cells; CutFEM, XFEM, and immersed-boundary methods are close cousins.",
    "The price of not fitting the mesh is paid in integration, in the conditioning of tiny cut cells, and in how boundary conditions are imposed—by Nitsche, by penalty, or by constraints. Trust still requires a convergence study. High-aspect-ratio fibres are a different unfitted problem: the inclusion is a line on a background solid mesh, with slip on the interface rather than a cut-cell boundary."
  ], tags:["meshing","mesh generation","Delaunay","advancing front","octree","hex-dominant","quality","sizing field","anisotropic","unfitted","embedded","cut cells","CutFEM","XFEM","FCM","finite cell","Nitsche","penalty"]},

  {part:"Part II – Numerical Methods", title:"Shape Functions & Isoparametric Mapping", bullets:[
    "Geometry and unknown fields are interpolated from nodal values with the same shape functions: x(ξ) = Σ N_a(ξ) x_a and u(ξ) = Σ N_a(ξ) a_a. That is the isoparametric construction. Derivatives in physical space come from the chain rule, ∇_x N = J⁻ᵀ ∇_ξ N, with Jacobian J = ∂x/∂ξ of the parent-to-physical map.",
    "Continuity of the interpolation, and the polynomial degree, control both accuracy and locking. A linear tetrahedron and a quadratic hexahedron are not interchangeable approximations of the same continuum problem. Completeness — the ability to represent rigid motion and constant strain — is what the patch test checks.",
    "The parent element is a line, triangle, square, tetrahedron, or cube. Distortion of the physical element degrades the map: a vanishing Jacobian is an illegal mesh, and a large aspect ratio inflates the condition number even when the Jacobian stays positive.",
    "The figure on the left is the parent square in (ξ, η). The same nodal shape functions send it to the warped quadrilateral on the right."
  ], tags:["shape functions","isoparametric","tri","quad","tet","hex"], illustrations:"isoparametric"},
  {part:"Part II – Numerical Methods", title:"p-Version FEM & Lobatto Shape Functions", bullets:[
    "The p-version holds the mesh fixed and raises the polynomial degree of the shape functions. For smooth solutions the error then falls exponentially in p — typically far fewer degrees of freedom than refining an h-mesh at low order. Near singularities an hp strategy restores that exponential rate: geometric refinement at the tip, high order in the smooth remainder.",
    "Hierarchical Lobatto (integrated Legendre) bases are the usual enrichment. Vertex modes ℓ₀ and ℓ₁ are the linear hats; every mode with k ≥ 2 carries the factor (ξ² − 1) and vanishes at the endpoints. On a quadrilateral the 2-D basis is built by tensor products: four vertex modes, four edge modes per new order k, then interior bubbles ℓᵢ(ξ) ℓⱼ(η) with i, j ≥ 2.",
    "Raising p only appends new edge and bubble rows; existing modes are left untouched. Bubbles have support in one element and can be statically condensed before assembly. The same orthogonal construction keeps the element matrices far better conditioned than a monomial or nodal Lagrange basis of equal degree.",
    "Algebraic rates on a sequence of meshes still read ‖u − uʰ‖_{L²} = O(h^{p+1}) and ‖∇(u − uʰ)‖ = O(h^p) when the solution is smooth. The p-version claim is that climbing those steeper families on a coarse mesh often beats refining a linear one. Quadrature must integrate at least degree 2p − 2, or the expected rates silently disappear."
  ], tags:["p-version","hp-FEM","Lobatto","hierarchical","shape functions","spectral","bubble","edge modes","conditioning"], scene:"pVersionFem", sources:[{label:"Šolín, Segeth & Doležel, Higher-Order Finite Element Methods, Chapman & Hall/CRC (2004)", href:"https://www.crcpress.com/Higher-Order-Finite-Element-Methods/Solin-Segeth-Dolezel/p/book/9781584884385"}]},
  {part:"Part II – Numerical Methods", title:"Numerical Integration & Gauss Quadrature", bullets:[
    "Element matrices are integrals of products of shape-function derivatives and constitutive moduli. Those integrals are evaluated by Gauss quadrature on the parent element: ∫ f dV ≈ Σ_q w_q f(ξ_q) det J(ξ_q).",
    "The number of points must be high enough to integrate the chosen polynomial, or deliberately reduced when under-integration is part of the formulation. Full integration of a bilinear quadrilateral uses 2×2 points; reduced integration uses one, and then hourglass control is required.",
    "The locations of the points are not a visualisation. They are the only places the constitutive law is evaluated. A stress contour that is not tied to those points is interpolated, not computed."
  ], tags:["gauss","integration","quadrature"], illustrations:"gaussQuad"},
  {part:"Part II – Numerical Methods", title:"Assembly of the Global Stiffness Matrix", bullets:[
    "Each element contributes a small dense matrix K^e = ∫ Bᵀ ℂ B dV. Assembly scatters those contributions into a global sparse matrix using the map from local to global degrees of freedom: K[I, J] += K^e[i, j] whenever local index i maps to global I.",
    "Boundary conditions are applied to that global system after assembly, or by construction of the constrained space. The sparsity pattern is the connectivity of the mesh; it is also the graph that a fill-reducing ordering will later try to tame.",
    "In a nonlinear analysis the same scatter is done for the residual force and for the consistent tangent, every Newton iteration. Duplicate entries that land on the same (I, J) must be summed, not overwritten."
  ], tags:["assembly","stiffness","global","matrix"]},
  {part:"Part II – Numerical Methods", title:"Boundary Conditions & Loads", bullets:[
    "Essential, or Dirichlet, conditions prescribe the unknown field on part of the boundary: a fixed displacement, a prescribed temperature. They remove degrees of freedom from the algebraic system, or they are imposed weakly by Nitsche or by a penalty.",
    "Natural, or Neumann, conditions appear in the weak form as boundary integrals: a traction, a heat flux. A concentrated force is a distributional special case of the same idea — a Dirac on the boundary, or at a node.",
    "Mixing the two inconsistently — prescribing a displacement and a conjugate traction on the same degree of freedom — is a modelling error, not a solver problem. On a symmetry plane the normal displacement is essential and the shear traction is natural, or the reverse, never both of a conjugate pair."
  ], tags:["boundary","Dirichlet","Neumann","loads"]},
  {part:"Part II – Numerical Methods", title:"Constrained FEM", equations:[
    {name:"Linear constraint", expr:"C u = g", tex:"\\mathbf{C}\\,\\mathbf{u} = \\mathbf{g}", note:"Rows of C pick combinations of degrees of freedom. A single-point Dirichlet is one row with a unit entry; a multi-point tie has two (or more) nonzero entries."},
    {name:"Lagrange saddle point", expr:"[K, Cᵀ; C, 0] [u; λ] = [f; g]", tex:"\\begin{bmatrix} \\mathbf{K} & \\mathbf{C}^{\\mathsf T} \\\\ \\mathbf{C} & \\mathbf{0} \\end{bmatrix}\\begin{bmatrix} \\mathbf{u} \\\\ \\boldsymbol{\\lambda} \\end{bmatrix} = \\begin{bmatrix} \\mathbf{f} \\\\ \\mathbf{g} \\end{bmatrix}", note:"Multipliers λ are the reactions that enforce the constraints. The system is indefinite; a positive-definite solver will not do."},
    {name:"Penalty", expr:"(K + α Cᵀ C) u = f + α Cᵀ g", tex:"(\\mathbf{K} + \\alpha\\,\\mathbf{C}^{\\mathsf T}\\mathbf{C})\\,\\mathbf{u} = \\mathbf{f} + \\alpha\\,\\mathbf{C}^{\\mathsf T}\\mathbf{g}", note:"Large α drives C u toward g without enlarging the unknown set. Conditioning worsens as α grows; the constraint is never exact."},
    {name:"Master–slave", expr:"u_s = T u_m + g̃", tex:"\\mathbf{u}_s = \\mathbf{T}\\,\\mathbf{u}_m + \\tilde{\\mathbf{g}}", note:"Eliminate slaves before the solve. The reduced stiffness is Tᵀ K T on the master set; reactions recover from the discarded rows."}
  ], bullets:[
    "Constrained FEM is the discrete enforcement of linear (or linearized) relations among degrees of freedom. A fixed support, a rigid tie between two nodes, a periodic jump on an RVE, and a mortar continuity condition are the same algebraic object: C u = g. The continuum problem may be unconstrained; the mesh and the boundary data introduce the rows of C.",
    "Three standard realisations compete. Master–slave elimination builds the constrained space explicitly and keeps a smaller positive-definite system when K is SPD. Lagrange multipliers enforce C u = g exactly and return the reactions as λ, at the price of an indefinite saddle-point matrix. Penalty (and its augmented-Lagrangian cousin) stay on the primal unknowns and push the residual of the constraint down with a large weight α.",
    "Over-constraint is the usual failure mode. Two independent rows that ask incompatible things of the same node, or a closed loop of ties that pins a rigid mode twice, make C rank-deficient or inconsistent. Periodic boundary conditions are the textbook example: faces, edges, and vertices each need their own links, but one reference corner must stay free of a master–slave cycle so the lattice can close.",
    "Essential boundary conditions are the one-point special case of the same machinery. Contact, incompressibility, and multi-point continuum constraints (rigid diaphragms, cyclically repeating cells) reuse it. The next entries — solvers for indefinite systems, mixed methods, and contact — are what happens when the constraint set grows or becomes an inequality.",
    "The figures below are a two-node tie, the three algebraic routes, and a periodic face pair as a multi-point constraint with a prescribed jump."
  ], tags:["constraints","MPC","Lagrange","penalty","master-slave","Dirichlet","PBC","tying"], illustrations:"constrainedFem"},
  {part:"Part II – Numerical Methods", title:"Solving Linear Systems", bullets:[
    "After assembly the discrete problem is a linear system, or a sequence of them. Direct factorisation (Cholesky, LU) is robust at moderate size; iterative methods with preconditioning are required when a dense factor will not fit.",
    "The condition number, driven by mesh size, material contrast, and constraints, decides how hard the solve is. A formulation that is correct on paper can still be unsolvable if that number is left unattended. Near incompressibility, thin shells, and contact constraints are the usual offenders.",
    "Symmetric positive-definite systems take conjugate gradients; indefinite mixed systems take MINRES or GMRES with a block preconditioner. A black-box positive-definite solver on a saddle-point matrix will not do."
  ], tags:["solver","iterative","direct","condition number","GPU"]},
  {part:"Part II – Numerical Methods", title:"Mixed Methods and Locking", bullets:[
    "A displacement-only interpolation of an incompressible, or nearly incompressible, solid cannot represent ∇ · u = 0 without locking: the only fields that satisfy the constraint are too poor to represent bending or even uniform compression. The same happens in thin plates with a shear-deformable kinematic, and in Stokes flow.",
    "The remedy is a mixed method. Displacement and pressure are interpolated independently, and the constraint ∇ · u = 0 (or a nearly incompressible volumetric law) is enforced weakly. Inf-sup stable pairs — Taylor–Hood, Q2–P1, Q1–P0 with stabilisation — are the catalogue.",
    "Reduced integration of the volumetric term is a cheaper cousin, and it can introduce hourglass modes that must then be controlled. Locking is a property of the discrete space, not of the mesh size alone. Refining a locking element refines a wrong constraint. Thin shells add a parallel story — shear and membrane locking — treated under Shell Elements."
  ], tags:["locking","mixed","inf-sup","incompressible","hourglass"]},

  // Part III – Advanced FEM Concepts
  {part:"Part III – Advanced FEM Concepts", title:"Nonlinear FEM", bullets:[
    "Three sources of nonlinearity appear in practice: a constitutive law that is not linear in strain, geometry that changes enough to alter equilibrium and stiffness, and contact. They combine. A rubber seal in a groove is all three at once.",
    "The discrete residual R(a) is then a nonlinear function of the nodal unknowns. Each load or time step is a nonlinear solve, and the tangent K_T = ∂R/∂a used in that solve must be consistent with the residual if Newton’s method is to behave.",
    "Path dependence — plasticity, friction, damage — means the residual is not a function of the current unknowns alone. An increment must then carry a constitutive history at every quadrature point, and the tangent is the derivative of that incremental map."
  ], tags:["nonlinear","contact","buckling","plastic"]},
  {part:"Part III – Advanced FEM Concepts", title:"Total and Updated Lagrangian", bullets:[
