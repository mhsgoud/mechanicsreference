  <style>
    :root{
      --paper:#f7f6f2;--ink:#1c2430;--ink-soft:#3d4756;--rule:#d8d4cb;
      --navy:#1e3a5f;--blue:#3a5f8a;--accent:#c45c26;--card:#fff;
      --muted:#5c6574;--danger:#9b2c2c;--danger-bg:#f8e8e4;--danger-border:#e2b8ae;
      --success:#2f6b4f;--success-bg:#e7f2ea;--success-border:#b7d4c3;
      --radius:0;--ease:ease;--transition:0.15s ease;
      --text:var(--ink);--text-body:var(--ink-soft);
      --border:var(--rule);--border-hover:#c9c4b8;--border-strong:#b7b1a4;
      --surface-1:#fff;--surface-2:#f1efe9;--surface-3:#fff;
      --accent-2:var(--navy);--accent-faint:#f3ece6;--accent-soft:#f7efe8;
      --accent-2-dim:#eef2f7;--accent-glow:transparent;--accent-line:var(--rule);
      --accent-mid:var(--blue);--accent-deep:var(--navy);
      --shadow:none;--shadow-soft:none;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    html{color-scheme:light}
    body{
      margin:0;
      font-family:"Source Sans 3", ui-sans-serif, system-ui, sans-serif;
      color:var(--ink);
      background:var(--paper);
    }
    a{color:var(--blue)}
    a:hover{color:var(--accent)}
    .app{
      display:grid;
      grid-template-columns:minmax(260px,300px) 1fr;
      grid-template-rows:auto 1fr;
      grid-template-areas:"header header" "sidebar content";
      height:100vh;
    }
    header{
      grid-area:header;
      position:sticky;top:0;z-index:20;
      background:#fff;
      border-bottom:1px solid var(--rule);
      display:flex;align-items:center;gap:16px;
      padding:12px 28px;
    }
    header .brand{display:flex;align-items:center;text-decoration:none}
    .visually-hidden{
      position:absolute;width:1px;height:1px;padding:0;margin:-1px;
      overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
    }
    .brand-logo{display:block;height:52px;width:auto;max-width:min(240px,46vw);object-fit:contain}
    .top-nav{display:flex;align-items:center;gap:4px;margin-left:8px}
    .top-nav a{
      color:var(--navy);text-decoration:none;font-size:0.92rem;font-weight:600;
      padding:8px 12px;
    }
    .top-nav a.active{box-shadow:inset 0 -2px 0 var(--accent)}
    .search{
      margin-left:auto;display:flex;align-items:center;gap:10px;
      background:#fff;border:1px solid var(--rule);padding:8px 12px;
    }
    .search svg{color:#6b7382;flex-shrink:0}
    .search svg path{fill:currentColor}
    .search:focus-within{border-color:var(--navy)}
    .search input{
      background:transparent;border:none;outline:none;color:var(--ink);
      width:min(260px,42vw);font-family:inherit;font-size:0.95rem;
    }
    .search input::placeholder{color:#8a93ab}

    .sidebar{
      grid-area:sidebar;overflow:auto;scrollbar-gutter:stable;
      border-right:1px solid var(--rule);
      background:#f1efe9;
      padding:18px 12px 28px;
    }
    .part{
      margin:20px 8px 8px;padding:0;
      color:var(--accent);font-size:0.72rem;font-weight:600;
      text-transform:uppercase;letter-spacing:.12em;
    }
    .part:first-child{margin-top:4px}
    .tabs{display:flex;flex-direction:column}
    .tab{
      display:block;width:100%;
      padding:9px 10px 9px 12px;
      border:none;border-left:2px solid transparent;
      cursor:pointer;text-align:left;background:transparent;
      font-family:inherit;font-size:0.92rem;color:var(--navy);
    }
    .tab:hover{background:#e8e4db}
    .tab:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}
    .tab.active{
      background:#fff;
      border-left-color:var(--accent);
      font-weight:600;
    }
    .tab small{color:var(--muted);font-size:0.75rem;line-height:1.35;margin-top:2px;display:block;font-weight:400}

    .content{grid-area:content;overflow:auto;padding:36px 40px 64px}
    .card{
      background:transparent;border:none;padding:0;
      max-width:42rem;margin:0 auto;
    }
    .breadcrumbs{
      display:flex;flex-wrap:wrap;gap:6px;
      font-size:0.88rem;color:var(--muted);margin-bottom:14px;
    }
    .breadcrumbs span::after{content:" · ";color:var(--rule)}
    .breadcrumbs span:last-child{color:var(--ink-soft);font-weight:600}
    .breadcrumbs span:last-child::after{content:none}
    h1{
      margin:0 0 22px;
      font-family:"Source Serif 4", Georgia, serif;
      font-size:clamp(1.7rem, 2.6vw, 2.25rem);
      font-weight:600;letter-spacing:-0.02em;line-height:1.2;color:var(--navy);
    }
    h2{
      margin:1.8em 0 .55em;
      font-family:"Source Serif 4", Georgia, serif;
      font-size:1.2rem;letter-spacing:0;text-transform:none;
      color:var(--navy);font-weight:600;
    }
    .prose p, .card > p, .content p{line-height:1.7;color:var(--ink-soft);margin:0 0 1em}
    .prose p:last-child{margin-bottom:0}
    ul{margin:.35em 0 1em;padding-left:1.2em;color:var(--ink-soft)}
    li{margin:.35em 0}

    .badges,.cta-row,.footer,#test-badge{display:none !important}
    .badge{display:none}

    .card:has(.scene-frame){max-width:52rem}
    .scene-frame{
      display:block;width:100%;height:min(52vh,420px);
      border:1px solid var(--rule);background:#1a2740;margin-top:8px;
    }
    .figure-section{margin-top:2rem;padding-top:1.2rem;border-top:1px solid var(--rule)}
    .figure-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(min(100%, 240px), 1fr));
      gap:16px;margin-top:12px;
    }
    .figure-card{
      margin:0;border:1px solid var(--rule);padding:14px;background:#fff;
    }
    .figure-card figcaption{
      font-size:0.85rem;color:var(--ink-soft);margin-top:10px;line-height:1.5;
    }
    .figure-card .illustration-svg{
      width:100%;height:auto;max-height:200px;display:block;color:var(--navy);
    }
    .figure-card .illustration-svg .ink{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .figure-card .illustration-svg .ink-thick{stroke-width:3.5}
    .figure-card .illustration-svg .muted-line{stroke:var(--muted);stroke-dasharray:5 4;opacity:0.85}
    .figure-card .illustration-svg .fill-soft{fill:#e8e0d4;stroke:none}
    .figure-card .illustration-svg text{
      fill:var(--muted);font-family:"Source Sans 3",system-ui,sans-serif;font-size:11px;font-weight:500;
    }
    .figure-card .illustration-svg .label-strong{fill:var(--navy);font-weight:600}

    .tool{
      margin-top:28px;border:1px solid var(--rule);background:#fff;padding:20px 22px;
    }
    .tool-head{display:flex;align-items:flex-start;gap:14px;justify-content:space-between;flex-wrap:wrap}
    .tool-title{
      font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:1.15rem;color:var(--navy);
    }
    .tool-sub{color:var(--muted);font-size:0.92rem;margin-top:4px;line-height:1.5}
    .seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .chip{
      border:1px solid var(--rule);background:#f7f6f2;color:var(--navy);
      padding:7px 12px;cursor:pointer;font-size:0.85rem;font-family:inherit;font-weight:500;
    }
    .chip:hover{border-color:var(--navy)}
    .chip:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
    .chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
    .panel{border:1px solid var(--rule);background:#f7f6f2;padding:14px 16px}
    .panel h3{
      margin:0 0 10px;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.1em;
      color:var(--accent);font-weight:600;
    }
    .kv{display:flex;flex-wrap:wrap;gap:8px}
    .pill{
      font-size:0.78rem;padding:5px 10px;border:1px solid var(--rule);
      background:#fff;color:var(--ink-soft);
    }
    .warn{border-color:var(--danger-border);background:var(--danger-bg);color:var(--danger)}
    .ok{border-color:var(--success-border);background:var(--success-bg);color:var(--success)}
    .muted{color:var(--muted)}
    .mono{font-family:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;font-size:0.92em}
    .eq-list{display:flex;flex-direction:column;gap:12px;margin:8px 0 24px}
    .eq-card{background:#fff;border:1px solid var(--rule);padding:16px 18px 14px}
    .eq-card h3{margin:0 0 8px;font-family:"Source Serif 4",Georgia,serif;font-size:1.02rem;color:var(--navy)}
    .eq-card .eq{
      font-family:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size:0.95rem;line-height:1.5;color:var(--ink);
      background:#f1efe9;padding:10px 12px;overflow-x:auto;margin:0 0 8px;
    }
    .eq-card p{margin:0;color:var(--muted);font-size:0.92rem;line-height:1.5}

    @media (max-width: 980px){
      .app{grid-template-columns:1fr;grid-template-areas:"header" "content"}
      .sidebar{display:none}
      .grid2{grid-template-columns:1fr}
      .search input{width:min(140px,28vw)}
      .brand-logo{height:44px}
      header,.content{padding-left:18px;padding-right:18px}
    }
  </style>
</head>

  {part:"Part I – Fundamentals of Mechanics", title:"Basic Equations", bullets:[
    "A continuum theory is closed by a short list of field equations. Motion is measured by strain; internal forces by stress. Mass and momentum are conserved, a constitutive model relates stress to deformation, and a weak form of momentum is what a finite element method actually discretizes.",
    "Kinematics: the deformation gradient F = ∂x/∂X maps reference line elements to the current placement. Finite strain uses E = ½(FᵀF − I); small displacement gradients use ε = ½(∇u + (∇u)ᵀ).",
    "Stress: Cauchy traction t = σ n is force per current area. Without couple stresses, angular momentum requires σ = σᵀ.",
    "Balance: local mass conservation is ∂ρ/∂t + ∇·(ρ v) = 0. Linear momentum is ∇·σ + ρ b = ρ a (static: ∇·σ + ρ b = 0).",
    "Constitutive closure for isotropic linear elasticity: σ = λ tr(ε) I + 2μ ε, or σ = ℂ : ε.",
    "Weak form (virtual work): ∫ σ : ∇δu dV = ∫ t · δu dA + ∫ ρ b · δu dV. FEM replaces u and δu with shape functions on a mesh.",
    "Discrete linear elasticity: K a = f after interpolation uʰ = N a and assembly. Nonlinear problems solve R(u) = 0 by Newton–Raphson: K_T Δu = −R(u).",
    "Same momentum balance describes fluids with a different constitutive law. Incompressible Navier–Stokes: ρ(∂v/∂t + v·∇v) = −∇p + μ ∇²v + ρ b with ∇·v = 0."
  ], equations:[
    {name:"Deformation gradient", expr:"F = ∂x / ∂X", note:"Maps a material line element from the reference placement X to the current placement x."},
    {name:"Green–Lagrange strain", expr:"E = ½ (Fᵀ F − I)", note:"Finite strain on the reference configuration; reduces to ε for small displacement gradients."},
    {name:"Infinitesimal strain", expr:"ε = ½ (∇u + (∇u)ᵀ)", note:"Symmetric displacement gradient used in linear solid mechanics and linear FEM."},
    {name:"Cauchy traction", expr:"t = σ n", note:"Force per current area on a surface with outward normal n."},
    {name:"Conservation of mass", expr:"∂ρ/∂t + ∇ · (ρ v) = 0", note:"Local mass balance; incompressibility is ∇ · v = 0."},
    {name:"Linear momentum", expr:"∇ · σ + ρ b = ρ a", note:"Cauchy’s first law. At rest the right-hand side vanishes."},
    {name:"Hooke’s law (isotropic)", expr:"σ = λ tr(ε) I + 2μ ε", note:"Linear isotropic elasticity in Lamé form; equivalently σ = ℂ : ε."},
    {name:"Principle of virtual work", expr:"∫ σ : ∇δu dV = ∫ t · δu dA + ∫ ρ b · δu dV", note:"Weak form of momentum. FEM interpolates u and δu with shape functions."},
    {name:"Discrete linear system", expr:"K a = f", note:"Assembled stiffness times nodal unknowns equals the load vector."},
    {name:"Newton–Raphson", expr:"K_T Δu = −R(u)", note:"Linearization of a nonlinear residual; K_T is the consistent tangent."}
  ], tags:["basic equations","continuum","strain","stress","conservation","Hooke","virtual work","FEM","Newton-Raphson"]},
  {part:"Part I – Fundamentals of Mechanics", title:"Introduction to Continuum Mechanics", bullets:[
    "Two main sources of nonlinearity in solids: material nonlinearity (nonlinear stress–strain laws; contact and friction are often grouped here) and geometric nonlinearity (equilibrium and stiffness depend on the deformed shape, including deformation-dependent boundaries and loads).",
    "Linear continuum models assume deformations are small enough that changes in geometry can be ignored when writing equilibrium and strain; nonlinear models place no such restriction—kinematics, stress, equilibrium, and constitutive laws are the same subjects, but without the small-deformation shortcut.",
    "Nonlinear computational mechanics means formulating those continuous governing equations and then solving them numerically—today almost always with the finite element method: approximate the continuum with nodes and elements, introduce shape functions for geometry and unknown fields, and replace the strong form with a weak integral statement (e.g. principle of virtual work or stationary potential energy).",
    "Discretization yields a finite set of nonlinear algebraic equations in the nodal degrees of freedom (e.g. displacements). These are typically solved with Newton–Raphson iteration, which requires a consistent tangent (Jacobian) of the residual—exactly the matrix structure you build in nonlinear FE codes.",
    "Simple geometrically nonlinear structures: a rigid bar on a torsional spring (cantilever model) gives FL cos θ = Kθ; for small θ, cos θ → 1 and the linear relation F ≈ (K/L)θ is recovered. The full nonlinear path stays physical (e.g. θ remains below π/2 in that idealization).",
    "The same idea vertically (column model) gives PL sin θ = Kθ. Besides the trivial θ = 0 solution, a second branch appears—bifurcation. For small θ, linearization yields (K − PL)θ = 0, giving the elastic critical load P = K/L (Euler-type buckling in a structural analog). In FE, plate and shell buckling often appears as an eigenvalue problem for critical loads and modes.",
    "When bodies deform finitely, strain must be defined carefully. In 1D, common measures include engineering strain (l − L)/L, logarithmic (natural) strain ln(l/L), Green strain (l² − L²)/(2L²), and Almansi strain (l² − L²)/(2l²). Taylor expansion shows that as l → L, all of these reduce to the small-strain increment ∆l/l over the reference length.",
    "A single truss bar under large displacement illustrates the full pipeline: equilibrium at a joint leads to a residual R(x) = 0 that is highly nonlinear in the position x (because bar length and angle depend on x). Constitutive laws written in terms of different strain measures change the force–stretch relation; work-conjugate stress–strain pairs matter for 3D (preview only in Ch. 1, detailed later).",
    "Directional derivatives and linearization of nonlinear equations are the bridge between continuum theory and Newton–Raphson: each iteration solves a linearized problem until the residual vanishes—prototype for every nonlinear FE increment.",
    "The figures below collect the elementary models used to introduce those ideas: a rigid bar on a spring, a column that buckles, one-dimensional strain measures, a truss joint, qualitative equilibrium paths, and a single Newton step.",
    "The account follows Bonet and Wood, Nonlinear Continuum Mechanics for Finite Element Analysis, Chapter 1."
  ], tags:["continuum","material nonlinearity","geometric nonlinearity","FEM","virtual work","Newton-Raphson","tangent","buckling","bifurcation","Green strain","Almansi strain","logarithmic strain","engineering strain","linearization","Bonet-Wood"], illustrations:"introContinuum"},
  {part:"Part I – Fundamentals of Mechanics", title:"Kinematics of Deformation", bullets:[
    "Deformation is a mapping from a reference placement X to the current placement x = χ(X). When displacement gradients are small, the symmetric gradient of the displacement is enough to measure strain.",
    "When they are not, strain is defined from the deformation gradient F = ∂x/∂X, the linear map that sends a material line element dX to dx. Rigid translation never appears in F; rotation, stretch, and shear do.",
    "The right Cauchy–Green tensor C = Fᵀ F and the left Cauchy–Green tensor b = F Fᵀ are stretch without rotation. Their eigenvalues are the squared principal stretches.",
    "The figure runs through those cases on a homogeneous motion. The blue grid is the reference placement; the orange grid is its image. The two arrows are the columns of F: the images of the material unit vectors e₁ and e₂."
  ], tags:["kinematics","deformation","deformation gradient","small strain","large strain","Cauchy-Green"], scene:"deformationGradient"},
  {part:"Part I – Fundamentals of Mechanics", title:"Tensors and the Divergence Theorem", bullets:[
    "Vectors and second-order tensors are the language of the field equations. Components transform when the basis changes; the objects themselves do not. Index notation makes that bookkeeping compact: repeated indices are summed, and a comma denotes a derivative.",
    "The divergence theorem turns a volume integral of a derivative into a surface integral. For the Cauchy stress it reads ∫ ∇·σ dV = ∫ σ n dA, which is why the local momentum equation and the statement of traction on the boundary are the same balance.",
    "Coordinate transformations of a vector use a single rotation matrix; those of a stress or strain use the matrix on both sides. Principal directions are the eigenvectors of that tensor, independent of the basis in which it was first written."
  ], tags:["tensor","index notation","divergence theorem","transformation"]},
  {part:"Part I – Fundamentals of Mechanics", title:"Polar Decomposition", bullets:[
    "Any invertible F factors uniquely as F = R U = V R, with R a rotation and U, V symmetric positive-definite stretches. U stretches in the reference placement, then R rotates; V stretches in the current placement after the same rotation.",
    "Neither order is more physical than the other. Both describe the same final map. Strain measures that are built from U or from C = U² are blind to R, which is the point: a rigid rotation must not look like stretch.",
    "In computation U is the unique positive square root of C. Iterative polar algorithms average a matrix with its inverse-transpose until the result is orthogonal; that limit is R."
  ], tags:["polar decomposition","stretch","rotation","right stretch","left stretch"]},
  {part:"Part I – Fundamentals of Mechanics", title:"Finite Strain Measures", bullets:[
    "Change of squared length is the invariant that strain must capture. Green–Lagrange strain E = ½(C − I) = ½(FᵀF − I) lives on the reference placement. Almansi strain e = ½(I − b⁻¹) lives on the current placement. Both vanish in a rigid motion.",
    "In one dimension the same stretch λ = l/L gives engineering strain λ − 1, Green strain ½(λ² − 1), Almansi ½(1 − 1/λ²), and logarithmic (true) strain ln λ. They agree to first order as λ → 1 and disagree as soon as the stretch is finite.",
    "In terms of displacement, Green strain keeps the quadratic terms in ∇u written with respect to X; Almansi keeps them with respect to x. Dropping those products recovers the infinitesimal strain ε."
  ], tags:["Green-Lagrange","Almansi","logarithmic strain","engineering strain","stretch"]},
  {part:"Part I – Fundamentals of Mechanics", title:"Principal Stretches and Invariants", bullets:[
    "The eigenvalues of U are the principal stretches λᵢ. The invariants of C (or of b) are I₁ = tr C, I₂ = ½[(tr C)² − tr(C²)], I₃ = det C = J². Isotropic hyperelastic laws are functions of those three numbers.",
    "Hydrostatic, or volumetric, strain is the part that changes volume; the deviator is the rest, which changes shape at constant volume. In the small-strain limit the split is ε = (tr ε/3) I + ε′. The same split on stress is the path to von Mises.",
    "A pure rotation leaves every invariant of C equal to that of I. A computation that reports strain after a large rotation but a small stretch has usually used a measure that still contains R."
  ], tags:["invariants","principal stretch","hydrostatic","deviatoric","J"]},
  {part:"Part I – Fundamentals of Mechanics", title:"Velocity Gradient and Material Derivative", bullets:[
    "The spatial velocity gradient is L = ∇v = Ḟ F⁻¹. Its symmetric part D = ½(L + Lᵀ) is the rate of deformation; its skew part W = ½(L − Lᵀ) is the spin. Stretching lives in D; rigid spin lives in W.",
    "From the polar factor, L = R (Ũ U⁻¹) Rᵀ + Ṙ Rᵀ. The second term is pure spin. The first is the stretching, rotated into the current placement.",
    "The material derivative of a spatial field is D(·)/Dt = ∂(·)/∂t + v · ∇(·). It is the rate seen by a particle, not the rate at a fixed point in space. Mass balance and the chain rule for F both use it."
  ], tags:["velocity gradient","rate of deformation","spin","material derivative"]},
  {part:"Part I – Fundamentals of Mechanics", title:"Cauchy Stress and Traction", bullets:[
    "The traction t on a surface with outward unit normal n is force per current area. Cauchy’s theorem says it is linear in n: t = σ n. The tensor σ is the Cauchy stress.",
    "The normal component is n · σ n; the shear component is the remainder, t − (n · σ n) n. Both are scalars or vectors on that cut, not a replacement for the full tensor.",
    "Because t is defined on the current surface, the arrows move when the body deforms. Stresses pulled back to the reference placement are different tensors, used when the weak form is written on the undeformed mesh."
  ], tags:["traction","Cauchy stress","normal stress","shear"]},
  {part:"Part I – Fundamentals of Mechanics", title:"Balance Laws & Conservation", bullets:[
    "Mass, linear momentum, and energy are conserved in every continuum theory. Once a stress and a heat flux are introduced, the local forms of those statements become partial differential equations.",
    "Linear momentum on a deforming body is Cauchy’s first law: ∇ · σ + ρ b = ρ a. Part of the boundary is supported, with prescribed displacement and an unknown reaction. Applied tractions act on the free surface and move with it. The acceleration a is that of the material points.",
    "Angular momentum, in the absence of couple stresses, requires the Cauchy stress to be symmetric. Tractions and body forces are data; they do not replace the balance laws."
  ], tags:["balance","momentum","energy","mass","Cauchy","traction"], scene:"linearMomentum"},
  {part:"Part I – Fundamentals of Mechanics", title:"Constitutive Models", bullets:[
    "Balance laws do not determine the stress. A constitutive model relates stress to the history of deformation: Hooke’s law for small elastic strain, hyperelasticity for finite elastic strain, viscoelasticity when rate matters, and plasticity when unloading leaves a permanent set.",
    "The same momentum equation describes a fluid once Newton’s law of viscosity replaces Hooke’s law. The choice of model is the choice of what the material is allowed to forget."
  ], tags:["elasticity","plasticity","viscoelasticity","hyperelasticity"]},
  {part:"Part I – Fundamentals of Mechanics", title:"Work-Conjugate Stresses", bullets:[
    "Power per reference volume can be written in several equivalent ways. Cauchy stress is conjugate to the rate of deformation D, up to the factor J: τ : D with Kirchhoff stress τ = J σ. The first Piola–Kirchhoff stress P = J σ F⁻ᵀ is conjugate to Ḟ. The second Piola–Kirchhoff stress S = F⁻¹ P is conjugate to Ė.",
    "Those pairings are not a matter of taste. A stored-energy function differentiated with respect to E returns S, not σ. Using Cauchy stress with Green strain, or an unrotated rate of σ with D, produces spurious dissipation in a rigid rotation.",
    "When stretches and rotations are both small, P, S, and σ coincide to first order. The distinction matters as soon as either is finite."
  ], tags:["Piola-Kirchhoff","Kirchhoff stress","work conjugate","energy"]},
  {part:"Part I – Fundamentals of Mechanics", title:"Principal Stresses and von Mises", bullets:[
    "The principal stresses are the eigenvalues of σ. The hydrostatic part is the mean (tr σ)/3; the deviator is σ′ = σ − (tr σ/3) I. Plasticity in metals is, to a first approximation, independent of the hydrostatic part.",
    "The von Mises equivalent stress is √(3/2 σ′ : σ′), the magnitude of the deviator scaled so that it equals |σ| in uniaxial tension. In principal-stress space the yield condition σ_vm = σ_y is a cylinder along the hydrostatic axis.",
    "The same split on strain separates change of volume from change of shape. In isotropic linear elasticity the deviators are related by ε′ = σ′ / (2G) and the spherical parts by the bulk modulus."
  ], tags:["principal stress","von Mises","deviatoric","hydrostatic","yield"]},
  {part:"Part I – Fundamentals of Mechanics", title:"Objective Rates", bullets:[
    "A constitutive law written in rate form must not invent stress when the body only rotates. The material derivative of Cauchy stress does invent such a stress, because the components change with the spinning basis.",
    "An objective rate subtracts that spin. The Jaumann rate uses W from the velocity gradient; Green–Naghdi uses Ṙ Rᵀ from the polar rotation. They agree at small stretch and differ in large shear.",
    "Alternatively one works with S and E, which live on the reference placement and need no spatial rate. That is why many finite-strain elasticities are written there and pushed forward only for output."
  ], tags:["Jaumann","Green-Naghdi","objectivity","corotational"]},
  {part:"Part I – Fundamentals of Mechanics", title:"Hooke’s Law", bullets:[
    "Isotropic linear elasticity is σ = λ (tr ε) I + 2μ ε, or equivalently ε = [(1+ν)/E] σ − (ν/E) (tr σ) I. The constants are not independent: μ = E / (2(1+ν)), and 3λ + 2μ is the bulk modulus.",
    "Poisson’s ratio is the lateral contraction in uniaxial tension. It approaches ½ for incompressibility; the bulk modulus then diverges and displacement-only elements lock. Anisotropy replaces the two constants by a stiffness tensor ℂ with the usual minor and major symmetries.",
    "The law is the first-order expansion of any hyperelastic stored energy. It remains useful for metals below yield and for rubber only while the stretches stay close to one. Large rotation still requires a conjugate pair, even when the stretch is small."
  ], tags:["Hooke","Lamé","Young","Poisson","isotropic"]},
  {part:"Part I – Fundamentals of Mechanics", title:"Hyperelasticity", bullets:[
    "A hyperelastic solid stores energy in the stretch. The second Piola–Kirchhoff stress is the derivative of the strain-energy density W with respect to Green strain, S = ∂W/∂E. In principal stretches, the Cauchy stresses satisfy σᵢ = λᵢ ∂W/∂λᵢ when W is written per reference volume and the axes are principal.",
    "Isotropic W depends on the invariants of C, or on λ₁, λ₂, λ₃. Neo-Hooke uses only I₁; Mooney–Rivlin adds I₂. Incompressibility enforces J = 1 with a pressure that is a Lagrange multiplier, not a constitutive output.",
    "The tangent needed by Newton’s method is the second derivative of W, pushed forward to the current placement. An energy that is not polyconvex can lose ellipticity; the discrete problem then has no unique minimiser."
  ], tags:["hyperelasticity","neo-Hooke","Mooney-Rivlin","strain energy","incompressibility"]},
  {part:"Part I – Fundamentals of Mechanics", title:"Metal Plasticity", bullets:[
    "Below a yield stress the response is elastic. Beyond it, metals flow at nearly constant volume. The elastic strain is recoverable; the plastic strain is a history, not a state derived from the current stretch alone.",
    "J₂ plasticity yields when the von Mises stress reaches σ_y. The flow direction is the normal to that surface—associated flow. Isotropic hardening expands the cylinder; kinematic hardening translates it (the Bauschinger effect) by a backstress α.",
    "In three dimensions the additive split ε = εᵉ + εᵖ is the small-strain statement; finite strain uses a multiplicative split F = Fᵉ Fᵖ. The return map at each quadrature point is itself a small Newton problem."
  ], tags:["plasticity","J2","yield","hardening","Bauschinger","return map"]},
  {part:"Part I – Fundamentals of Mechanics", title:"Fluids: Continuity and Navier–Stokes", bullets:[
    "Mass balance is the continuity equation ∂ρ/∂t + ∇·(ρ v) = 0. For a constant density it is ∇·v = 0, which is a constraint on the velocity, not an evolution for ρ.",
    "Newton’s law of viscosity, σ = −p I + 2μ D for an incompressible fluid, turns Cauchy’s first law into Navier–Stokes: ρ(∂v/∂t + v·∇v) = −∇p + μ ∇²v + ρ b, together with ∇·v = 0.",
    "The pressure is the Lagrange multiplier for incompressibility, analogous to the pressure in an incompressible solid. Mixed velocity–pressure elements, or a slightly compressible regularisation, are the discrete counterpart of the mixed u–p pairs used in rubber."
  ], tags:["Navier-Stokes","continuity","viscosity","incompressible"]},
  {part:"Part I – Fundamentals of Mechanics", title:"Thermodynamics of Continua", bullets:[
    "The first law balances internal energy with mechanical power and heat. In local form it introduces the heat flux q and a temperature θ. Fourier’s law q = −k ∇θ is the usual constitutive closure for conduction.",
    "The second law, in the Clausius–Duhem form, restricts what a constitutive model may do. A hyperelastic W that depends only on C automatically satisfies it in an isothermal setting; a viscous or plastic model must dissipate.",
    "Thermal expansion couples the heat equation to momentum: strain contains a term α (θ − θ₀) I, and plastic work may heat the body. A staggered split is often enough; a monolithic coupling is needed when the time scales meet."
  ], tags:["thermodynamics","Clausius-Duhem","Fourier","dissipation"]},

  // Part II – Numerical Methods
  {part:"Part II – Numerical Methods", title:"Finite Element Method (Introduction)", bullets:[
    "The finite element method replaces a field problem with a finite system of equations. Trial and test functions are built from shape functions on a mesh, and the strong form of the balance laws is replaced by a weak statement such as virtual work.",
    "After assembly, the unknown nodal coefficients satisfy a discrete system whose size is the number of unconstrained degrees of freedom. Accuracy then depends on the element, the mesh, and the boundary conditions, not only on the continuum theory."
  ], tags:["FEM","weak form","discretization","elements"]},

  // Interactive element chooser topic
  {part:"Part II – Numerical Methods", title:"Element Types & Families (Chooser)", interactive:"elementChooser", bullets:[
    "Not every element is safe for every problem. Low-order displacement elements lock in thin bending and near incompressibility; reduced integration can introduce hourglass modes; wave problems are limited by numerical dispersion.",
    "The families in common use—C0 Lagrangian elements, high-order and spectral bases, mixed displacement–pressure pairs, discontinuous Galerkin, and virtual elements—exist because each of those failure modes has a standard remedy. Choose a setting below to see which families are appropriate."
  ], tags:["element types","Lagrangian","h-version","p-version","hp-FEM","spectral","mixed","DG","VEM","locking","hourglassing","dispersion"]},

  // NEW: Mesh generation + fitted/embedded + finite cell
  {part:"Part II – Numerical Methods", title:"Mesh Generation & Embedded/Unfitted Methods (FEM/FCM)", bullets:[
    "A body-fitted mesh is still the ordinary route: clean the CAD, set a sizing field, mesh the surface, fill the volume, then improve quality. Delaunay, advancing-front, octree, and hex-dominant algorithms trade robustness against element quality.",
    "Quality is not cosmetic. Aspect ratio, Jacobian, and minimum angle control both the interpolation error and the condition number of the discrete system. Smoothing, edge swaps, and sliver removal are part of the analysis, not a prelude to it.",
    "When the geometry moves, or the CAD is too tangled to mesh, unfitted methods keep a background grid and cut the physical domain out of it. The finite cell method combines a fictitious domain with a high-order basis and adaptive integration on cut cells; CutFEM, XFEM, and immersed-boundary methods are close cousins.",
    "The price of not fitting the mesh is paid in integration, in the conditioning of tiny cut cells, and in how boundary conditions are imposed—by Nitsche, by penalty, or by constraints. Trust still requires a convergence study."
  ], tags:["meshing","mesh generation","Delaunay","advancing front","octree","hex-dominant","quality","sizing field","anisotropic","unfitted","embedded","cut cells","CutFEM","XFEM","FCM","finite cell","Nitsche","penalty"]},

  {part:"Part II – Numerical Methods", title:"Shape Functions & Isoparametric Mapping", bullets:[
    "Geometry and unknown fields are interpolated from nodal values with shape functions. In the isoparametric construction, the same functions map a parent element—a line, triangle, square, tetrahedron, or cube—onto the element in physical space.",
    "Continuity of the interpolation, and the polynomial degree, control both accuracy and locking. A linear tetrahedron and a quadratic hexahedron are not interchangeable approximations of the same continuum problem."
  ], tags:["shape functions","isoparametric","tri","quad","tet","hex"]},
  {part:"Part II – Numerical Methods", title:"Numerical Integration & Gauss Quadrature", bullets:[
    "Element matrices are integrals of products of shape-function derivatives and constitutive moduli. Those integrals are evaluated by Gauss quadrature on the parent element.",
    "The number of points must be high enough to integrate the chosen polynomial, or deliberately reduced when under-integration is part of the formulation. The locations of the points are not a visualisation; they are the only places the constitutive law is evaluated."
  ], tags:["gauss","integration","quadrature"]},
  {part:"Part II – Numerical Methods", title:"Assembly of the Global Stiffness Matrix", bullets:[
    "Each element contributes a small dense matrix. Assembly scatters those contributions into a global sparse matrix using the map from local to global degrees of freedom.",
    "Boundary conditions are applied to that global system. The sparsity pattern is the connectivity of the mesh; it is also the graph that a fill-reducing ordering will later try to tame."
  ], tags:["assembly","stiffness","global","matrix"]},
  {part:"Part II – Numerical Methods", title:"Boundary Conditions & Loads", bullets:[
    "Essential, or Dirichlet, conditions prescribe the unknown field on part of the boundary: a fixed displacement, a prescribed temperature. Natural, or Neumann, conditions appear in the weak form as boundary integrals: a traction, a heat flux.",
    "A concentrated force is a distributional special case of the same idea. Mixing the two inconsistently—prescribing a displacement and a conjugate traction on the same degree of freedom—is a modelling error, not a solver problem."
  ], tags:["boundary","Dirichlet","Neumann","loads"]},
  {part:"Part II – Numerical Methods", title:"Solving Linear Systems", bullets:[
    "After assembly the discrete problem is a linear system, or a sequence of them. Direct factorisation is robust at moderate size; iterative methods with preconditioning are required when a dense factor will not fit.",
    "The condition number, driven by mesh size, material contrast, and constraints, decides how hard the solve is. A formulation that is correct on paper can still be unsolvable if that number is left unattended."
  ], tags:["solver","iterative","direct","condition number","GPU"]},

  // Part III – Advanced FEM Concepts
  {part:"Part III – Advanced FEM Concepts", title:"Nonlinear FEM", bullets:[
    "Three sources of nonlinearity appear in practice: a constitutive law that is not linear in strain, geometry that changes enough to alter equilibrium and stiffness, and contact.",
    "The discrete residual is then a nonlinear function of the nodal unknowns. Each load or time step is a nonlinear solve, and the tangent used in that solve must be consistent with the residual if Newton’s method is to behave."
  ], tags:["nonlinear","contact","buckling","plastic"]},
  {part:"Part III – Advanced FEM Concepts", title:"Column Buckling", bullets:[
    "A compressed member can lose uniqueness of the trivial straight solution. Linearisation about that solution is an eigenvalue problem for the critical load and the buckling mode. Euler’s formula is the uniform-hinged case.",
    "Geometric stiffness from the pre-stress, not a change in the constitutive law, is what makes the tangent singular. Eccentricity and initial imperfection turn the bifurcation into a smooth limit point; the load–shortening curve then has to be followed, not just eigen-solved.",
    "In shells and plates the same structure appears as many closely spaced eigenvalues. A linear buckling load is a warning, not a capacity, once plasticity or large rotation enters."
  ], tags:["buckling","Euler","eigenvalue","geometric stiffness"]},
  {part:"Part III – Advanced FEM Concepts", title:"Newton–Raphson Iteration in FEM", bullets:[
    "Newton–Raphson linearises the residual at the current guess and solves for a correction. The coefficient matrix is the consistent tangent: the derivative of internal force with respect to the unknowns.",
    "Near the root the convergence is quadratic when that tangent is exact. Line search and arc-length methods keep the iteration from stalling at snap-through and limit points, where the tangent itself becomes singular."
  ], tags:["Newton-Raphson","linearization","tangent stiffness"]},
  {part:"Part III – Advanced FEM Concepts", title:"Static Condensation & Schur Complement", bullets:[
    "Internal degrees of freedom that do not couple to neighbouring elements can be eliminated at the element level. The resulting Schur complement is the stiffness seen by the retained unknowns.",
    "The same block elimination appears in domain decomposition, mixed methods, and the condensation of hierarchical bases. It reduces the global system; it does not change the underlying approximation."
  ], tags:["Schur","condensation","hierarchical","GPU"]},
  {part:"Part III – Advanced FEM Concepts", title:"Time-Dependent Problems", bullets:[
    "When inertia or rate-dependent constitutive response matters, the discrete system is a set of ordinary differential equations in time. Implicit integrators solve a coupled system at each step; explicit integrators update from the previous step and are limited by a CFL condition.",
    "Wave propagation and crash analysis often take the explicit route with a lumped mass. Quasi-static evolution, implicit dynamics, and viscoelasticity usually do not."
  ], tags:["dynamics","implicit","explicit","wave","crash"]},

  // Part IV – Applications in Engineering
  {part:"Part IV – Applications in Engineering", title:"Fracture Mechanics", bullets:[
    "A crack concentrates stress. Linear elastic fracture mechanics characterises the tip field by stress intensity factors; Griffith’s energy argument relates the advance of the crack to the release of potential energy.",
    "Nonlinear and cohesive models are used when the process zone is not small compared with the body. Numerically, the crack may be fitted, enriched (XFEM), or represented by a damage field; each choice changes what the mesh is required to resolve."
  ], tags:["fracture","SIF","Griffith","crack"]},
  {part:"Part IV – Applications in Engineering", title:"Composite Materials – Effective Properties", bullets:[
    "A composite is a continuum at the scale of a structure and a microstructure at the scale of fibres or grains. Effective stiffness is estimated by rules of mixtures, by bounds, or by homogenisation of a representative volume.",
    "Those effective properties are what a macroscopic finite element analysis actually uses. The quality of the estimate is the quality of the scale separation assumed in making it."
  ], tags:["composites","homogenization","rule of mixtures"]},
  {part:"Part IV – Applications in Engineering", title:"Composite Materials – Failure Modes", bullets:[
    "Failure is rarely a single event. Fibres break, the matrix cracks, and plies separate. Each mode has its own criterion, and the sequence depends on stacking sequence, notches, and the loading path.",
    "Continuum damage and cohesive interfaces are the usual numerical representations. A single equivalent-stress criterion on a homogenised ply is often too coarse to see delamination coming."
  ], tags:["failure","delamination","matrix","fiber"]},
  {part:"Part IV – Applications in Engineering", title:"Soil & Geomechanics: Consolidation Theory", bullets:[
    "Terzaghi’s consolidation theory couples the flow of pore fluid to the deformation of the soil skeleton. Settlement in time is the visible consequence: excess pore pressure dissipates, effective stress rises, and the soil compresses.",
    "Finite element analyses of the same physics use coupled displacement–pressure formulations. Drainage boundaries and the permeability of the skeleton are as important as the stiffness of the grains."
  ], tags:["consolidation","Terzaghi","settlement","soil"]},
  {part:"Part IV – Applications in Engineering", title:"Heat Transfer & Multiphysics FEM", bullets:[
    "Temperature changes strain through thermal expansion, and deformation can generate heat. A thermo-mechanical analysis therefore solves a heat equation together with momentum balance, with constitutive laws that may themselves depend on temperature.",
    "The coupling may be staggered or monolithic. Strong coupling and disparate time scales are what make multiphysics harder than the sum of its parts."
  ], tags:["heat","multiphysics","thermo-mechanical"]},
  {part:"Part IV – Applications in Engineering", title:"Battery Mechanics – Structural Aspects", bullets:[
    "A cell is a mechanical object: electrodes swell, the separator is thin, and the casing carries constraint. Stresses from intercalation, thermal expansion, and abuse loading affect both performance and safety.",
    "Structural models of modules and packs sit on top of those local mechanisms. The casing that looks like a boundary condition to the cell is a deformable body to the pack."
  ], tags:["battery","mechanics","safety"]},
  {part:"Part IV – Applications in Engineering", title:"Battery FEM – Coupled Electro-Chemo-Mechanics", bullets:[
    "Inside a lithium-ion cell, electrochemistry, diffusion, heat, and stress interact. A coupled electro-chemo-mechanical model tracks lithium concentration, electric potential, temperature, and deformation together.",
    "The numerical difficulty is the disparity of time scales and the sensitivity of the chemistry to mechanical constraint. A purely thermal or purely structural model will miss the mechanisms that actually limit the cell."
  ], tags:["battery","FEM","electro-chemo-mechanics"]},

  // Part V – High-Performance Computing
  {part:"Part V – High-Performance Computing", title:"GPU Programming for Engineers", bullets:[
    "Graphics processors execute many identical arithmetic operations at once. In mechanics that maps onto assembly of independent elements, sparse matrix–vector products, and explicit updates.",
    "CUDA is the usual programming model. The engineering question is which parts of a finite element code are worth moving, and which remain latency-bound on the host."
  ], tags:["GPU","CUDA","parallelism"]},
  {part:"Part V – High-Performance Computing", title:"Sparse Linear Algebra on GPUs", bullets:[
    "Sparse kernels, not dense matrix multiplication, dominate implicit finite element analysis on a GPU. Libraries such as cuSPARSE implement sparse matrix–vector products and sparse triangular solves.",
    "Performance depends on the storage format and on how regular the mesh connectivity is. A well-tuned CPU factorisation can still win on problems of moderate size."
  ], tags:["cuBLAS","cuSPARSE","SpMM","sparse"]},
  {part:"Part V – High-Performance Computing", title:"Performance Comparison: CPU vs GPU in FEM", bullets:[
    "Whether a GPU is faster depends on the operation, the matrix size, and the cost of moving data. Explicit dynamics and large iterative solves tend to favour the device; small, poorly parallel factorisations do not.",
    "A useful benchmark reports the whole analysis, including assembly and input, not only the kernel that looks best on a slide."
  ], tags:["benchmark","scalability","CPU vs GPU"]},
  {part:"Part V – High-Performance Computing", title:"Future of FEM: Multiscale & Multiphysics", bullets:[
    "Multiscale methods pass information between a macroscopic mesh and a representative volume. Multiphysics methods couple several fields on the same, or overlapping, meshes.",
    "Learned surrogates are being used to replace expensive constitutive evaluations. They remain useful only while they respect conservation and dissipation, which a generic interpolant will not do on its own."
  ], tags:["multiscale","RVE","ML","accelerators"]},

  // Part VI – Linear Algebra & Tools
  {part:"Part VI – Linear Algebra & Tools", title:"Matrix Fundamentals (Dense & Sparse)", bullets:[
    "Finite element systems are linear algebra. Dense factorisations—LU, Cholesky, QR, SVD—explain the structure of the solve; sparse storage explains why a three-dimensional mesh of any size is even tractable.",
    "Layout in memory, row-major or column-major, blocked or not, decides whether the arithmetic meets the cache. The algorithm that looks shortest on paper is not always the one that runs."
  ], tags:["dense","sparse","factorization","layout"]},
  {part:"Part VI – Linear Algebra & Tools", title:"Sparse Formats & Performance", bullets:[
    "Coordinate lists are convenient for assembly. Compressed sparse row is the usual format for a matrix–vector product; compressed sparse column favours column-oriented factorisation.",
    "Block formats pay when degrees of freedom cluster, as they do in vector problems. The right choice is the one that matches the kernel that is called most often."
  ], tags:["CSR","CSC","COO","BSR","HYB"]},
  {part:"Part VI – Linear Algebra & Tools", title:"CPU Linear Algebra Libraries", bullets:[
    "BLAS and LAPACK are the substrate. Eigen, Intel MKL, and OpenBLAS are the practical interfaces, with threading through OpenMP or TBB and vectorisation through AVX.",
    "A finite element code that calls these well will outperform one that writes its own inner loops. Most of the arithmetic in an implicit analysis never touches an element routine."
  ], tags:["BLAS","LAPACK","MKL","Eigen","OpenBLAS"]},
  {part:"Part VI – Linear Algebra & Tools", title:"GPU Linear Algebra Libraries", bullets:[
    "cuBLAS, cuSPARSE, cuSOLVER, and MAGMA provide dense and sparse kernels on the device, including batched operations for many small systems.",
    "Preconditioners are the weaker part of the stack. An algebraic multigrid cycle that is excellent on a CPU may be memory-bound, or awkward to implement, on a GPU."
  ], tags:["cuBLAS","cuSPARSE","cuSOLVER","MAGMA","SpMM"]},
  {part:"Part VI – Linear Algebra & Tools", title:"Solvers & Preconditioning", bullets:[
    "Direct solvers factor the matrix once and are insensitive to conditioning within the limits of roundoff. Krylov methods—conjugate gradients, GMRES, BiCGStab—iterate, and they need a preconditioner whose quality decides the iteration count.",
    "Jacobi, incomplete factorisations, and algebraic multigrid are the usual choices. Indefinite and constrained systems need methods that respect the block structure; a black-box positive-definite solver will not."
  ], tags:["CG","GMRES","ILU","AMG","preconditioner"]},
  {part:"Part VI – Linear Algebra & Tools", title:"Matrix Assembly & Graph Reordering", bullets:[
    "Assembly builds a sparse matrix from element contributions, typically through a triplet list that is then converted to compressed sparse row. Duplicate entries must be summed, not overwritten.",
    "Fill-reducing orderings—reverse Cuthill–McKee, approximate minimum degree, nested dissection—are applied before factorisation so that the factor remains sparse. The ordering that is cheap to compute is not always the one that minimises fill."
  ], tags:["assembly","CSR","RCM","AMD","METIS"]},
  {part:"Part VI – Linear Algebra & Tools", title:"MATLAB-like Basics for FEM", bullets:[
    "Most finite element prototypes are written in array notation: index, slice, and vectorise rather than loop over degrees of freedom by hand. Sparse diagonal constructors and Kronecker products build discrete operators compactly.",
    "The same habits transfer to NumPy, with different indexing conventions. Clarity in the residual is worth more than a clever one-liner when the tangent has to be derived from it."
  ], tags:["MATLAB","vectorization","sparse","spdiags","kron"]},
  {part:"Part VI – Linear Algebra & Tools", title:"Plotting & Postprocessing (MATLAB/Python)", bullets:[
    "Postprocessing is part of the analysis: deformed shapes, contours of stress, and residual histories on a logarithmic axis. Matplotlib and PGFPlots are enough for publication figures.",
    "Specialised viewers take over when the mesh is large. A contour that is not tied to the quadrature points at which the stress was computed is a picture, not a result."
  ], tags:["plot","matplotlib","pgfplots","contour"]},
  {part:"Part VI – Linear Algebra & Tools", title:"NumPy/SciPy Equivalents", bullets:[
    "SciPy’s sparse matrices and sparse solvers are the Python equivalent of MATLAB’s sparse suite. Direct sparse solves, conjugate gradients, and GMRES cover the usual cases.",
    "Automatic differentiation through PyTorch or JAX is useful when a residual is easier to write than a tangent. The resulting Jacobian is only as correct as the residual it differentiates."
  ], tags:["NumPy","SciPy","csr_matrix","autograd"]},
  {part:"Part VI – Linear Algebra & Tools", title:"Benchmarking & Profiling", bullets:[
    "Wall-clock time, not a flop count, is what decides whether an analysis is usable. Roofline analysis says whether a kernel is limited by arithmetic or by memory bandwidth.",
    "Profilers show where the time actually goes. An unreproducible timing is not a measurement, and a kernel benchmark is not a model of the whole code."
  ], tags:["profiling","nsys","nvprof","roofline","benchmark"]},
  {part:"Part VI – Linear Algebra & Tools", title:"I/O & Interchange Formats", bullets:[
    "Meshes, matrices, and results move between codes through formats such as Matrix Market, HDF5, and VTK. Text is portable and slow; binary is the reverse.",
    "A pipeline that cannot write a mesh the visualiser can read is not finished. The same is true of a solver that cannot reread its own checkpoint."
  ], tags:["MatrixMarket","HDF5","VTK","I/O"]}
];

// ---- Helpers --------------------------------------------------------------
const groupBy = (arr, key) => arr.reduce((acc, x) => ((acc[x[key]] ??= []).push(x), acc), {});
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');

function escHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

// ---- Render sidebar -------------------------------------------------------
const sidebar = document.getElementById('sidebar');
function renderSidebar(filter=""){
  sidebar.innerHTML = '';
  let totalMatches = 0;
  const grouped = groupBy(topics, 'part');
  Object.entries(grouped).forEach(([part, items]) => {
    const visible = items.filter(t =>
      (t.title+" "+t.bullets.join(" ")+" "+(t.tags||[]).join(" "))
        .toLowerCase().includes(filter.toLowerCase())
    );
    if(visible.length === 0) return;
    totalMatches += visible.length;

    const partEl = document.createElement('div');
    partEl.className = 'part';
    partEl.textContent = part;
    sidebar.appendChild(partEl);

    const list = document.createElement('div');
    list.className = 'tabs';
    visible.forEach(t => {
      const b = document.createElement('button');
      b.className = 'tab';
      b.id = 'tab-' + slug(t.title);
      b.setAttribute('data-slug', slug(t.title));
      b.innerHTML = `<div><div>${escHtml(t.title)}</div><small>${escHtml((t.tags||[]).slice(0,3).join(' · '))}</small></div>`;
      b.addEventListener('click', () => selectTopic(t.title));
      list.appendChild(b);
    });
    sidebar.appendChild(list);
  });

  if(totalMatches === 0){
    const empty = document.createElement('div');
    empty.style.color = 'var(--muted)';
    empty.style.padding = '8px 10px';
    empty.textContent = 'No results. Try different keywords.';
    sidebar.appendChild(empty);
  }
}

// ---- Interactive widget renderers ----------------------------------------
function renderElementChooserWidget(){
  const defaultId = "solids";
  const toolId = "element-tool";
  const pickId = "element-pick";

  const chips = elementChooser.problems.map(p =>
    `<button class="chip ${p.id===defaultId?'active':''}" data-problem="${p.id}" type="button">${escHtml(p.label)}</button>`
  ).join("");

  return `
    <div class="tool" id="${toolId}">
      <div class="tool-head">
        <div>
          <div class="tool-title">Element families</div>
          <div class="tool-sub">Recommended interpolations depend on the problem. Choose a setting.</div>
        </div>
        <div class="tool-sub muted">Near incompressibility, waves, and unfitted geometry are the cases that most often punish a default solid element.</div>
      </div>

      <div class="seg" role="tablist" aria-label="Problem type">
        ${chips}
      </div>

      <div class="grid2" id="${pickId}">
        <!-- filled by JS -->
      </div>
    </div>
  `;
}

function mountElementChooser(){
  const host = document.getElementById('element-pick');
  const tool = document.getElementById('element-tool');
  if(!host || !tool) return;

  function render(problemId){
    const rule = elementChooser.rules[problemId] || elementChooser.rules.solids;
    const rec = rule.recommend.map(x=>`<li>${escHtml(x)}</li>`).join("");
    const avoid = rule.avoid.map(x=>`<li>${escHtml(x)}</li>`).join("");
    const modes = (rule.modes||[]).map(m=>{
      const key = String(m);
      const help = elementChooser.failureModeHelp[key] || "";
      const cls = /locking|hourglass|instability|dispersion|spurious/i.test(key) ? "warn" : "";
      const title = help ? ` title="${escHtml(help)}"` : "";
      return `<span class="pill ${cls}"${title}>${escHtml(key)}</span>`;
    }).join("");

    const note = rule.notes ? `<p class="muted" style="margin:.4em 0 0 0">${escHtml(rule.notes)}</p>` : "";

    host.innerHTML = `
      <div class="panel">
        <h3>Recommended</h3>
        <ul>${rec}</ul>
        ${note}
      </div>
      <div class="panel">
        <h3>Failure modes</h3>
        <ul>${avoid}</ul>
        <div class="kv" style="margin-top:10px">
          ${modes}
        </div>
      </div>
    `;
  }

  render("solids");

  tool.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      tool.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      btn.classList.add('active');
      render(btn.getAttribute('data-problem'));
    });
  });
}

function renderContent(topic){
  const prose = (topic.bullets||[]).map(x => `<p>${escHtml(x)}</p>`).join('');

  const interactiveBlock =
    topic.interactive === "elementChooser"
      ? renderElementChooserWidget()
      : "";

  const illustrationsBlock = renderTopicIllustrations(topic);
  const sceneBlock = renderTopicScene(topic);

  const eqBlock = (topic.equations && topic.equations.length)
    ? `<h2>Field equations</h2>
      <div class="eq-list">${topic.equations.map(eq => `
        <article class="eq-card">
          <h3>${escHtml(eq.name)}</h3>
          <div class="eq">${escHtml(eq.expr)}</div>
          <p>${escHtml(eq.note)}</p>
        </article>`).join('')}</div>`
    : "";

  content.innerHTML = `
    <article class="card">
      <div class="breadcrumbs"><span>${escHtml(topic.part)}</span><span>${escHtml(topic.title)}</span></div>
      <h1>${escHtml(topic.title)}</h1>
      ${eqBlock}
      <div class="prose">${prose}</div>
      ${sceneBlock}
      ${illustrationsBlock}
      ${interactiveBlock}
    </article>
  `;

  // Update active state
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  const active = document.querySelector(`#tab-${slug(topic.title)}`);
  if(active) active.classList.add('active');

  // Mount interactive widgets AFTER DOM update
  if(topic.interactive === "elementChooser"){
    mountElementChooser();
  }
}

// ---- Selection + deep-linking --------------------------------------------
function selectTopic(title){
  const t = topics.find(x => x.title === title);
  if(!t) return;
  renderContent(t);
  const h = '#'+slug(t.title);
  if(location.hash !== h){ history.replaceState(null,'',h); }
  document.title = t.title + ' | Mechanics Reference';
  const desc = document.querySelector('meta[name="description"]');
  if(desc && t.bullets && t.bullets[0]){
    const summary = String(t.bullets[0]).replace(/\s+/g,' ').slice(0, 155);
    desc.setAttribute('content', summary + (t.bullets[0].length > 155 ? '…' : ''));
  }
  content.focus({preventScroll:false});
}

function initFromHash(){
  const h = location.hash.replace('#','');
  const byHash = topics.find(t => slug(t.title) === h);
  return byHash || topics.find(t => t.title === "Introduction to Continuum Mechanics") || topics[0];
}

// ---- Search ---------------------------------------------------------------
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', (e)=>{
  const q = e.target.value || '';
  renderSidebar(q);
});

// ---- Keyboard navigation --------------------------------------------------
window.addEventListener('keydown', (e)=>{
  if(e.ctrlKey && e.key.toLowerCase() === 'k'){
    e.preventDefault();searchInput.focus();
  }
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    const tabs = Array.from(document.querySelectorAll('.tab'));
    if(tabs.length === 0) return;
    const activeIndex = tabs.findIndex(t=>t.classList.contains('active'));
    const target = (activeIndex === -1)
      ? 0
      : (e.key==='ArrowDown' ? Math.min(tabs.length-1, activeIndex+1) : Math.max(0, activeIndex-1));
    tabs[target].click();
    tabs[target].scrollIntoView({block:'nearest'});
  }
});

// ---- Tiny test harness ----------------------------------------------------
(function runSelfTests(){
  const badge = document.getElementById('test-badge');
  const results = [];
  function ok(name, cond){
    const pass = !!cond; results.push({name, pass});
    console[pass? 'log' : 'error'](`${pass? 'PASS':'FAIL'}: ${name}`);
    return pass;
  }
  try{
    ok('topics is an array with items', Array.isArray(topics) && topics.length > 0);
    ok('each topic has part/title/bullets', topics.every(t => t && t.part && t.title && Array.isArray(t.bullets)));
    ok('element chooser topic exists', topics.some(t => t.interactive === 'elementChooser'));
    ok('mesh generation topic exists', topics.some(t => /mesh generation/i.test(t.title)));
    const parts = [...new Set(topics.map(t=>t.part))];
    ok('contains Part VI – Linear Algebra & Tools', parts.includes('Part VI – Linear Algebra & Tools'));
    const gpuHits = topics.filter(t => (t.title+" "+(t.tags||[]).join(' ')).toLowerCase().includes('gpu'));
    ok('searchable GPU topics present', gpuHits.length >= 1);
    ok('element chooser slug', slug('Element Types & Families (Chooser)') === 'element-types-families-chooser');

    badge.textContent = `All ${results.filter(r=>r.pass).length}/${results.length} tests passed ✓`;
  }catch(e){
    badge.textContent = 'Tests encountered an error: ' + e.message;
    console.error(e);
  }
})();

// ---- Boot ---------------------------------------------------------------
renderSidebar('');
selectTopic(initFromHash().title);
</script>
