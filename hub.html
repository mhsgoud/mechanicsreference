  <style>
    :root{
      color-scheme: dark;

      /* Base — cool graphite / ink */
      --bg-deep: #04050a;
      --bg: #080a12;
      --surface-1: #0d101e;
      --surface-2: #12172a;
      --surface-3: #1a2238;

      /* Typography */
      --text: #f2f4fd;
      --text-body: #c8cfec;
      --muted: #8c96b5;

      /* Primary — periwinkle / indigo (UI chrome, links, focus) */
      --accent: #9aa6ff;
      --accent-mid: #7d8cf0;
      --accent-deep: #5c6bd8;
      --accent-glow: color-mix(in srgb, var(--accent) 34%, transparent);
      --accent-faint: color-mix(in srgb, var(--accent) 11%, transparent);
      --accent-soft: color-mix(in srgb, var(--accent) 18%, transparent);
      --accent-line: color-mix(in srgb, var(--accent) 42%, transparent);

      /* Secondary — teal (highlights, active states, “signal”) */
      --accent-2: #3dd9c4;
      --accent-2-dim: color-mix(in srgb, var(--accent-2) 13%, transparent);

      /* Strokes */
      --border: color-mix(in srgb, var(--accent) 15%, transparent);
      --border-hover: color-mix(in srgb, var(--accent) 26%, transparent);
      --border-strong: color-mix(in srgb, var(--accent) 34%, transparent);
      --grid-line: color-mix(in srgb, var(--accent) 4.5%, transparent);

      /* Semantic */
      --danger: #fb7185;
      --danger-bg: color-mix(in srgb, var(--danger) 13%, transparent);
      --danger-border: color-mix(in srgb, var(--danger) 38%, transparent);
      --success: #4ade80;
      --success-bg: color-mix(in srgb, var(--success) 11%, transparent);
      --success-border: color-mix(in srgb, var(--success) 34%, transparent);

      --shadow: 0 4px 8px rgba(0,0,0,.16), 0 26px 56px rgba(0,0,0,.4);
      --shadow-soft: 0 12px 44px rgba(4, 8, 28, 0.55);
      --radius: 18px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --transition: 0.2s var(--ease);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    ::selection{
      background: color-mix(in srgb, var(--accent) 38%, transparent);
      color: var(--text);
    }
    body{
      margin:0;
      font-family: "DM Sans", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-feature-settings: "kern" 1, "liga" 1;
      color:var(--text);
      background-color: var(--bg-deep);
      background-image:
        radial-gradient(ellipse 120% 85% at 50% -25%, color-mix(in srgb, var(--accent) 15%, transparent), transparent 58%),
        radial-gradient(ellipse 65% 45% at 100% -5%, color-mix(in srgb, var(--accent-2) 9%, transparent), transparent 52%),
        radial-gradient(ellipse 50% 40% at 0% 100%, color-mix(in srgb, var(--accent-mid) 6%, transparent), transparent 55%),
        linear-gradient(168deg, var(--bg-deep) 0%, var(--bg) 38%, color-mix(in srgb, var(--surface-1) 65%, var(--bg-deep)) 100%);
      background-attachment: fixed;
    }
    body::before{
      content:"";
      position:fixed;inset:0;pointer-events:none;z-index:0;
      opacity:0.55;
      background-image:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 90% 70% at 50% 40%, black 18%, transparent 78%);
    }
    .app{
      position:relative;z-index:1;
      display:grid;
      grid-template-columns: minmax(280px, 320px) 1fr;
      grid-template-rows: auto 1fr;
      grid-template-areas:
        "header header"
        "sidebar content";
      height:100vh;
    }
    header{
      grid-area:header;
      position:sticky;top:0;z-index:20;
      backdrop-filter:saturate(160%) blur(14px);
      -webkit-backdrop-filter:saturate(160%) blur(14px);
      background:linear-gradient(180deg, color-mix(in srgb, var(--surface-1) 88%, transparent), color-mix(in srgb, var(--bg) 76%, transparent));
      border-bottom:1px solid var(--border);
      box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 12px 40px rgba(0,0,0,.2);
      display:flex;align-items:center;gap:16px;
      padding:14px 20px;
    }
    header .brand{
      display:flex;align-items:center;gap:14px;
      text-decoration:none;color:inherit;min-width:0;
    }
    header .brand:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:10px}
    .visually-hidden{
      position:absolute;width:1px;height:1px;padding:0;margin:-1px;
      overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
    }
    .logo{
      width:34px;height:34px;border-radius:10px;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.16) 0%, transparent 52%),
        linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 48%, var(--accent-2) 100%);
      box-shadow:
        0 0 0 1px color-mix(in srgb, white 14%, transparent) inset,
        0 4px 18px var(--accent-glow),
        var(--shadow-soft);
    }
    .title{
      font-weight:700;
      letter-spacing:-0.02em;
      font-size:1.05rem;
      white-space:nowrap;
      background: linear-gradient(92deg, var(--text) 0%, color-mix(in srgb, var(--accent) 72%, var(--text)) 100%);
      -webkit-background-clip:text;
      background-clip:text;
      color: transparent;
    }
    .top-nav{
      display:flex;align-items:center;gap:4px;
      margin-left:8px;
    }
    .top-nav a{
      color:var(--muted);text-decoration:none;
      font-size:13px;font-weight:500;
      padding:8px 12px;border-radius:999px;
      transition: color var(--transition), background var(--transition);
    }
    .top-nav a:hover{color:var(--text);background:var(--accent-faint)}
    .top-nav a.active{
      color:var(--text);
      background:var(--accent-soft);
      box-shadow: inset 0 0 0 1px var(--border);
    }
    .top-nav a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .search{
      margin-left:auto;display:flex;align-items:center;gap:10px;
      background: color-mix(in srgb, var(--surface-2) 92%, transparent);
      border:1px solid var(--border);
      border-radius:999px;
      padding:8px 14px;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .search svg{color:var(--muted);flex-shrink:0;opacity:0.92}
    .search svg path{fill:currentColor}
    .search:focus-within{
      border-color: var(--border-strong);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .search input{
      background:transparent;border:none;outline:none;color:var(--text);
      width:min(260px, 42vw);
      font-family:inherit;font-size:14px;
    }
    .search input::placeholder{color: color-mix(in srgb, var(--muted) 78%, transparent)}

    .sidebar{
      grid-area:sidebar;overflow:auto;scrollbar-gutter:stable;
      scrollbar-width: thin;
      scrollbar-color: color-mix(in srgb, var(--accent) 32%, transparent) transparent;
      border-right:1px solid var(--border);
      background:linear-gradient(180deg, color-mix(in srgb, var(--surface-1) 96%, transparent), color-mix(in srgb, var(--surface-2) 97%, transparent));
      padding:18px 14px 24px;
      box-shadow: 4px 0 24px rgba(0,0,0,.15);
    }
    .part{
      margin:18px 0 10px;padding-left:2px;
      color:var(--muted);font-size:11px;font-weight:600;
      text-transform:uppercase;letter-spacing:.14em;
      display:flex;align-items:center;gap:8px;
    }
    .part::before{
      content:"";width:3px;height:3px;border-radius:50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 8px var(--accent-glow);
    }
    .tabs{display:flex;flex-direction:column;gap:4px}
    .tab{
      position:relative;
      display:flex;align-items:center;gap:10px;
      padding:11px 14px 11px 16px;border-radius:12px;
      border:1px solid transparent;cursor:pointer;
      color:var(--text);text-align:left;background:transparent;
      font-family:inherit;font-size:13px;
      transition: background var(--transition), border-color var(--transition), transform var(--transition), box-shadow var(--transition);
    }
    .tab::before{
      content:"";position:absolute;left:0;top:50%;transform:translateY(-50%) scaleY(0);
      width:3px;height:0;border-radius:0 3px 3px 0;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      transition: height 0.25s var(--ease), transform 0.25s var(--ease);
    }
    .tab:hover{
      background: var(--accent-faint);
      border-color: var(--border-hover);
    }
    .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .tab.active{
      background:linear-gradient(135deg, var(--accent-soft), var(--accent-2-dim));
      border-color: var(--border-strong);
      box-shadow: inset 0 1px 0 color-mix(in srgb, white 6%, transparent);
    }
    .tab.active::before{
      height:60%;transform:translateY(-50%) scaleY(1);
    }
    .tab small{color:var(--muted);font-size:11.5px;line-height:1.35;margin-top:2px;display:block;font-weight:400}

    .content{
      grid-area:content;overflow:auto;padding:28px 24px 40px;
      scrollbar-width: thin;
      scrollbar-color: color-mix(in srgb, var(--accent) 28%, transparent) transparent;
    }
    .card{
      position:relative;
      background:linear-gradient(165deg, color-mix(in srgb, var(--surface-3) 88%, transparent) 0%, color-mix(in srgb, var(--surface-1) 94%, transparent) 100%);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow: var(--shadow);
      padding:28px 28px 32px;
      max-width:1100px;margin:0 auto 20px;
      overflow:hidden;
    }
    .card::before{
      content:"";
      position:absolute;top:0;left:0;right:0;height:1px;
      background: linear-gradient(90deg, transparent, var(--accent-line), color-mix(in srgb, var(--accent-2) 38%, transparent), transparent);
      opacity:0.95;
    }
    .card::after{
      content:"";
      position:absolute;top:-40%;right:-20%;width:55%;height:80%;
      background: radial-gradient(ellipse, color-mix(in srgb, var(--accent) 9%, transparent) 0%, transparent 70%);
      pointer-events:none;
    }
    .card > *{position:relative;z-index:1}
    .breadcrumbs{
      display:flex;flex-wrap:wrap;align-items:center;gap:6px;
      font-size:12.5px;color:var(--muted);margin-bottom:16px;
    }
    .breadcrumbs span{display:inline-flex;align-items:center;gap:6px}
    .breadcrumbs span::after{
      content:"";display:inline-block;width:4px;height:4px;border-radius:50%;
      margin:0 6px;background: color-mix(in srgb, var(--muted) 38%, transparent);
      vertical-align:middle;
    }
    .breadcrumbs span:last-child{color:var(--text);font-weight:600}
    .breadcrumbs span:last-child::after{display:none}

    h1{
      margin:.15em 0 .55em 0;
      font-size:clamp(1.5rem, 2.5vw, 1.85rem);
      font-weight:700;
      letter-spacing:-0.03em;
      line-height:1.2;
      position:relative;z-index:1;
    }
    h2{
      margin:1.35em 0 .5em;
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:0.1em;
      color:var(--muted);
      font-weight:600;
    }
    p{line-height:1.7;color:var(--text-body)}
    ul{margin:.35em 0 1em 0;padding-left:1.25em}
    li{margin:.4em 0;padding-left:0.15em}
    li::marker{color: color-mix(in srgb, var(--accent) 62%, var(--accent-2))}

    .badges{display:flex;flex-wrap:wrap;gap:8px;margin:.5em 0 1.35em}
    .badge{
      font-size:11px;font-weight:500;
      color: color-mix(in srgb, var(--accent) 45%, var(--text-body));
      background: linear-gradient(135deg, color-mix(in srgb, var(--surface-3) 85%, transparent), color-mix(in srgb, var(--surface-2) 92%, transparent));
      border:1px solid var(--border-hover);
      padding:6px 12px;border-radius:999px;
      box-shadow: 0 1px 0 color-mix(in srgb, white 5%, transparent) inset;
    }

    .cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
    .btn{
      appearance:none;border:none;cursor:pointer;
      color: var(--bg-deep);
      background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 92%, white) 0%, var(--accent-mid) 46%, var(--accent-deep) 100%);
      padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;
      font-family:inherit;
      box-shadow: 0 2px 0 color-mix(in srgb, white 18%, transparent) inset, 0 8px 28px var(--accent-glow);
      transition: transform var(--transition), box-shadow var(--transition), filter var(--transition);
    }
    .btn:hover{
      transform: translateY(-1px);
      filter: brightness(1.05) saturate(1.04);
      box-shadow: 0 2px 0 color-mix(in srgb, white 22%, transparent) inset, 0 14px 36px var(--accent-glow);
    }
    .btn:active{transform: translateY(0)}
    .btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:3px}
    .btn.secondary{
      background: color-mix(in srgb, var(--surface-2) 88%, transparent);
      border:1px solid var(--border);
      color:var(--text);
      box-shadow: none;
    }
    .btn.secondary:hover{
      background: var(--accent-faint);
      border-color: var(--border-strong);
      filter: none;
    }

    .footer{opacity:.85;font-size:12px;color:var(--muted);text-align:center;margin-top:28px}
    .footer code{
      font-family:"JetBrains Mono", ui-monospace, monospace;
      font-size:11px;
      padding:2px 8px;border-radius:6px;
      background: color-mix(in srgb, var(--surface-2) 92%, transparent);
      border:1px solid var(--border);
      color: color-mix(in srgb, var(--accent) 35%, var(--text-body));
    }

    /* Topic illustrations (inline SVG) */
    .figure-section{margin-top:1.5rem}
    .figure-section > h2{margin-top:0}
    .figure-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(min(100%, 240px), 1fr));
      gap:14px;
      margin-top:10px;
    }
    .figure-card{
      margin:0;
      border:1px solid var(--border);
      border-radius:14px;
      padding:14px;
      background: color-mix(in srgb, var(--surface-1) 90%, var(--accent-faint));
    }
    .figure-card figcaption{
      font-size:11.5px;
      color:var(--muted);
      margin-top:10px;
      line-height:1.5;
    }
    .figure-card .illustration-svg{
      width:100%;
      height:auto;
      max-height:200px;
      display:block;
      color: color-mix(in srgb, var(--accent) 55%, var(--text-body));
    }
    .figure-card .illustration-svg .ink{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .figure-card .illustration-svg .ink-thick{stroke-width:3.5}
    .figure-card .illustration-svg .muted-line{stroke:var(--muted);stroke-dasharray:5 4;opacity:0.85}
    .figure-card .illustration-svg .fill-soft{fill:color-mix(in srgb, var(--accent) 12%, transparent);stroke:none}
    .figure-card .illustration-svg text{
      fill:var(--muted);
      font-family:"DM Sans",system-ui,sans-serif;
      font-size:11px;
      font-weight:500;
    }
    .figure-card .illustration-svg .label-strong{fill:var(--text-body);font-weight:600}

    /* Interactive mini-tool */
    .tool{
      margin-top:20px;
      border:1px solid var(--border);
      border-radius:16px;
      background:linear-gradient(155deg, color-mix(in srgb, var(--surface-2) 94%, transparent), color-mix(in srgb, var(--surface-1) 97%, transparent));
      padding:18px 18px 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,.22), inset 0 1px 0 color-mix(in srgb, white 4%, transparent);
    }
    .tool-head{display:flex;align-items:flex-start;gap:14px;justify-content:space-between;flex-wrap:wrap}
    .tool-title{font-weight:700;font-size:15px;letter-spacing:-0.02em}
    .tool-sub{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.45}
    .seg{
      display:flex;flex-wrap:wrap;gap:8px;
      margin-top:14px;
    }
    .chip{
      border:1px solid var(--border);
      background: color-mix(in srgb, var(--surface-3) 72%, var(--accent) 8%);
      color:var(--text);
      padding:8px 12px;
      border-radius:999px;
      cursor:pointer;
      font-size:12px;font-family:inherit;font-weight:500;
      user-select:none;
      transition: border-color var(--transition), background var(--transition), transform var(--transition);
    }
    .chip:hover{
      border-color: var(--border-strong);
      background: var(--accent-faint);
    }
    .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .chip.active{
      background:linear-gradient(135deg, var(--accent-soft), var(--accent-2-dim));
      border-color: var(--border-strong);
      box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 16%, transparent);
    }

      ],
      avoid: [
        "Tiny cut-cells without stabilization (conditioning blow-up)",
        "Under-resolved geometry integration on cut elements"
      ],
      modes: ["small cut-cell instability","integration error","conditioning"],
      notes: "Unfitted methods buy you geometry freedom, but you pay in integration + stabilization + conditioning."
    },
    multiphysics: {
      recommend: [
        "Consistent element pairs for each field (e.g., u–T, u–p, u–c)",
        "Mixed/stabilized formulations where constraints exist",
        "hp-FEM when you need accuracy in multiple coupled fields"
      ],
      avoid: [
        "Ad-hoc couplings with mismatched interpolation (spurious modes)",
        "Too aggressive time stepping in strongly coupled problems"
      ],
      modes: ["spurious modes","locking/constraints","stability issues"],
      notes: "Coupled problems amplify weaknesses. Pick compatible spaces and verify with manufactured solutions if possible."
    }
  },
  failureModeHelp: {
    "shear locking": "Bending response too stiff in thin structures (Mindlin-type) → use proper shell/assumed strain/mixed methods.",
    "membrane locking": "In shells, artificial in-plane stiffness → improved formulations or higher order + good geometry.",
    "volumetric locking": "Near incompressible response becomes too stiff with displacement-only elements → use mixed u–p or stabilized.",
    "hourglassing": "Zero-energy modes from reduced integration → hourglass control, stabilization, or adjust integration.",
    "dispersion": "Wave speed depends on mesh → increase points-per-wavelength or use higher order (p-version/spectral).",
    "small cut-cell instability": "Unfitted methods create tiny active volumes → stabilization/aggregation, ghost penalties, conditioning strategies."
  }
};

// ---- Helpers --------------------------------------------------------------
const groupBy = (arr, key) => arr.reduce((acc, x) => ((acc[x[key]] ??= []).push(x), acc), {});
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');

function escHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

// ---- Render sidebar -------------------------------------------------------
const sidebar = document.getElementById('sidebar');
function renderSidebar(filter=""){
  sidebar.innerHTML = '';
  let totalMatches = 0;
  const grouped = groupBy(topics, 'part');
  Object.entries(grouped).forEach(([part, items]) => {
    const visible = items.filter(t =>
      (t.title+" "+t.bullets.join(" ")+" "+(t.tags||[]).join(" "))
        .toLowerCase().includes(filter.toLowerCase())
    );
    if(visible.length === 0) return;
    totalMatches += visible.length;

    const partEl = document.createElement('div');
    partEl.className = 'part';
    partEl.textContent = part;
    sidebar.appendChild(partEl);

    const list = document.createElement('div');
    list.className = 'tabs';
    visible.forEach(t => {
      const b = document.createElement('button');
      b.className = 'tab';
      b.id = 'tab-' + slug(t.title);
      b.setAttribute('data-slug', slug(t.title));
      b.innerHTML = `<div><div>${escHtml(t.title)}</div><small>${escHtml((t.tags||[]).slice(0,3).join(' · '))}</small></div>`;
      b.addEventListener('click', () => selectTopic(t.title));
      list.appendChild(b);
    });
    sidebar.appendChild(list);
  });

  if(totalMatches === 0){
    const empty = document.createElement('div');
    empty.style.color = 'var(--muted)';
    empty.style.padding = '8px 10px';
    empty.textContent = 'No results. Try different keywords.';
    sidebar.appendChild(empty);
  }
}

// ---- Interactive widget renderers ----------------------------------------
function renderElementChooserWidget(){
  const defaultId = "solids";
  const toolId = "element-tool";
  const pickId = "element-pick";

  const chips = elementChooser.problems.map(p =>
    `<button class="chip ${p.id===defaultId?'active':''}" data-problem="${p.id}" type="button">${escHtml(p.label)}</button>`
  ).join("");

  return `
    <div class="tool" id="${toolId}">
      <div class="tool-head">
        <div>
          <div class="tool-title">Element Chooser</div>
          <div class="tool-sub">Pick a problem type → see recommended element families + failure modes to watch.</div>
        </div>
        <div class="tool-sub muted">Tip: try <span class="mono">incompressible</span>, <span class="mono">waves</span>, <span class="mono">complex CAD</span>.</div>
      </div>

      <div class="seg" role="tablist" aria-label="Problem type">
        ${chips}
      </div>

      <div class="grid2" id="${pickId}">
        <!-- filled by JS -->
      </div>
    </div>
  `;
}

function mountElementChooser(){
  const host = document.getElementById('element-pick');
  const tool = document.getElementById('element-tool');
  if(!host || !tool) return;

  function render(problemId){
    const rule = elementChooser.rules[problemId] || elementChooser.rules.solids;
    const rec = rule.recommend.map(x=>`<li>${escHtml(x)}</li>`).join("");
    const avoid = rule.avoid.map(x=>`<li>${escHtml(x)}</li>`).join("");
    const modes = (rule.modes||[]).map(m=>{
      const key = String(m);
      const help = elementChooser.failureModeHelp[key] || "";
      const cls = /locking|hourglass|instability|dispersion|spurious/i.test(key) ? "warn" : "";
      const title = help ? ` title="${escHtml(help)}"` : "";
      return `<span class="pill ${cls}"${title}>${escHtml(key)}</span>`;
    }).join("");

    const note = rule.notes ? `<p class="muted" style="margin:.4em 0 0 0">${escHtml(rule.notes)}</p>` : "";

    host.innerHTML = `
      <div class="panel">
        <h3>Recommended</h3>
        <ul>${rec}</ul>
        ${note}
      </div>
      <div class="panel">
        <h3>Watch-outs</h3>
        <ul>${avoid}</ul>
        <div class="kv" style="margin-top:10px">
          ${modes}
        </div>
        <p class="muted" style="margin:.6em 0 0 0">Hover the pills for quick explanations.</p>
      </div>
    `;
  }

  render("solids");

  tool.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      tool.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
      btn.classList.add('active');
      render(btn.getAttribute('data-problem'));
    });
  });
}

  }
}

// ---- Selection + deep-linking --------------------------------------------
function selectTopic(title){
  const t = topics.find(x => x.title === title);
  if(!t) return;
  renderContent(t);
  const h = '#'+slug(t.title);
  if(location.hash !== h){ history.replaceState(null,'',h); }
  document.title = t.title + ' | Mechanics Reference';
  const desc = document.querySelector('meta[name="description"]');
  if(desc && t.bullets && t.bullets[0]){
    const summary = String(t.bullets[0]).replace(/\s+/g,' ').slice(0, 155);
    desc.setAttribute('content', summary + (t.bullets[0].length > 155 ? '…' : ''));
  }
  content.focus({preventScroll:false});
}

function initFromHash(){
  const h = location.hash.replace('#','');
  const byHash = topics.find(t => slug(t.title) === h);
  return byHash || topics[0];
}

// ---- Search ---------------------------------------------------------------
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', (e)=>{
  const q = e.target.value || '';
  renderSidebar(q);
});

// ---- Keyboard navigation --------------------------------------------------
window.addEventListener('keydown', (e)=>{
  if(e.ctrlKey && e.key.toLowerCase() === 'k'){
    e.preventDefault();searchInput.focus();
  }
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    const tabs = Array.from(document.querySelectorAll('.tab'));
    if(tabs.length === 0) return;
    const activeIndex = tabs.findIndex(t=>t.classList.contains('active'));
    const target = (activeIndex === -1)
      ? 0
      : (e.key==='ArrowDown' ? Math.min(tabs.length-1, activeIndex+1) : Math.max(0, activeIndex-1));
    tabs[target].click();
    tabs[target].scrollIntoView({block:'nearest'});
  }
});

// ---- Tiny test harness ----------------------------------------------------
(function runSelfTests(){
  const badge = document.getElementById('test-badge');
  const results = [];
  function ok(name, cond){
    const pass = !!cond; results.push({name, pass});
    console[pass? 'log' : 'error'](`${pass? 'PASS':'FAIL'}: ${name}`);
    return pass;
  }
  try{
    ok('topics is an array with items', Array.isArray(topics) && topics.length > 0);
    ok('each topic has part/title/bullets', topics.every(t => t && t.part && t.title && Array.isArray(t.bullets)));
    ok('element chooser topic exists', topics.some(t => t.interactive === 'elementChooser'));
    ok('mesh generation topic exists', topics.some(t => /mesh generation/i.test(t.title)));
    const parts = [...new Set(topics.map(t=>t.part))];
    ok('contains Part VI – Linear Algebra & Tools', parts.includes('Part VI – Linear Algebra & Tools'));
    const gpuHits = topics.filter(t => (t.title+" "+(t.tags||[]).join(' ')).toLowerCase().includes('gpu'));
    ok('searchable GPU topics present', gpuHits.length >= 1);

    // deep link/select test
    const initial = initFromHash();
    selectTopic('Element Types & Families (Chooser)');
    ok('selectTopic changes hash to element chooser', location.hash.includes(slug('Element Types & Families (Chooser)')));
    selectTopic(initial.title);
    ok('restored initial topic after test', location.hash.includes(slug(initial.title)));

    badge.textContent = `All ${results.filter(r=>r.pass).length}/${results.length} tests passed ✓`;
  }catch(e){
    badge.textContent = 'Tests encountered an error: ' + e.message;
    console.error(e);
  }
})();
