function renderContent(topic){
  const prose = (topic.bullets||[]).map(x => `<p>${escHtml(x)}</p>`).join('');

  const interactiveBlock =
    topic.interactive === "elementChooser"
      ? renderElementChooserWidget()
      : "";

  const illustrationsBlock = renderTopicIllustrations(topic);
  const sceneBlock = renderTopicScene(topic);
  const sourceBlock = (topic.sources && topic.sources.length)
    ? `<p class="muted" style="margin-top:1.6em">${topic.sources.map(s => `<a href="${escHtml(s.href)}">${escHtml(s.label)}</a>`).join('<br>')}</p>`
    : "";

  const eqBlock = (topic.equations && topic.equations.length)
    ? `<h2>Field equations</h2>
      <div class="eq-list">${topic.equations.map(eq => `
        <article class="eq-card">
          <h3>${escHtml(eq.name)}</h3>
          <div class="eq">${escHtml(eq.expr)}</div>
          <p>${escHtml(eq.note)}</p>
        </article>`).join('')}</div>`
    : "";

  content.innerHTML = `
    <article class="card">
      <div class="breadcrumbs"><span>${escHtml(topic.part)}</span><span>${escHtml(topic.title)}</span></div>
      <h1>${escHtml(topic.title)}</h1>
      ${eqBlock}
      <div class="prose">${prose}</div>
      ${sceneBlock}
      ${illustrationsBlock}
      ${interactiveBlock}
      ${sourceBlock}
    </article>
  `;

  // Update active state
  document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
  const active = document.querySelector(`#tab-${slug(topic.title)}`);
  if(active) active.classList.add('active');

  // Mount interactive widgets AFTER DOM update
  if(topic.interactive === "elementChooser"){
    mountElementChooser();
  }
}

// ---- Selection + deep-linking --------------------------------------------
function selectTopic(title){
  const t = topics.find(x => x.title === title);
  if(!t) return;
  renderContent(t);
  const h = '#'+slug(t.title);
  if(location.hash !== h){ history.replaceState(null,'',h); }
  document.title = t.title + ' | Mechanics Reference';
  const desc = document.querySelector('meta[name="description"]');
  if(desc && t.bullets && t.bullets[0]){
    const summary = String(t.bullets[0]).replace(/\s+/g,' ').slice(0, 155);
    desc.setAttribute('content', summary + (t.bullets[0].length > 155 ? '…' : ''));
  }
  content.focus({preventScroll:false});
}

function initFromHash(){
  const h = location.hash.replace('#','');
  const byHash = topics.find(t => slug(t.title) === h);
  return byHash || topics.find(t => t.title === "Introduction to Continuum Mechanics") || topics[0];
}

// ---- Search ---------------------------------------------------------------
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', (e)=>{
  const q = e.target.value || '';
  renderSidebar(q);
});

// ---- Keyboard navigation --------------------------------------------------
window.addEventListener('keydown', (e)=>{
  if(e.ctrlKey && e.key.toLowerCase() === 'k'){
    e.preventDefault();searchInput.focus();
  }
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    const tabs = Array.from(document.querySelectorAll('.tab'));
    if(tabs.length === 0) return;
    const activeIndex = tabs.findIndex(t=>t.classList.contains('active'));
    const target = (activeIndex === -1)
      ? 0
      : (e.key==='ArrowDown' ? Math.min(tabs.length-1, activeIndex+1) : Math.max(0, activeIndex-1));
    tabs[target].click();
    tabs[target].scrollIntoView({block:'nearest'});
  }
});

// ---- Tiny test harness ----------------------------------------------------
(function runSelfTests(){
  const badge = document.getElementById('test-badge');
  const results = [];
  function ok(name, cond){
    const pass = !!cond; results.push({name, pass});
    console[pass? 'log' : 'error'](`${pass? 'PASS':'FAIL'}: ${name}`);
    return pass;
  }
  try{
    ok('topics is an array with items', Array.isArray(topics) && topics.length > 0);
    ok('each topic has part/title/bullets', topics.every(t => t && t.part && t.title && Array.isArray(t.bullets)));
    ok('element chooser topic exists', topics.some(t => t.interactive === 'elementChooser'));
    ok('mesh generation topic exists', topics.some(t => /mesh generation/i.test(t.title)));
    const parts = [...new Set(topics.map(t=>t.part))];
    ok('contains Part VI – Linear Algebra & Tools', parts.includes('Part VI – Linear Algebra & Tools'));
    const gpuHits = topics.filter(t => (t.title+" "+(t.tags||[]).join(' ')).toLowerCase().includes('gpu'));
    ok('searchable GPU topics present', gpuHits.length >= 1);
    ok('element chooser slug', slug('Element Types & Families (Chooser)') === 'element-types-families-chooser');
    ok('variational principles topic', topics.some(t => t.title === 'Variational Principles'));
    ok('mixed methods topic', topics.some(t => t.title === 'Mixed Methods and Locking'));
    ok('contact topic', topics.some(t => t.title === 'Contact and Friction'));
    ok('arc-length topic', topics.some(t => t.title === 'Path Following and Arc-Length'));
    ok('buckling scene wired', topics.some(t => t.scene === 'columnBuckling'));
    ok('fiber composites topic', topics.some(t => t.title === 'Fiber-Reinforced Composites'));
    ok('embedded fiber models topic', topics.some(t => t.title === 'Embedded Fiber Models'));
    ok('fiber neutrality topic', topics.some(t => t.title === 'Fiber Neutrality and Rigid Line Inclusions'));
    ok('fiber neutrality scene wired', topics.some(t => t.scene === 'fiberNeutrality3d'));
    ok('fiber electrodes topic', topics.some(t => t.title === 'Fiber-Based Electrodes'));

    badge.textContent = `All ${results.filter(r=>r.pass).length}/${results.length} tests passed ✓`;
  }catch(e){
    badge.textContent = 'Tests encountered an error: ' + e.message;
    console.error(e);
  }
})();

// ---- Boot ---------------------------------------------------------------
renderSidebar('');
selectTopic(initFromHash().title);
</script>
