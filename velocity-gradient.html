<body>
  <header>

    <div class="page-copy">
      <p class="crumb"><a href="./">Home</a> · <a href="hub.html#velocity-gradient-and-material-derivative">Velocity gradient</a></p>
      <h1>Stretching and spin</h1>
      <p class="standfirst">The spatial velocity gradient splits as <i>L</i> = <i>D</i> + <i>W</i>. The symmetric part <i>D</i> stretches a material cross. The skew part <i>W</i> only spins it. Simple shear contains both.</p>
    </div>
    <div class="figure-shell">
      <div id="stage"></div>
      <div id="ui">
        <p id="formula">L = Ḟ F⁻¹ = D + W</p>
        <p id="phase"></p>
      </div>
    </div>
  </main>
  <footer><div class="wrap"><span>Mechanics Reference</span><span><a href="hub.html#velocity-gradient-and-material-derivative">Velocity gradient</a></span></div></footer>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

    const stage = document.getElementById('stage');
    const phase = document.getElementById('phase');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a2740);
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 40);
    camera.position.set(0, 0, 10);
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    stage.appendChild(renderer.domElement);
    const labels = new CSS2DRenderer();
    labels.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none';
    stage.appendChild(labels.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    scene.add(new THREE.AmbientLight(0xffffff, 1.5));

    function cross(color) {
      const g = new THREE.BufferGeometry();
      const m = new THREE.LineSegments(g, new THREE.LineBasicMaterial({color, linewidth:2}));
      scene.add(m);
      return m;
    }
    const left = cross(0xe39a4a), right = cross(0x6dcc9c), mid = cross(0xef4444);
    function setCross(mesh, origin, axes) {
      const a = origin.clone().add(axes[0]), b = origin.clone().sub(axes[0]);
      const c = origin.clone().add(axes[1]), d = origin.clone().sub(axes[1]);
      mesh.geometry.setAttribute('position', new THREE.Float32BufferAttribute([
        a.x,a.y,a.z, b.x,b.y,b.z, c.x,c.y,c.z, d.x,d.y,d.z
      ], 3));
    }
    function tag(text, pos) {
      const d=document.createElement('div'); d.className='label'; d.textContent=text;
      const o=new CSS2DObject(d); o.position.copy(pos); scene.add(o);
    }
    tag('D', new THREE.Vector3(-3.3, 2.2, 0));
    tag('W', new THREE.Vector3(0, 2.2, 0));
    tag('L = D + W', new THREE.Vector3(3.3, 2.2, 0));

    const e1 = new THREE.Vector3(1.15, 0, 0), e2 = new THREE.Vector3(0, 1.15, 0);
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const clock = new THREE.Clock();
    let running = !reduce;
    document.addEventListener('visibilitychange', ()=>{ running = !document.hidden && !reduce; });

    function frame(t) {
      const s = 0.5 + 0.5*Math.sin(t * 1.1);
      const stretch = 1 + 0.45*s;
      const compress = 1 / stretch;
      const ang = 0.7 * s;
      const c = Math.cos(ang), sn = Math.sin(ang);
      const D1 = new THREE.Vector3(stretch, 0, 0).multiplyScalar(1.15);
      const D2 = new THREE.Vector3(0, compress, 0).multiplyScalar(1.15);
      const W1 = new THREE.Vector3(c, sn, 0).multiplyScalar(1.15);
      const W2 = new THREE.Vector3(-sn, c, 0).multiplyScalar(1.15);
      const L1 = new THREE.Vector3(stretch*c, stretch*sn, 0).multiplyScalar(1.0);
      const L2 = new THREE.Vector3(-compress*sn, compress*c, 0).multiplyScalar(1.0);
      setCross(left, new THREE.Vector3(-3.3,0,0), [D1, D2]);
      setCross(right, new THREE.Vector3(0,0,0), [W1, W2]);
      setCross(mid, new THREE.Vector3(3.3,0,0), [L1, L2]);
      phase.textContent = 'Left stretches. Centre spins. Right does both — a small piece of simple shear.';
    }
    function resize(){ const w=Math.max(1,stage.clientWidth), h=Math.max(1,stage.clientHeight); camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h,false); labels.setSize(w,h); }
    new ResizeObserver(resize).observe(stage); resize();
    frame(reduce ? 1 : 0);
    (function loop(){ requestAnimationFrame(loop); if(running) frame(clock.getElapsedTime()); controls.update(); renderer.render(scene,camera); labels.render(scene,camera); })();
  </script>
</body>
