<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 112" role="img" aria-labelledby="title desc">
<title id="title">Mechanics Reference</title>
<desc id="desc">The initial M in Mechanics is constructed from connected triangular finite elements with shared nodes. A highlighted element and warm central node reveal the discretization within the letter.</desc>
<!-- A conforming triangulation follows the M boundary, not a clipped decorative pattern. -->
<g stroke="#a9c9e8" stroke-width="1.15" stroke-linejoin="round">
<path d="M10 72L10 12L27 12L27 72Z" fill="#284c70"/>
<path d="M10 12L27 36L10 42Z" fill="#477aa8"/>
<path d="M10 12L27 12L27 36Z" fill="#c7ddef"/>
<path d="M10 42L27 36L27 42Z" fill="#739fc7"/>
<path d="M10 42L27 42L27 72Z" fill="#8bb4d8"/>
<path d="M10 42L27 72L10 72Z" fill="#355f87"/>
<path d="M27 12L47 39L47 61L27 36Z" fill="#779fc3"/>
<path d="M27 12L47 39L27 36Z" fill="#e3edf8"/>
<path d="M47 39L67 12L67 36L47 61Z" fill="#487cad"/>
<path d="M47 39L67 36L47 61Z" fill="#edb879" stroke="#f5d0a3"/>
<path d="M67 12L84 12L84 72L67 72Z" fill="#3e6a95"/>
<path d="M67 12L84 12L67 36Z" fill="#c7ddef"/>
<path d="M84 12L84 42L67 36Z" fill="#739fc7"/>
<path d="M67 36L84 42L67 42Z" fill="#477aa8"/>
<path d="M67 42L84 42L67 72Z" fill="#e0ebf7"/>
<path d="M84 42L84 72L67 72Z" fill="#8eb7dd"/>
</g>
