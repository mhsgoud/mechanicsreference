*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#233e5b;font:14px/1.6 system-ui}main{padding:24px;max-width:1050px;margin:auto}.eyebrow{font-size:10px;letter-spacing:.16em;color:#67809a}h1{font-size:24px;font-weight:550;margin:5px 0 10px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:24px}svg{width:100%;height:auto;background:white;border:1px solid #dce4ee;border-radius:12px}label{display:block;margin:12px 0 5px}select,input{width:100%;accent-color:#2b78af}select{padding:8px;border:1px solid #b9cada;border-radius:7px;background:white;color:inherit}output{display:block;background:#e5eef8;border-radius:8px;padding:12px;margin-top:18px;font-variant-numeric:tabular-nums}.note{color:#63758a;font-size:12px}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;text-align:center;background:#fff;margin-top:15px}td,th{border:1px solid #d9e3ed;padding:8px}th{background:#eaf0f7}.shared{background:#dcecfb}.footer{border-top:1px solid #dce4ee;padding-top:12px;margin-top:18px}button{background:#214f7b;color:white;border:0;border-radius:6px;padding:7px 12px;cursor:pointer}@media(max-width:620px){main{padding:16px}.layout{grid-template-columns:1fr;gap:8px}h1{font-size:21px}}
</style></head><body><main><div class="eyebrow">PART II / NUMERICAL EXPERIMENT</div><h1></h1><p id="intro"></p><div class="layout"><section><svg id="plot" viewBox="0 0 600 330" role="img"></svg><div id="matrix"></div></section><section id="controls"></section></div><p id="explain" class="footer"></p><p class="library-link"><a href="/hub.html#numerical-integration-gauss-quadrature" target="_top">Return to the library →</a></p></main><script>
const $=id=>document.getElementById(id),assembly=new URLSearchParams(location.search).get('mode')==='assembly';
document.title=assembly?'Assembly lab — Mechanics Reference':'Gauss quadrature lab — Mechanics Reference';
const lib=document.querySelector('.library-link a');
if(lib) lib.href=assembly?'/hub.html#assembly-of-the-global-stiffness-matrix':'/hub.html#numerical-integration-gauss-quadrature';
const rules={1:[[0],[2]],2:[[-1/Math.sqrt(3),1/Math.sqrt(3)],[1,1]],3:[[-Math.sqrt(3/5),0,Math.sqrt(3/5)],[5/9,8/9,5/9]],4:[[-.8611363115940526,-.3399810435848563,.3399810435848563,.8611363115940526],[.3478548451374538,.6521451548625461,.6521451548625461,.3478548451374538]]};
const line=(x1,y1,x2,y2,color='#9db2c7',width=1)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${width}"/>`;
const text=(x,y,t)=>`<text x="${x}" y="${y}" fill="#49627d" font-family="system-ui" font-size="13">${t}</text>`;
if(!assembly){
 document.querySelector('h1').textContent='How many integration points are enough?';$('intro').textContent='Change the integrand and compare the weighted samples with its exact integral over [−1, 1].';$('plot').setAttribute('aria-label','Integrand curve and Gauss points');
 $('controls').innerHTML='<label for="function">Integrand f(ξ)</label><select id="function"><option value="2">ξ²</option><option value="4">ξ⁴</option><option value="6">ξ⁶</option><option value="exp">exp(ξ)</option></select><label for="points">Gauss points</label><select id="points"><option>1</option><option selected>2</option><option>3</option><option>4</option></select><output id="result" aria-live="polite"></output><p class="note">Blue: integrand. Orange: evaluation points. Listed weights belong to the parent interval; include the mapping Jacobian for a physical element.</p>';
 function update(){const kind=$('function').value,n=+$('points').value,[nodes,weights]=rules[n],f=x=>kind==='exp'?Math.exp(x):x**+kind,exact=kind==='exp'?Math.E-1/Math.E:2/(+kind+1),approx=nodes.reduce((a,x,i)=>a+weights[i]*f(x),0),max=kind==='exp'?3:1.2,X=x=>55+(x+1)*245,Y=y=>275-y/max*230;let svg=line(55,275,550,275)+line(300,35,300,275)+text(47,301,'−1')+text(295,301,'0')+text(539,301,'1')+text(17,30,'f(ξ)');let d='';for(let i=0;i<=160;i++){const x=-1+i/80;d+=(i?'L':'M')+X(x)+','+Y(f(x));}svg+=`<path d="${d}" fill="none" stroke="#2876ad" stroke-width="3"/>`;nodes.forEach((x,i)=>{svg+=line(X(x),275,X(x),Y(f(x)),'#d98540',2)+`<circle cx="${X(x)}" cy="${Y(f(x))}" r="6" fill="#d98540"/>`;});$('plot').innerHTML=svg;$('result').innerHTML=`Quadrature: <b>${approx.toFixed(6)}</b><br>Exact: ${exact.toFixed(6)}<br>Absolute error: ${Math.abs(approx-exact).toExponential(2)}`;$('matrix').innerHTML='<table><thead><tr><th>Point ξ</th><th>Weight w</th><th>w f(ξ)</th></tr></thead><tbody>'+nodes.map((x,i)=>`<tr><td>${x.toFixed(5)}</td><td>${weights[i].toFixed(5)}</td><td>${(weights[i]*f(x)).toFixed(5)}</td></tr>`).join('')+'</tbody></table>';$('explain').textContent=n===1&&kind!=='exp'?'The center sample is zero, although the integral is positive. In an element stiffness, missing a deformation mode can create a spurious zero-energy mode.':`This rule is exact for polynomials through degree ${2*n-1}. Exponential functions and general distorted-element integrands are not covered by that polynomial guarantee.`;window.labResult={approx,exact,error:Math.abs(approx-exact)};}
 $('function').onchange=$('points').onchange=update;update();
}else{
 document.querySelector('h1').textContent='Two elements. One shared equilibrium equation.';$('intro').textContent='An axial chain uses nodes 1–2 and 2–3. Change the second stiffness and inspect what is added at the shared node.';$('plot').setAttribute('aria-label','Two axial elements and a shared middle node');$('controls').innerHTML='<label for="stiffness">Element 2 stiffness k₂ (N/mm)</label><input id="stiffness" type="range" min="1" max="10" step="1" value="4"><label><input id="support" type="checkbox" checked style="width:auto"> Fix node 1</label><output id="result" aria-live="polite"></output><p class="note">k₁ = 2 N/mm. A +1 N force acts at node 3. Axial small-displacement model; displayed geometry is schematic.</p>';
 function update(){const k=+$('stiffness').value,fixed=$('support').checked,K=[[2,-2,0],[-2,2+k,-k],[0,-k,k]];$('plot').innerHTML=line(85,160,300,160,'#337ab0',18)+line(300,160,515,160,'#d58949',18)+[85,300,515].map((x,i)=>`<circle cx="${x}" cy="160" r="12" fill="#fff" stroke="#355c80" stroke-width="3"/>`+text(x-20,197,'Node '+(i+1))).join('')+text(130,123,'k₁ = 2 N/mm')+text(345,123,`k₂ = ${k} N/mm`)+line(530,160,580,160,'#355c80',3)+text(539,143,'1 N')+(fixed?line(65,118,65,202,'#355c80',6)+text(43,239,'u₁ = 0'):text(80,239,'No support: rigid translation remains'))+text(65,40,'Connectivity: element 1 → [1, 2]    element 2 → [2, 3]');$('matrix').innerHTML='<table aria-label="Global stiffness matrix"><thead><tr><th>K (N/mm)</th><th>u₁</th><th>u₂</th><th>u₃</th></tr></thead><tbody>'+K.map((row,i)=>`<tr><th>row ${i+1}</th>`+row.map((v,j)=>`<td class="${i===1&&j===1?'shared':''}">${v}</td>`).join('')+'</tr>').join('')+'</tbody></table>';$('result').innerHTML=fixed?`u₂ = 0.500 mm<br>u₃ = ${(0.5+1/k).toFixed(3)} mm<br>Reaction at node 1 = −1 N`:'Singular stiffness<br>No static equilibrium under the nonzero resultant load.';$('explain').textContent=`The shared diagonal is k₁ + k₂ = ${2+k}. Before applying supports every row sums to zero. Fixing node 1 removes rigid translation; element forces both become +1 N, balancing the end load and support reaction.`;window.labResult={K,fixed,u3:fixed?.5+1/k:null};}
 $('stiffness').oninput=$('support').onchange=update;update();
}
</script></body></html>
